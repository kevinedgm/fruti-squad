name: package-test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Pack and install the packed package in a clean project
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          PKG="$GITHUB_WORKSPACE/$(ls fruti-squad-*.tgz)"
          for target in claude codex kiro; do
            TMP="$(mktemp -d)"
            mkdir -p "$TMP/pkg" && tar -xzf "$PKG" -C "$TMP/pkg"
            node "$TMP/pkg/package/bin/install.mjs" install --target "$target" --dest "$TMP/project"
            test -f "$TMP/project/.fruti/policy.md"
            test -f "$TMP/project/.fruti/runtime/coco.yaml"
          done
