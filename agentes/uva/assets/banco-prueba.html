<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Uva · banco de prueba</title>
<!--
  Banco de prueba de Uva (fase U3).
  1. Pega el SVG del icono dentro de <template id="icono">.
  2. Pega 2–3 confusiones del mismo dominio dentro de <template id="confusiones"> (un <svg> por confusión, con data-nombre).
  3. Renderiza una captura y mírala:
     chromium --headless --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
       --window-size=760,640 --virtual-time-budget=1500 --screenshot=banco.png file://$PWD/banco.html
  Los vecinos son redibujos simples estilo Lucide (ISC). Prefiere iconos reales: node scripts/buscar-lucide.mjs --svg <nombre> --stroke <grosor>
  imprime el SVG de Lucide listo para pegarlo como confusión o vecino.
-->
<style>
  :root{--fondo:#ffffff;--texto:#1a1a1a;--tenue:#777;--oscuro:#0b0b0b;--lila:#a99cf0;--ambar:#d99a3c;--verde:#5fb98a}
  body{margin:0;padding:20px 24px;background:var(--fondo);color:var(--texto);font-family:system-ui,sans-serif}
  h2{font-size:13px;margin:18px 0 8px;color:var(--tenue);font-weight:600}
  .fila{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .celda{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--tenue)}
  .oscuro{background:var(--oscuro);padding:12px 16px;border-radius:10px}
  .vecino{display:block;fill:none;stroke:currentColor;stroke-width:var(--uva-stroke,1.5);stroke-linecap:round;stroke-linejoin:round}
  svg{display:block}
  .celda > svg{color:var(--texto)}
</style></head><body>

<template id="icono">
  <!-- PEGA AQUÍ EL SVG DEL ICONO -->
</template>

<template id="confusiones">
  <!-- PEGA AQUÍ 2–3 SVG con data-nombre="…" -->
</template>

<h2>Tamaños de la norma (§10: xs 14 · sm 16 · md 20 · base 24 · lg 32 · xl 48) y 96 de inspección</h2>
<div class="fila" id="tamanos"></div>

<h2>Familia a 24px: vecinos · icono · confusiones</h2>
<div class="fila" id="familia"></div>

<h2>Contexto oscuro con color por estado (22 y 44px)</h2>
<div class="oscuro"><div class="fila" id="oscuro22"></div><div class="fila" id="oscuro44" style="margin-top:10px"></div></div>

<h2>Grosor del trazo (--uva-stroke) a 24 y 48px</h2>
<div class="fila" id="grosores"></div>

<script>
  const NS = 'http://www.w3.org/2000/svg';
  const vecinos = {
    mano: '<path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
    rama: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="16" r="2.5"/><path d="M6 8.5V10a6 6 0 0 0 6 6h3.5"/>',
    casa: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
    reloj: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
  };
  const icono = document.getElementById('icono').content.querySelector('svg');
  const confusiones = [...document.getElementById('confusiones').content.querySelectorAll('svg')];

  function tam(svg, px, color, extra) {
    const c = svg.cloneNode(true);
    c.setAttribute('width', px); c.setAttribute('height', px);
    if (color) c.style.color = color;
    if (extra) for (const [k, v] of Object.entries(extra)) c.style.setProperty(k, v);
    return c;
  }
  function vecino(nombre, px, color) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'vecino');
    s.setAttribute('width', px); s.setAttribute('height', px);
    s.innerHTML = vecinos[nombre]; if (color) s.style.color = color;
    return s;
  }
  function celda(nodo, texto) {
    const d = document.createElement('div'); d.className = 'celda';
    d.append(nodo); if (texto) d.append(texto); return d;
  }

  if (!icono) {
    document.body.insertAdjacentHTML('afterbegin', '<p style="color:#b4541a">Falta el SVG en &lt;template id="icono"&gt;.</p>');
  } else {
    for (const px of [14, 16, 20, 24, 32, 48, 96]) document.getElementById('tamanos').append(celda(tam(icono, px), px + 'px'));

    const fam = document.getElementById('familia');
    fam.append(vecino('casa', 24), vecino('mano', 24), tam(icono, 24), vecino('reloj', 24));
    confusiones.forEach(c => fam.append(celda(tam(c, 24), c.dataset.nombre || 'confusión')));

    for (const [id, px] of [['oscuro22', 22], ['oscuro44', 44]]) {
      const f = document.getElementById(id);
      f.append(vecino('rama', px, 'var(--lila)'), vecino('mano', px, 'var(--ambar)'),
               tam(icono, px, 'var(--ambar)'), tam(icono, px, 'var(--verde)'), tam(icono, px, 'var(--lila)'));
      confusiones.forEach(c => f.append(tam(c, px, '#888')));
    }

    for (const g of [2, 1.5, 1.25, 1]) {
      const d = document.createElement('div'); d.className = 'celda';
      d.append(tam(icono, 48, null, {'--uva-stroke': g}), tam(icono, 24, null, {'--uva-stroke': g}), g);
      document.getElementById('grosores').append(d);
    }
  }
</script>
</body></html>
