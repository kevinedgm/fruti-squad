<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-fermenting" aria-hidden="true">
  <!-- semanticName: fermenting · category: status · objeto: tina de fermentación.
       Oculto por defecto (lo acompaña la etiqueta "Fermentando"). Si va solo y comunica algo esencial:
       quita aria-hidden y añade role="img" aria-label="Fermentando". -->
  <style>
    .uva-fermenting{stroke-width:var(--uva-stroke,1.5)}
    .uva-fermenting__acento{fill:var(--uva-accent,currentColor);stroke:none}
    /* progress: 2 ciclos de subida y la burbuja se asienta visible. Total 4.8 s (WCAG 2.2.2) */
    .uva-fermenting__burbuja{opacity:0;animation:uva-fermenting-subir 1.6s cubic-bezier(.2,.6,.3,1) 0s 2,uva-fermenting-asentar .4s ease-out 3.2s forwards}
    .uva-fermenting__burbuja:nth-of-type(2){animation:uva-fermenting-subir 1.6s cubic-bezier(.2,.6,.3,1) .6s 2,uva-fermenting-asentar .4s ease-out 3.8s forwards}
    .uva-fermenting__burbuja:nth-of-type(3){animation:uva-fermenting-subir 1.6s cubic-bezier(.2,.6,.3,1) 1.2s 2,uva-fermenting-asentar .4s ease-out 4.4s forwards}
    @keyframes uva-fermenting-subir{0%{transform:translateY(2px);opacity:0}30%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
    @keyframes uva-fermenting-asentar{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.uva-fermenting__burbuja,.uva-fermenting__burbuja:nth-of-type(n){animation:none;opacity:1}}
  </style>
  <g class="uva-fermenting__cuerpo">
    <ellipse cx="12" cy="8.5" rx="8" ry="2.5"/>
    <path d="M4 8.5 3.2 16.8q-.25 2.4 2 3.1Q12 21.8 18.8 19.9q2.25-.7 2-3.1L20 8.5"/>
    <path d="M3.47 14q8.53 2.8 17.06 0"/>
  </g>
  <g class="uva-fermenting__acento">
    <circle class="uva-fermenting__burbuja" cx="9.5" cy="4.8" r="1"/>
    <circle class="uva-fermenting__burbuja" cx="14" cy="4.3" r=".85"/>
    <circle class="uva-fermenting__burbuja" cx="12" cy="5.3" r=".95"/>
  </g>
</svg>
