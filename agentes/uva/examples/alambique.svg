<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-alambique" role="img" aria-label="Alambique destilando">
  <style>
    .uva-alambique{stroke-width:var(--uva-stroke,1.5)}
    .uva-alambique .acento{fill:var(--uva-accent,currentColor);stroke:none}
    /* 2 ciclos: el vapor recorre el cuello y cae la gota; la gota queda visible al final. Total 4.8 s (WCAG 2.2.2) */
    .uva-alambique .vapor{opacity:0;stroke:var(--uva-accent,currentColor);stroke-dasharray:3 30;animation:uva-alambique-fluir 2.2s linear 0s 2}
    .uva-alambique .gota{opacity:0;animation:uva-alambique-caer 2.2s cubic-bezier(.5,0,.9,.6) 0s 2,uva-alambique-asentar .4s ease-out 4.4s forwards}
    @keyframes uva-alambique-fluir{from{opacity:1;stroke-dashoffset:33}to{opacity:1;stroke-dashoffset:0}}
    @keyframes uva-alambique-caer{0%,60%{transform:translateY(0);opacity:0}68%{opacity:1}100%{transform:translateY(1.5px);opacity:0}}
    @keyframes uva-alambique-asentar{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.uva-alambique .vapor{animation:none;opacity:0}.uva-alambique .gota{animation:none;opacity:1}}
  </style>
  <!-- contenedor: olla + columna en un solo contorno, hombro en escalón (evita leerse como botella) -->
  <path class="contenedor" d="M10.5 20v-5a2 2 0 0 1 2-2h1V8a2.5 2.5 0 0 1 5 0v5h.5a2 2 0 0 1 2 2v5q0 1.5-1.5 1.5h-7.5q-1.5 0-1.5-1.5z"/>
  <!-- cuello de cisne -->
  <path class="tubo" d="M16 5.5V4a1.5 1.5 0 0 0-1.5-1.5h-8A1.5 1.5 0 0 0 5 4v4"/>
  <path class="vapor" pathLength="33" d="M16 5.5V4a1.5 1.5 0 0 0-1.5-1.5h-8A1.5 1.5 0 0 0 5 4v4"/>
  <!-- serpentín: 2 vueltas (R7) -->
  <path class="serpentin" d="M5 8 7.5 9.5 2.5 12.8 7.5 16.1 2.5 19.4 5 20.5"/>
  <circle class="gota acento" cx="5" cy="21.6" r=".8"/>
</svg>
