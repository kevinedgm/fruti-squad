<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wf-fidelidad" content="F2">
<title>Wireframe · Cabecera Usuarios · ejemplo</title>
<link rel="stylesheet" href="../../agentes/kiwi/assets/wireframe-kit.css">
<style>
  /* Solo grises. La geometría vive en el marco (container queries), como en el kit. */
  .ph{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid #ccc}
  .ph-id{display:flex;align-items:center;gap:12px;min-width:0}
  .ph-ic{width:40px;height:40px;border-radius:8px;background:#bbb;flex:none}
  .ph h1{margin:0;font-size:20px;line-height:1.2}
  .ph p{margin:0;font-size:14px;color:#555}
  .ph-act{height:44px;padding:0 16px;border:0;border-radius:8px;background:#333;color:#fff;font:inherit;flex:none}
  @container wf (max-width: 599px){
    .ph{padding:12px 16px}
    .ph h1{font-size:18px}
    .ph-act{width:44px;padding:0}
    .ph-act span{display:none}
  }
</style>
</head>
<body class="wf">
<div class="wf-ctl" role="region" aria-label="Controles del wireframe">
  <strong>Cabecera Usuarios · F2</strong>
  <fieldset><legend>Espacio</legend>
    <button data-w="1440" aria-pressed="true">expanded 1440</button>
    <button data-w="834" aria-pressed="false">medium 834</button>
    <button data-w="393" aria-pressed="false">compact 393</button>
  </fieldset>
</div>
<div class="wf-stage">
  <p class="wf-frame-label" id="wf-label"></p>
  <div class="wf-frame" id="wf-frame">
    <!-- preserve en los tres modos: identidad a la izquierda, acción en la misma fila.
         compact: título 18px, acción solo icono 44×44 con nombre accesible. -->
    <header class="ph" data-piece="header">
      <div class="ph-id" data-piece="header.identity">
        <span class="ph-ic" data-piece="header.icon" aria-hidden="true"></span>
        <div data-piece="header.texts">
          <h1 data-piece="header.title">Usuarios</h1>
          <p data-piece="header.subtitle">Administra cuentas, roles y permisos</p>
        </div>
      </div>
      <button class="ph-act" data-piece="header.action" aria-label="Registrar usuario">＋<span> Registrar usuario</span></button>
    </header>
  </div>
</div>
<script>
let S = {w: innerWidth < 600 ? 393 : innerWidth < 1024 ? 834 : 1440};
function render(){
  document.getElementById('wf-frame').style.setProperty('--wf-w', S.w + 'px');
  const l = document.getElementById('wf-label');
  l.style.setProperty('--wf-w', S.w + 'px');
  l.textContent = `Marco ${S.w}px · ${S.w < 600 ? 'compact' : S.w < 1024 ? 'medium' : 'expanded'}`;
  document.querySelectorAll('[data-w]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.w === S.w)));
}
document.addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (b) { S.w = +b.dataset.w; render(); } });
render();
</script>
</body>
</html>
