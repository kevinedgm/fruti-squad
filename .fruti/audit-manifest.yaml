version: 1
policy:
  deterministic_first: true
  prose_on: [ambiguous, failed, unsupported, exception]
checks:
  - id: A11Y-SEMANTICS-001
    category: accessibility
    kind: deterministic
    applies_to: interactive
    check: native-interactive-semantics
    severity: error
  - id: A11Y-FOCUS-001
    category: accessibility
    kind: deterministic
    applies_to: interactive
    check: focus-visible-not-suppressed
    severity: error
  - id: A11Y-TARGET-001
    category: accessibility
    kind: deterministic
    applies_to: interactive
    check: min-touch-target-from-profile
    severity: error
  - id: RESP-OVERFLOW-001
    category: responsive
    kind: deterministic
    check: horizontal-overflow
    spaces: [compact, medium, expanded]
    expected: false
    severity: error
  - id: DS-TOKEN-001
    category: design-system
    kind: deterministic
    check: no-raw-design-values-when-token-exists
    severity: error
  - id: DS-REGISTRY-001
    category: governance
    kind: deterministic
    check: registry-contract-consistency
    severity: error
  - id: FID-GEOMETRY-001
    category: structural
    kind: deterministic
    applies_to: every_piece_marked_in_f2
    check: f3-preserves-f2-geometry
    tool: fruti fidelity --f2 <kiwi-f2> --f3 <f3> --round <round> --out .fruti/tests/<round>/fidelity.json
    compares: [presence, visibility, grouping, relation, intrusion, gap, size]
    spaces: [compact, medium, expanded]
    blocked_is_pass: false
    severity: error
  - id: VIS-HIERARCHY-001
    category: visual
    kind: judgment
    check: hierarchy-supports-primary-task
    severity: warning
  - id: VIS-DENSITY-001
    category: visual
    kind: judgment
    check: density-fits-context-and-space
    severity: warning
  - id: UX-AFFORDANCE-001
    category: ux
    kind: judgment
    check: actions-and-states-are-understandable
    severity: warning
  - id: ADAPT-COMPOSITION-001
    category: adaptive
    kind: judgment
    check: composition-adapts-not-merely-scales
    severity: warning
  - id: UX-DECEPTIVE-001
    category: ux
    kind: judgment
    applies_to: [actions, forms, consent, pricing, subscription, destructive_flows]
    check: no-deceptive-patterns
    # Source: ux-heuristics/dark-patterns (wondelai/skills, MIT, (c) 2025 Wondel.ai), after Brignull's catalogue.
    criteria:
      - decline_option_is_neutral_no_confirmshaming
      - opt_out_as_visible_and_reachable_as_opt_in
      - consent_and_extras_not_preselected
      - every_action_label_matches_its_effect
      - total_cost_or_consequence_visible_before_final_step
      - urgency_or_scarcity_only_when_real_and_sourced
      - undoing_or_cancelling_is_as_easy_as_doing
      - no_double_negatives_or_trick_questions
    evidence: quote_the_label_or_screenshot_region_that_fails
    owner_on_fail: kiwi_for_flow_or_hierarchy_lima_for_contract_copy
    severity: error
report:
  output: .fruti/reports/compliance-current.json
  fields: [rule_id, status, evidence, severity, owner, remediation]