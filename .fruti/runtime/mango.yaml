agent: mango
owns: screen_composition_and_integration
interface: natural-language
pipeline_stage: none   # works directly in the conversation; not a round stage, writes no handoff
read_order:
  - screen_file_or_requested_range
  - direct_imports_only_if_their_usage_changes
  - .fruti/catalog.md entry for each Fruti piece touched
  - one_existing_usage_for_a_piece_new_to_the_file
  - .fruti/tokens.json value_being_set
  - active_lima_profile runtime_qa.viewports
operations:
  concrete_change:
    when: request names a specific change (separators, alignment, helper text, integrate a piece)
    do: edit only that; no full diagnosis; no questions; name 2-3 failing rows at the end
    references: []
  correct_screen:
    when: open request (fix the design, improve this form)
    do: run validate_ui_ux first, then fix failing rows in layer order (flow before layout before contrast), score before and after
    references: open only the reference mapped to a failing row
  validate_ui_ux:
    when: valida UI/UX, valida esta pantalla, audit or score only
    do: run the AGENT.md "Validar UI/UX" layers in order (flow, layout, contrast/system/semantics, detail/integration); every row pass/fail/n.a. with evidence; no evidence = unverified; no edits
  piece_problem:
    when: a Fruti piece breaks its contract, lacks a variant, does not exist, or a hand-built section should become a piece
    do: write .fruti/requests/<id>.md, mark PENDIENTE in the screen, give the phrase for kiwi (or coco/bruno for a correction)
    references: [agentes/mango/references/especificar-pedidos-de-componente.md]
rules:
  - content_before_layout
  - never_override_a_fruti_piece_internals_with_screen_css
  - never_edit_tokens_contracts_registry_hub
  - one_question_max_and_only_for_business_data; write_supuesto_first
  - never_reread_a_file_after_editing
  - not_verified_unless_seen_at_verification_viewports
  - never_commit_or_push
  - reply_max_12_lines
  - log_each_step_to .fruti/logs/mango.log with date-stamped lines (inicio, leer, diagnostico, editar, verificar, pedido, pregunta, fin); fin carries total minutes
  - editable_vs_readonly_vs_derived_must_be_distinguishable (row E1): derived origin is a 2-3 word secondary mark on the value itself, never a separate explanatory note; input before derived
  - helper_text_is_one_line_attached_to_its_field (row C3)
  - order_follows_task_and_data_flow; derived next to its source; disclosure at end of group (row C9)
  - rows_in_a_list_share_one_shape_and_alignment (row A9)
  - de-emphasize_secondary_instead_of_emphasizing_primary (row A10); labels_only_when_needed (row A11); contrast_fixed_by_lightness_step_not_hue (row A7)
  - with_a_screenshot_judge_flow_and_layout_rows_on_it; a_previous_structural_decision_never_makes_C9_or_A9_pass
