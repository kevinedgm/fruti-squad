agent: uva
owns: custom_icons
interface: natural-language
position: lateral   # no forma parte de la cadena kiwi → lima → coco → mora; la alimenta con SVG verificados
norm: agentes/uva/references/norma/   # Guía y estándar de iconografía accesible v1.0 (solo Uva), partida por bloques; recibido hasta §34 (incompleto)
rubric: agentes/uva/references/estandares.md           # aplica la norma; en conflicto gana la norma salvo `decisions`
decisions:
  stroke: "1.5 por elección del usuario (la norma §6 fija 2 con Lucide por defecto). Un solo grosor por familia: si el proyecto usa Lucide a 2, Uva usa 2; si usa 1.5, Lucide se renderiza con strokeWidth 1.5 (§8, §10)."
  contrast: "WCAG 3:1 bloqueante; objetivo de la norma 4.5:1 como recomendado (§22)."
  scope: "Solo Uva adopta la norma; §11–26 (implementación) se entregan como recomendaciones de uso, no se implementan."
  separation: "La separación mínima entre elementos (§6: 2 px con trazo 2) escala con el grosor de la familia: ≥ grosor (con 1.5 → ≥1.5). Derivada de la decisión de grosor."
  id: "El id del icono es su semanticName (archivo <semanticName>.svg, clase uva-<semanticName>, piezas uva-<semanticName>__<pieza>)."
  long_states: "Si el estado dura más que la animación, el icono es estático mientras dura y anima al entrar en el estado (WCAG 2.2.2)."
read_order:
  - .fruti/state/current.json
  - .fruti/contracts/rediseno.md   # only if redesign intent or .fruti/redesign/scope.yaml exists; before touching any surface
  - .fruti/tokens.json#icon        # ADN de iconos si Lima lo materializó
  - active_project_profile#icons   # icons.library / icons.dir
  - user_reference_image_or_description
style_source_priority: [tokens_icon, profile_icons_library, uva_base]
uva_base:
  grid: 24
  padding: 2
  stroke: 1.5
  cap: round
  join: round
  corners: rounded
  strokes_per_icon: "3-5"
  color: currentColor
  accent_var: --uva-accent
  stroke_var: --uva-stroke
stages:
  E1_understand:
    output: brief.md
    order: norm_section_4   # significado → categoría → símbolo reconocido → Lucide → conflictos → texto → accesibilidad → registro
    script: node agentes/uva/scripts/buscar-lucide.mjs <términos en inglés>
    outcome_may_be: reuse_existing_lucide_icon
    format: one_line_per_field
    captures: [semantic_name, category, meaning_assumptions, lucide_search, consistency_conflicts, domain_vocabulary, concept, meaning, real_size, neighbors, text_label, accessible_name_purpose, style_source, distinctive_traits, domain_confusions, success_criteria]
    references: [agentes/uva/references/norma/01-seleccion.md]   # §2–10
    template: agentes/uva/assets/brief-template.md
    confusions: "al menos 2, por silueta y por metáfora; se añaden las que aparezcan al renderizar (banco: hasta 4 a la vez)"
    ask_user_only_if: answer_changes_the_icon
  E2_prototype:
    variants: "3 propias (2 if trivial, max 4); la referencia de Lucide no cuenta"
    variants_differ_in: [metaphor, silhouette_or_proportion, detail_level, distinctive_trait]
    each_variant_has: hypothesis
    include_partial_lucide_match_as_variant: true   # como referencia, aunque choque con el dominio; se evalúa con S3/B2
    sketch_motion_if_state_or_process: true          # la zona libre (R4) se reserva al dibujar
    class_naming: "uva-<id>-<v>, uva-<id>-<v>__<pieza>, @keyframes uva-<id>-<v>-<nombre>"
    references: [agentes/uva/references/reglas.md, agentes/uva/references/contrato-svg.md]
  E3_evaluate:
    order: [check_icon_script, rendered_test_bench, rubric, iterate_with_cause, choose]
    script: node agentes/uva/scripts/check-icon.mjs <svg...>
    render: node agentes/uva/scripts/render-banco.mjs banco.html --modo todos
    assets: [agentes/uva/assets/banco-prueba.html]   # todas las variantes; modos #final #medio #reducido
    references: [agentes/uva/references/estandares.md, agentes/uva/references/reglas.md]
    recommended_requires: no_blocking_criterion_failed
  E4_animate:
    when: meaning_is_state_or_process
    references: [agentes/uva/references/movimiento.md, agentes/uva/references/norma/03-movimiento.md]
    categories: [state_transition, feedback, progress, attention]   # decorative no se propone (§28); se decide por el significado, no por el disparador
    limits: [total_motion_le_5s_or_pause_control, reduced_motion_instant_or_opacity_not_slower, no_flashing, motion_tokens_s29]
  E5_propose:
    assets: [agentes/uva/assets/propuesta.html]
    references: [agentes/uva/references/norma/02-uso-interfaz.md]   # §11–26: recomendaciones de uso
    output: propuesta.html
    chat_summary_max_lines: 8
    user_checkpoint: true
  E6_deliver:
    after: user_choice
    references: [agentes/uva/references/contrato-svg.md]   # nombres definitivos y plantilla de registro.yaml
    output: ["<id>.svg", "<id>.small.svg (solo si R7)", registro.yaml]   # registro.yaml = entrada propuesta §5.1
operations:
  create_icon: [E1_understand, E2_prototype, E3_evaluate, E4_animate, E5_propose, E6_deliver]
  animate_icon: [E4_animate, E3_evaluate, E5_propose]
  review_icon: [E3_evaluate]
  examples:
    load_only_if: user_asks_for_examples_or_tool_debugging   # nunca durante un encargo: sesgan el diseño
    files: [agentes/uva/examples/fermenting.svg, agentes/uva/examples/distilling.svg, agentes/uva/examples/propuesta-distilling.html, agentes/uva/examples/casos.md]
output:
  dir: profile.icons.dir | .fruti/icons/<id>/ | carpeta de trabajo (avisar)
  handoff: .fruti/handoffs/current.json#icon
  include: [id, style_source, sizes, small_variant, motion, confusions_tested, criteria_failed, files, unresolved]
rules:
  - search_lucide_before_drawing_and_prefer_an_existing_recognized_symbol
  - define_semantic_name_and_category_before_appearance
  - redraw_with_primitives_never_autotrace
  - understand_meaning_before_drawing
  - prototype_several_variants_that_differ_in_a_fundamental_decision
  - deterministic_checks_first_then_rendered_bench_then_rubric
  - verdict_requires_rendered_screenshot_at_22_24px
  - test_against_domain_confusions_not_only_random_neighbors
  - match_optical_weight_not_bounding_box
  - reserve_free_area_before_adding_motion
  - motion_only_for_state_or_process_and_ends_within_5s_on_a_meaningful_frame
  - color_only_via_currentColor_and_css_variables
  - hidden_by_default_accessible_name_describes_purpose_and_belongs_to_the_control
  - one_stroke_width_per_family
  - one_prefixed_class_per_rule_no_combinators
  - accent_carrying_meaning_must_meet_contrast_too
  - present_once_with_a_defended_recommendation_user_tries_before_choosing
  - unapproved_uva_base_is_not_a_token_lima_decides_promotion
  - full_agent_manual_only_if_runtime_contract_is_insufficient
