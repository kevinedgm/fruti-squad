<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#A46A17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-bruno-builder" role="img" aria-label="Bruno">
  <!-- bruno-builder · avatar del agente Bruno (construcción funcional): módulo + dos puertos, props entra y events sale -->
  <style>.uva-bruno-builder{stroke-width:var(--uva-stroke,2.5)}.uva-bruno-builder--conectar{--uva-bruno-builder-modulo:uva-bruno-builder-trazar;--uva-bruno-builder-entrada:uva-bruno-builder-trazar;--uva-bruno-builder-salida:uva-bruno-builder-trazar}.uva-bruno-builder__modulo{stroke-dasharray:1 1.1;animation:var(--uva-bruno-builder-modulo,none) 340ms cubic-bezier(.2,.6,.3,1) 0ms 1 both}.uva-bruno-builder__entrada{stroke-dasharray:1 1.1;animation:var(--uva-bruno-builder-entrada,none) 180ms cubic-bezier(.3,0,.2,1) 300ms 1 both}.uva-bruno-builder__salida{stroke-dasharray:1 1.1;animation:var(--uva-bruno-builder-salida,none) 180ms cubic-bezier(.3,0,.2,1) 480ms 1 both}@keyframes uva-bruno-builder-trazar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes uva-bruno-builder-aparecer{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.uva-bruno-builder--conectar{--uva-bruno-builder-modulo:none;--uva-bruno-builder-entrada:none;--uva-bruno-builder-salida:none}}.uva-bruno-builder{stroke:#A46A17}@media (prefers-color-scheme:dark){.uva-bruno-builder{stroke:#E5A447}}.uva-bruno-builder{color:#A46A17}@media (prefers-color-scheme:dark){.uva-bruno-builder{color:#E5A447}}</style>
  <rect class="uva-bruno-builder__modulo" pathLength="1" x="4" y="3.25" width="16" height="11.75" rx="4.5"/>
  <path class="uva-bruno-builder__entrada" pathLength="1" d="M9 20.75V15"/>
  <path class="uva-bruno-builder__salida" pathLength="1" d="M15 15V20.75"/>
</svg>
