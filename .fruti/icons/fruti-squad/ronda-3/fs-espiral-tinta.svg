<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruti Squad" class="fs3 fs3--espiral">
  <!-- Fruti Squad · «espiral»: cinco cápsulas que se abren en espiral alrededor del núcleo: piezas distintas, un solo flujo. Se despliegan girando y el núcleo se enciende (1.2 s, una vez). -->
  <style>.fs3--espiral .m0{animation:fs3-esp 700ms 0ms cubic-bezier(.25,1.3,.5,1) both}.fs3--espiral .m1{animation:fs3-esp 700ms 70ms cubic-bezier(.25,1.3,.5,1) both}.fs3--espiral .m2{animation:fs3-esp 700ms 140ms cubic-bezier(.25,1.3,.5,1) both}.fs3--espiral .m3{animation:fs3-esp 700ms 210ms cubic-bezier(.25,1.3,.5,1) both}.fs3--espiral .m4{animation:fs3-esp 700ms 280ms cubic-bezier(.25,1.3,.5,1) both}.fs3--espiral .m{transform-origin:256px 256px}@keyframes fs3-esp{from{transform:rotate(-150deg) scale(.35);opacity:0}to{transform:none;opacity:1}}.fs3--espiral .n{transform-origin:256px 256px;animation:fs3-nucleo2 480ms 720ms cubic-bezier(.3,1.8,.5,1) both}@keyframes fs3-nucleo2{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.fs3--espiral *{animation:none!important}}</style>
