<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruti Squad" class="fs3 fs3--orbita">
  <!-- Fruti Squad · «orbita»: núcleo (orquestador) y cinco semillas (agentes) en órbita, giradas para sugerir flujo. Las semillas salen del centro en orden y el núcleo se enciende al final (1.16 s, una vez). -->
  <style>.fs3--orbita .m0{animation:fs3-orb-0 560ms 0ms cubic-bezier(.3,1.4,.5,1) both}@keyframes fs3-orb-0{from{transform:rotate(-72deg) scale(.2);opacity:0}to{transform:none;opacity:1}}.fs3--orbita .m1{animation:fs3-orb-1 560ms 90ms cubic-bezier(.3,1.4,.5,1) both}@keyframes fs3-orb-1{from{transform:rotate(-72deg) scale(.2);opacity:0}to{transform:none;opacity:1}}.fs3--orbita .m2{animation:fs3-orb-2 560ms 180ms cubic-bezier(.3,1.4,.5,1) both}@keyframes fs3-orb-2{from{transform:rotate(-72deg) scale(.2);opacity:0}to{transform:none;opacity:1}}.fs3--orbita .m3{animation:fs3-orb-3 560ms 270ms cubic-bezier(.3,1.4,.5,1) both}@keyframes fs3-orb-3{from{transform:rotate(-72deg) scale(.2);opacity:0}to{transform:none;opacity:1}}.fs3--orbita .m4{animation:fs3-orb-4 560ms 360ms cubic-bezier(.3,1.4,.5,1) both}@keyframes fs3-orb-4{from{transform:rotate(-72deg) scale(.2);opacity:0}to{transform:none;opacity:1}}.fs3--orbita .m{transform-origin:256px 256px}.fs3--orbita .n{transform-origin:256px 256px;animation:fs3-nucleo 520ms 640ms cubic-bezier(.3,1.8,.5,1) both}@keyframes fs3-nucleo{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.fs3--orbita *{animation:none!important}}</style>
  <rect width="512" height="512" rx="112" fill="var(--fs-fondo,#161616)"/><g class="m m0"><rect x="188.0" y="52.0" width="136" height="84" rx="42" fill="var(--fs-claro,#F8F8F5)" transform="rotate(28.0 256.0 94.0)"/></g><g class="m m1"><rect x="342.1" y="163.9" width="136" height="84" rx="42" fill="var(--fs-claro,#F8F8F5)" transform="rotate(100.0 410.1 205.9)"/></g><g class="m m2"><rect x="283.2" y="345.1" width="136" height="84" rx="42" fill="var(--fs-claro,#F8F8F5)" transform="rotate(172.0 351.2 387.1)"/></g><g class="m m3"><rect x="92.8" y="345.1" width="136" height="84" rx="42" fill="var(--fs-claro,#F8F8F5)" transform="rotate(244.0 160.8 387.1)"/></g><g class="m m4"><rect x="33.9" y="163.9" width="136" height="84" rx="42" fill="var(--fs-claro,#F8F8F5)" transform="rotate(316.0 101.9 205.9)"/></g><circle class="n" cx="256" cy="256" r="64" fill="var(--fs-acento,#B7F34D)"/>
</svg>
