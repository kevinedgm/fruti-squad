<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruti Squad" class="fs3 fs3--monograma">
  <!-- Fruti Squad · «monograma»: una F construida con cuatro módulos redondeados; el quinto es el punto lima, el orquestador que completa la marca. Los módulos llegan desde fuera y encajan (1 s, una vez). -->
  <style>.fs3--monograma .m0{animation:fs3-mon-0 460ms 0ms cubic-bezier(.3,1.5,.5,1) both}@keyframes fs3-mon-0{from{transform:translate(0px,-120px);opacity:0}to{transform:none;opacity:1}}.fs3--monograma .m1{animation:fs3-mon-1 460ms 90ms cubic-bezier(.3,1.5,.5,1) both}@keyframes fs3-mon-1{from{transform:translate(0px,120px);opacity:0}to{transform:none;opacity:1}}.fs3--monograma .m2{animation:fs3-mon-2 460ms 180ms cubic-bezier(.3,1.5,.5,1) both}@keyframes fs3-mon-2{from{transform:translate(140px,0px);opacity:0}to{transform:none;opacity:1}}.fs3--monograma .m3{animation:fs3-mon-3 460ms 270ms cubic-bezier(.3,1.5,.5,1) both}@keyframes fs3-mon-3{from{transform:translate(110px,0px);opacity:0}to{transform:none;opacity:1}}.fs3--monograma .n{transform-origin:376px 382px;animation:fs3-nucleo3 460ms 520ms cubic-bezier(.3,1.8,.5,1) both}@keyframes fs3-nucleo3{from{transform:scale(0)}to{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.fs3--monograma *{animation:none!important}}</style>
  <rect width="512" height="512" rx="112" fill="var(--fs-fondo,#161616)"/><g class="m m0"><rect x="118" y="96" width="76" height="150" rx="38" fill="var(--fs-claro,#F8F8F5)"/></g><g class="m m1"><rect x="118" y="266" width="76" height="150" rx="38" fill="var(--fs-claro,#F8F8F5)"/></g><g class="m m2"><rect x="214" y="96" width="180" height="76" rx="38" fill="var(--fs-claro,#F8F8F5)"/></g><g class="m m3"><rect x="214" y="218" width="104" height="76" rx="38" fill="var(--fs-claro,#F8F8F5)"/></g><circle class="n" cx="376" cy="382" r="42" fill="var(--fs-acento,#B7F34D)"/>
</svg>
