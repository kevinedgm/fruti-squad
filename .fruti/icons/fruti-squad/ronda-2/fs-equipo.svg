<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruti Squad" class="fs fs--equipo">
  <!-- Fruti Squad · «La fruta del equipo»: una sola fruta hecha de Kiwi, Lima, Coco, Mora y Bruno; al aparecer, cada gajo llega en el orden de la cadena y el orquestador (centro) los une. -->
  <style>.fs--equipo .g0{animation:fs-eq-0 520ms 120ms cubic-bezier(.3,1.5,.55,1) both}@keyframes fs-eq-0{from{transform:translate(0px,-150px) rotate(40deg);opacity:0;transform-origin:256px 282px}to{transform:none;opacity:1;transform-origin:256px 282px}}.fs--equipo .g1{animation:fs-eq-1 520ms 230ms cubic-bezier(.3,1.5,.55,1) both}@keyframes fs-eq-1{from{transform:translate(143px,-46px) rotate(-40deg);opacity:0;transform-origin:256px 282px}to{transform:none;opacity:1;transform-origin:256px 282px}}.fs--equipo .g2{animation:fs-eq-2 520ms 340ms cubic-bezier(.3,1.5,.55,1) both}@keyframes fs-eq-2{from{transform:translate(88px,121px) rotate(40deg);opacity:0;transform-origin:256px 282px}to{transform:none;opacity:1;transform-origin:256px 282px}}.fs--equipo .g3{animation:fs-eq-3 520ms 450ms cubic-bezier(.3,1.5,.55,1) both}@keyframes fs-eq-3{from{transform:translate(-88px,121px) rotate(-40deg);opacity:0;transform-origin:256px 282px}to{transform:none;opacity:1;transform-origin:256px 282px}}.fs--equipo .g4{animation:fs-eq-4 520ms 560ms cubic-bezier(.3,1.5,.55,1) both}@keyframes fs-eq-4{from{transform:translate(-143px,-46px) rotate(40deg);opacity:0;transform-origin:256px 282px}to{transform:none;opacity:1;transform-origin:256px 282px}}.fs--equipo .hub{transform-origin:256px 282px;animation:fs-pop 420ms 760ms cubic-bezier(.3,1.8,.5,1) both}.fs--equipo .hoja{transform-origin:262px 92px;animation:fs-brota 460ms 900ms cubic-bezier(.3,1.6,.5,1) both}@keyframes fs-pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes fs-brota{from{transform:scale(0) rotate(-60deg)}to{transform:none}}@media (prefers-reduced-motion:reduce){.fs--equipo *{animation:none!important}}</style>
