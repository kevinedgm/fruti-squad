<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-heart-rate-high" aria-hidden="true">
  <style>
    .uva-heart-rate-high{stroke-width:var(--uva-stroke,1.5);overflow:visible}
    /* Atención: al detectarse frecuencia cardíaca alta late deprisa 4 veces (lub-dub, 1.92 s) y cada golpe
       suelta una onda; después queda quieto mientras dure. El componente añade uva-heart-rate-high--latir al entrar en el
       estado. Las líneas de velocidad no se mueven. */
    .uva-heart-rate-high--latir{--uva-heart-rate-high-latido:uva-heart-rate-high-latir;--uva-heart-rate-high-onda:uva-heart-rate-high-onda;--uva-heart-rate-high-onda2:uva-heart-rate-high-onda2}
    .uva-heart-rate-high__corazon{transform-box:fill-box;transform-origin:50% 55%;animation:var(--uva-heart-rate-high-latido,none) 480ms linear 0s 4}
    .uva-heart-rate-high__onda{opacity:0;stroke:var(--uva-accent,currentColor);transform-box:fill-box;transform-origin:50% 50%;animation:var(--uva-heart-rate-high-onda,none) 480ms linear 0s 4}
    .uva-heart-rate-high__onda2{opacity:0;stroke:var(--uva-accent,currentColor);transform-box:fill-box;transform-origin:50% 50%;animation:var(--uva-heart-rate-high-onda2,none) 480ms linear 0s 4}
    @keyframes uva-heart-rate-high-latir{0%{animation-timing-function:cubic-bezier(.3,0,.5,1);transform:scale(1)}12%{animation-timing-function:cubic-bezier(.5,0,.7,1);transform:scale(1.1)}24%{animation-timing-function:cubic-bezier(.3,0,.5,1);transform:scale(.98)}34%{animation-timing-function:cubic-bezier(.4,0,.6,1);transform:scale(1.05)}50%{transform:scale(1)}100%{transform:scale(1)}}
    @keyframes uva-heart-rate-high-onda{0%{opacity:0;transform:scale(1.1);stroke-width:calc(var(--uva-stroke,1.5)*0.62)}12%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:.9;transform:scale(1.1);stroke-width:calc(var(--uva-stroke,1.5)*0.62)}85%{opacity:0;transform:scale(1.55);stroke-width:calc(var(--uva-stroke,1.5)*0.45)}100%{opacity:0;transform:scale(1.55)}}
    @keyframes uva-heart-rate-high-onda2{0%{opacity:0;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*0.55)}34%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:.55;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*0.55)}95%{opacity:0;transform:scale(1.4);stroke-width:calc(var(--uva-stroke,1.5)*0.42)}100%{opacity:0;transform:scale(1.4)}}
    @media (prefers-reduced-motion:reduce){
      .uva-heart-rate-high--latir{--uva-heart-rate-high-latido:none;--uva-heart-rate-high-onda:none;--uva-heart-rate-high-onda2:none}
    }
  </style>
  <!-- heart-rate-high · late deprisa y emite ondas al entrar en el estado con la clase uva-heart-rate-high--latir -->
  <path class="uva-heart-rate-high__onda" d="M14.3 18.86C12.22 17.02 6.7 13.5 6.7 9.74C6.7 7.42 8.46 5.74 10.62 5.74C12.22 5.74 13.5 6.62 14.3 7.9C15.1 6.62 16.38 5.74 17.98 5.74C20.14 5.74 21.9 7.42 21.9 9.74C21.9 13.5 16.38 17.02 14.3 18.86Z"/>
  <path class="uva-heart-rate-high__onda2" d="M14.3 18.86C12.22 17.02 6.7 13.5 6.7 9.74C6.7 7.42 8.46 5.74 10.62 5.74C12.22 5.74 13.5 6.62 14.3 7.9C15.1 6.62 16.38 5.74 17.98 5.74C20.14 5.74 21.9 7.42 21.9 9.74C21.9 13.5 16.38 17.02 14.3 18.86Z"/>
  <path class="uva-heart-rate-high__corazon" d="M14.3 18.86C12.22 17.02 6.7 13.5 6.7 9.74C6.7 7.42 8.46 5.74 10.62 5.74C12.22 5.74 13.5 6.62 14.3 7.9C15.1 6.62 16.38 5.74 17.98 5.74C20.14 5.74 21.9 7.42 21.9 9.74C21.9 13.5 16.38 17.02 14.3 18.86Z"/>
  <path class="uva-heart-rate-high__velocidad" d="M1.8 8.4H4.8M2.4 11.8H5.6M3.8 15.2H7"/>
</svg>
