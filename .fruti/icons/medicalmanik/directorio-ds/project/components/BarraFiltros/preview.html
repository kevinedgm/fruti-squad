<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap"><style>html,body{margin:0}body{background:var(--bruma,#F5FAFB);color:var(--tinta,#14213D);font:17px/26px var(--font-sans,"Onest",system-ui,sans-serif);padding:16px}

.ico{width:20px;height:20px;flex:none;display:block}

.chip{font:500 15px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);background:var(--blanco,#fff);border:1.5px solid var(--linea,#DCE4EA);border-radius:999px;min-height:var(--control-height,42px);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--linea-control,#6B7590)}.chip[aria-pressed="true"]{background:var(--tinta,#14213D);border-color:var(--tinta,#14213D);color:#fff}
.times{display:flex;flex-wrap:wrap;gap:6px}.times button{font:600 15px var(--font-sans,"Onest",sans-serif);font-variant-numeric:tabular-nums;color:var(--cian-ui,#00788A);background:var(--blanco,#fff);border:1.5px solid var(--cian-ui,#00788A);border-radius:999px;min-height:var(--control-height,42px);padding:0 14px;cursor:pointer}
.times button[aria-pressed="true"]{background:var(--cian-ui,#00788A);color:#fff}.times .mash{border:0;background:none;color:var(--tinta,#14213D);padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:20px;background:var(--bruma,#F5FAFB);border-radius:999px;padding:4px 10px}.meta span .ico{width:15px;height:15px}
.meta .v{color:var(--on-exito-suave,#157B4A);font-weight:600;background:var(--exito-suave,#E7F5EE)}.meta .st b{color:var(--estrella,#E3A21C);font-weight:400}.meta .new{background:var(--luz-calida,#FFEFD2);font-weight:600}.fila{display:flex;gap:24px;flex-wrap:wrap;align-items:start}.marco{display:grid;gap:8px;flex:1 1 300px;max-width:390px}.marco>b{font:600 13px/18px var(--font-sans,"Onest",sans-serif);color:var(--muted,#4A5674);letter-spacing:.04em;text-transform:uppercase}
.tel-f{border:1px solid var(--linea,#DCE4EA);border-radius:28px;overflow:hidden;background:var(--blanco,#fff);position:relative;min-height:420px;display:flex;flex-direction:column}
.halo{background:radial-gradient(70% 90% at 0% 0%,var(--luz-cian,#D3F0F4),transparent 70%),radial-gradient(60% 80% at 100% 20%,var(--luz-calida,#FFEFD2),transparent 70%),var(--bruma,#F5FAFB)}
.sheet{margin-top:auto;background:var(--blanco,#fff);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(20,33,61,.12);padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}.asa{justify-self:center;width:40px;height:4px;border-radius:2px;background:var(--linea,#DCE4EA)}
.velo{position:absolute;inset:0;background:rgba(20,33,61,.32);display:flex;flex-direction:column}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--tinta,#14213D);border-radius:50%;cursor:pointer}.ib:hover{background:var(--bruma,#F5FAFB)}.rh{padding:18px 16px 8px}.rh h2{margin:0;font:400 28px/32px var(--font-display,"Urbanist",sans-serif);letter-spacing:-.02em}.rh h2 b{font-weight:600}.rh p{font-size:15px}
.bf{position:sticky;top:0;display:flex;gap:8px;padding:8px 16px 12px;background:var(--blanco,#fff);border-bottom:1px solid var(--linea,#DCE4EA)}.n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--tinta,#14213D);color:#fff;font-size:13px;font-weight:700}
.ph{margin:12px 16px 0;height:110px;border-radius:24px;background:var(--bruma,#F5FAFB);border:1px solid var(--linea,#DCE4EA)}
.sh{display:flex;justify-content:space-between;align-items:center}.sh b{font-size:20px}fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}legend{font:600 15px/22px var(--font-sans,"Onest",sans-serif);padding:0;margin-bottom:8px}.row{display:flex;flex-wrap:wrap;gap:8px}
.pie{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--linea,#DCE4EA);padding-top:12px}.pie .agendar{flex:1;justify-content:center}</style></head><body><div class="fila">

<fieldset><legend>Precio de consulta</legend><div class="row"><button type="button" class="chip" aria-pressed="false">Hasta $500</button><button type="button" class="chip" aria-pressed="false">Hasta $800</button><button type="button" class="chip" aria-pressed="false">Hasta $1,200</button></div></fieldset>
<div class="pie"><button type="button" class="btn enlace">Limpiar</button><button type="button" class="btn agendar">Ver 5 especialistas</button></div></div></div></div></div></div></body></html>
