<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap"><style>html,body{margin:0}body{background:var(--bruma,#F5FAFB);color:var(--tinta,#14213D);font:17px/26px var(--font-sans,"Onest",system-ui,sans-serif);padding:16px}
