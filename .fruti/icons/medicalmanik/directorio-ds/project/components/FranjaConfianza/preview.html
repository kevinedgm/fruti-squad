<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap"><style>html,body{margin:0}body{background:var(--bruma,#F5FAFB);color:var(--tinta,#14213D);font:17px/26px var(--font-sans,"Onest",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Urbanist",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}p{margin:0}
:focus-visible{outline:3px solid var(--focus,#00788A);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;font:600 16px/20px var(--font-sans,"Onest",sans-serif);border:0;cursor:pointer;padding:0 22px;min-height:var(--boton-height,48px)}
.agendar{background:var(--cian-ui,#00788A);color:#fff}.agendar:hover{background:var(--cian-ui-hover,#00606F)}
.buscar{background:var(--tinta,#14213D);color:#fff;min-height:var(--buscar-height,54px);padding:0 26px;font-size:17px}.buscar:hover{background:#000}
.contorno{background:var(--blanco,#fff);color:var(--tinta,#14213D);border:1.5px solid var(--tinta,#14213D);min-height:46px;padding:0 20px}
.enlace{background:none;color:var(--tinta,#14213D);padding:0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.chip{font:500 15px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);background:var(--blanco,#fff);border:1.5px solid var(--linea,#DCE4EA);border-radius:999px;min-height:var(--control-height,42px);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--linea-control,#6B7590)}.chip[aria-pressed="true"]{background:var(--tinta,#14213D);border-color:var(--tinta,#14213D);color:#fff}
.times{display:flex;flex-wrap:wrap;gap:6px}.times button{font:600 15px var(--font-sans,"Onest",sans-serif);font-variant-numeric:tabular-nums;color:var(--cian-ui,#00788A);background:var(--blanco,#fff);border:1.5px solid var(--cian-ui,#00788A);border-radius:999px;min-height:var(--control-height,42px);padding:0 14px;cursor:pointer}
.times button[aria-pressed="true"]{background:var(--cian-ui,#00788A);color:#fff}.times .mash{border:0;background:none;color:var(--tinta,#14213D);padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:20px;background:var(--bruma,#F5FAFB);border-radius:999px;padding:4px 10px}.meta span .ico{width:15px;height:15px}
.meta .v{color:var(--on-exito-suave,#157B4A);font-weight:600;background:var(--exito-suave,#E7F5EE)}.meta .st b{color:var(--estrella,#E3A21C);font-weight:400}.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;background:var(--tinta,#14213D);color:#fff;border-radius:var(--radius-ficha,28px);padding:30px}.trust div{display:grid;gap:8px;align-content:start}
.trust .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-icono,14px);background:rgba(255,255,255,.1);color:var(--confianza-icono,#7FDCE6)}.trust b{font-size:20px;line-height:26px;font-weight:600}.trust p{color:var(--confianza-texto,#C7D2E4);font-size:15px;line-height:22px}</style></head><body><section class="trust" aria-label="Por qué Manik"><div><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" /><path d="m16 9-5.5 5.5L8 12" /></svg></span><b class="d">Médicos verificados</b><p>Revisamos la cédula profesional de cada médico antes de publicarlo.</p></div><div><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /><path d="M7.828 13.07A3 3 0 0 1 12 8.764a3 3 0 0 1 5.004 2.224 3 3 0 0 1-.832 2.083l-3.447 3.62a1 1 0 0 1-1.45-.001z" /></svg></span><b class="d">Opiniones reales</b><p>Solo opina quien tuvo una cita agendada en Manik.</p></div><div><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3" /><path d="M16 2v3" /><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /><path d="m9 15 2 2 4-4" /></svg></span><b class="d">Sin costo para ti</b><p>Buscar y agendar es gratis. Pagas la consulta directo al médico.</p></div></section></body></html>
