<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap"><style>html,body{margin:0}body{background:var(--bruma,#F5FAFB);color:var(--tinta,#14213D);font:17px/26px var(--font-sans,"Onest",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Urbanist",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}p{margin:0}
:focus-visible{outline:3px solid var(--focus,#00788A);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font:600 16px/20px var(--font-sans,"Onest",sans-serif);border:0;cursor:pointer;padding:0 22px;min-height:var(--boton-height,48px)}
.agendar{background:var(--cian-ui,#00788A);color:#fff}.agendar:hover{background:var(--cian-ui-hover,#00606F)}
.buscar{background:var(--tinta,#14213D);color:#fff;min-height:var(--buscar-height,54px);padding:0 26px;font-size:17px}.buscar:hover{background:#000}
.contorno{background:var(--blanco,#fff);color:var(--tinta,#14213D);border:1.5px solid var(--tinta,#14213D);min-height:46px;padding:0 20px}
.enlace{background:none;color:var(--tinta,#14213D);padding:0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.chip{font:500 15px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);background:var(--blanco,#fff);border:1.5px solid var(--linea,#DCE4EA);border-radius:999px;min-height:var(--control-height,42px);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--linea-control,#6B7590)}.chip[aria-pressed="true"]{background:var(--tinta,#14213D);border-color:var(--tinta,#14213D);color:#fff}
.times{display:flex;flex-wrap:wrap;gap:6px}.times button{font:600 15px var(--font-sans,"Onest",sans-serif);font-variant-numeric:tabular-nums;color:var(--cian-ui,#00788A);background:var(--blanco,#fff);border:1.5px solid var(--cian-ui,#00788A);border-radius:999px;min-height:var(--control-height,42px);padding:0 14px;cursor:pointer}
.times button[aria-pressed="true"]{background:var(--cian-ui,#00788A);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:20px;background:var(--bruma,#F5FAFB);border-radius:999px;padding:4px 10px}.meta span .ico{width:15px;height:15px}
.meta .v{color:var(--on-exito-suave,#157B4A);font-weight:600;background:var(--exito-suave,#E7F5EE)}.meta .st b{color:var(--estrella,#E3A21C);font-weight:400}.meta .new{background:var(--luz-calida,#FFEFD2);font-weight:600}.doc{background:var(--blanco,#fff);border:1px solid var(--linea,#DCE4EA);border-radius:var(--radius-ficha,28px);padding:16px;display:grid;grid-template-columns:var(--foto-ficha,132px) minmax(0,1fr);gap:18px;transition:box-shadow .2s ease;max-width:640px}
.doc:hover{box-shadow:var(--shadow-hover,0 12px 30px rgba(20,33,61,.08))}
.face{border-radius:var(--radius-foto,20px);aspect-ratio:3/4;display:grid;place-items:end start;padding:10px 12px;font:300 34px var(--font-display,"Urbanist",sans-serif);letter-spacing:-.02em;color:var(--tinta,#14213D);background:linear-gradient(160deg,var(--foto-inicio,#CDEEF2),var(--foto-fin,#FBE7C9))}
.info{display:grid;gap:8px;align-content:start;min-width:0}.tl{display:flex;justify-content:space-between;gap:10px;align-items:start}
.doc h3{margin:0;font:600 22px/26px var(--font-display,"Urbanist",sans-serif);letter-spacing:-.01em}.doc h3 a{color:inherit;text-decoration:none}.doc h3 a:hover{text-decoration:underline}
.spec{color:var(--muted,#4A5674);font-size:15px;line-height:22px}.price{font:600 18px/24px var(--font-display,"Urbanist",sans-serif);white-space:nowrap}
.when{font-size:15px;font-weight:600;margin-top:4px}.when span{font-weight:400;color:var(--muted,#4A5674)}
.tel{font:600 22px/28px var(--font-display,"Urbanist",sans-serif);font-variant-numeric:tabular-nums;user-select:all}
.agendar,.contorno{justify-self:start}@media (prefers-reduced-motion:reduce){.doc{transition:none}}
@media (max-width:560px){.doc{grid-template-columns:88px minmax(0,1fr);gap:14px;border-radius:24px}.face{font-size:26px}.tl{flex-direction:column;gap:2px}}.fl{display:flex;gap:20px;flex-wrap:wrap;align-items:end}figure{margin:0;display:grid;gap:8px;width:132px}figcaption{font-size:13px;line-height:18px;color:var(--muted,#4A5674)}.reg{flex:1;min-width:220px;display:grid;gap:6px}.reg b{font-size:18px}.reg p{font-size:15px;line-height:22px;color:var(--muted,#4A5674)}</style></head><body><div class="fl"><figure><div class="face" role="img" aria-label="Sin foto: Dra. Lucía Herrera">LH</div><figcaption>Sin foto: iniciales</figcaption></figure><figure><div class="face" style="font-size:26px;width:88px" role="img" aria-label="Sin foto: Dr. Iván Hernández">IH</div><figcaption>En celular, 88 px</figcaption></figure><div class="reg"><b class="d">Retrato del médico</b><p>Vertical 3:4, cara centrada. Mínimo 900 × 1200 px al subirla; se sirve a 480 × 640 en WebP, 120 KB máximo. Luz natural, fondo liso y claro, sin filtros. La foto llega recta: la interfaz pone las esquinas de 20 px.</p></div></div></body></html>
