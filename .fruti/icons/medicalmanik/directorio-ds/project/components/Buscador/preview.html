<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap"><style>html,body{margin:0}body{background:var(--bruma,#F5FAFB);color:var(--tinta,#14213D);font:17px/26px var(--font-sans,"Onest",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Urbanist",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}p{margin:0}
:focus-visible{outline:3px solid var(--focus,#00788A);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;font:600 16px/20px var(--font-sans,"Onest",sans-serif);border:0;cursor:pointer;padding:0 22px;min-height:var(--boton-height,48px)}

.enlace{background:none;color:var(--tinta,#14213D);padding:0;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.chip{font:500 15px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);background:var(--blanco,#fff);border:1.5px solid var(--linea,#DCE4EA);border-radius:999px;min-height:var(--control-height,42px);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--linea-control,#6B7590)}.chip[aria-pressed="true"]{background:var(--tinta,#14213D);border-color:var(--tinta,#14213D);color:#fff}
.times{display:flex;flex-wrap:wrap;gap:6px}.times button{font:600 15px var(--font-sans,"Onest",sans-serif);font-variant-numeric:tabular-nums;color:var(--cian-ui,#00788A);background:var(--blanco,#fff);border:1.5px solid var(--cian-ui,#00788A);border-radius:999px;min-height:var(--control-height,42px);padding:0 14px;cursor:pointer}

.tel-f{border:1px solid var(--linea,#DCE4EA);border-radius:28px;overflow:hidden;background:var(--blanco,#fff);position:relative;min-height:420px;display:flex;flex-direction:column}
.halo{background:radial-gradient(70% 90% at 0% 0%,var(--luz-cian,#D3F0F4),transparent 70%),radial-gradient(60% 80% at 100% 20%,var(--luz-calida,#FFEFD2),transparent 70%),var(--bruma,#F5FAFB)}
.sheet{margin-top:auto;background:var(--blanco,#fff);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(20,33,61,.12);padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}.asa{justify-self:center;width:40px;height:4px;border-radius:2px;background:var(--linea,#DCE4EA)}
.velo{position:absolute;inset:0;background:rgba(20,33,61,.32);display:flex;flex-direction:column}

.full{padding:8px 16px 16px;gap:12px}.tb{display:flex;align-items:center;gap:6px}.tb b{font-size:18px}.fs{display:grid;gap:4px;border:1.5px solid var(--linea-control,#6B7590);border-radius:18px;padding:8px 14px}.fs label{font-size:13px;line-height:18px;font-weight:600;color:var(--muted,#4A5674)}.fs input{border:0;outline:0;font:500 17px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);padding:0;min-width:0}.fs:focus-within{outline:3px solid var(--focus,#00788A);outline-offset:2px}
.ubi{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--cian-ui,#00788A);font:600 15px var(--font-sans,"Onest",sans-serif);min-height:36px;padding:0;cursor:pointer}.ubi .ico{width:16px;height:16px}
.sug{list-style:none;margin:0;padding:0;display:grid}.sug a{display:flex;align-items:center;gap:10px;min-height:48px;color:var(--tinta,#14213D);text-decoration:none;font-size:16px;border-bottom:1px solid var(--linea,#DCE4EA)}.sug .ico{color:var(--muted,#4A5674);width:18px;height:18px}.sug b{font-weight:700}.full .buscar{margin-top:auto;justify-content:center}
.search{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;background:var(--blanco,#fff);border-radius:999px;padding:8px;box-shadow:var(--shadow-buscador,0 12px 32px rgba(20,33,61,.10));max-width:640px;border:1px solid var(--linea,#DCE4EA)}
.f{display:flex;align-items:center;gap:10px;padding:6px 16px;min-width:0}.f+.f{border-left:1px solid var(--linea,#DCE4EA)}.f .ico{color:var(--cian-ui,#00788A)}.f div{display:grid;min-width:0}
.f label{font-size:13px;line-height:18px;font-weight:600;color:var(--muted,#4A5674)}.f input{border:0;outline:0;font:500 17px var(--font-sans,"Onest",sans-serif);color:var(--tinta,#14213D);background:none;padding:0;min-width:0;width:100%}.search:focus-within{outline:3px solid var(--focus,#00788A);outline-offset:3px}
@media (max-width:560px){.search{grid-template-columns:1fr;border-radius:26px;padding:10px}.f+.f{border-left:0;border-top:1px solid var(--linea,#DCE4EA)}.buscar{justify-content:center}}</style></head><body><div class="fila">
