<title>Directorio Manik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap">
<style>
/* Directorio Manik · prototipo. Celular primero (70 %); tema claro único, como el sistema. Tokens del sistema «Directorio Manik». */
:root{
  --bruma:#F5FAFB;--blanco:#FFFFFF;--lavado:#EEF3F5;--tinta:#14213D;--muted:#4A5674;--linea:#DCE4EA;--linea-control:#6B7590;
  --cian:#009BB0;--cian-ui:#00788A;--cian-ui-hover:#00606F;--luz-cian:#D3F0F4;--luz-calida:#FFEFD2;--estrella:#E3A21C;
  --exito:#15814B;--exito-suave:#E7F5EE;--on-exito-suave:#157B4A;--cat-cian:#E4F5F7;--cat-calida:#FFF4E0;--cat-azul:#EEF2F8;
  --texto-calido:#6B4A00;--foto-inicio:#CDEEF2;--foto-fin:#FBE7C9;--confianza-icono:#7FDCE6;--confianza-texto:#C7D2E4;--velo:rgba(20,33,61,.38);
  --display:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sombra-buscador:0 1px 2px rgba(20,33,61,.06),0 12px 32px rgba(20,33,61,.10);--sombra-hover:0 12px 30px rgba(20,33,61,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bruma);color:var(--tinta);font:17px/1.55 var(--sans)}
p{margin:0}h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--cian-ui);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}.inl{display:inline-block;padding-block:12px;font-weight:600;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso{background:var(--tinta);color:var(--confianza-texto);font-size:13px;line-height:18px;text-align:center;padding-block:6px}
.aviso b{color:var(--blanco);font-weight:600}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:999px;font:600 16px/20px var(--sans);border:0;cursor:pointer;padding:0 22px;min-height:48px;text-decoration:none}
.btn .ico{width:18px;height:18px}
.primario{background:var(--cian-ui);color:var(--blanco)}.primario:hover{background:var(--cian-ui-hover)}
.primario[aria-disabled="true"]{background:var(--lavado);color:var(--muted);cursor:not-allowed}
.secundario{background:var(--blanco);color:var(--cian-ui);border:1.5px solid var(--cian-ui)}.secundario:hover{background:var(--luz-cian)}
.oscuro{background:var(--tinta);color:var(--blanco)}.oscuro:hover{background:#000}
.texto{background:none;color:var(--tinta);padding:0 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--tinta)}.ib:hover{background:var(--lavado)}
.chip{font:500 15px var(--sans);color:var(--tinta);background:var(--blanco);border:1.5px solid var(--linea);border-radius:999px;min-height:42px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--linea-control)}.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--blanco)}
.chip .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--tinta);color:var(--blanco);font-size:13px;font-weight:700}

/* Encabezado */
.nav{display:flex;align-items:center;gap:20px;padding-block:14px}
.nav .logo img{height:28px;width:auto;display:block}
.nav ul{display:none;gap:6px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:500;padding:8px 14px;border-radius:999px}.nav ul a:hover{background:rgba(255,255,255,.7)}.nav ul a[aria-current]{background:var(--blanco)}
.nav .me{display:none;margin-left:auto;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:999px;background:var(--blanco)}
.nav .menu{margin-left:auto}
@media (min-width:1024px){.nav ul,.nav .me{display:flex}.nav .menu{display:none}}

/* Inicio */
.halo{background:radial-gradient(60% 70% at 8% 10%,var(--luz-cian) 0%,rgba(211,240,244,0) 70%),radial-gradient(50% 60% at 92% 30%,var(--luz-calida) 0%,rgba(255,239,210,0) 70%),linear-gradient(180deg,var(--bruma) 0%,var(--blanco) 100%)}
.hero{display:grid;gap:22px;padding-block:16px 44px}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--blanco);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:500}
.pill span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--luz-cian);color:var(--cian-ui)}.pill .ico{width:15px;height:15px}
.h1{font:300 clamp(40px,10vw,72px)/1.03 var(--display);letter-spacing:-.035em;max-width:14ch}.h1 b{font-weight:600}
.lead{font-size:18px;color:var(--muted);max-width:40ch}
.campo{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;text-align:left;background:var(--blanco);border:0;border-radius:999px;padding:10px 20px;min-height:64px;box-shadow:var(--sombra-buscador);cursor:pointer;color:var(--tinta);font:inherit}
.campo .ico{color:var(--cian-ui)}.campo b{display:block;font:600 17px/22px var(--sans)}.campo small{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.buscador{display:none;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;background:var(--blanco);border-radius:999px;padding:8px;box-shadow:var(--sombra-buscador);max-width:680px}
.buscador .f{display:flex;align-items:center;gap:10px;padding:6px 16px;min-width:0}.buscador .f+.f{border-left:1px solid var(--linea)}.buscador .f .ico{color:var(--cian-ui)}.buscador .f div{display:grid;min-width:0}
.buscador label{font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}.buscador input{border:0;outline:0;font:500 17px var(--sans);color:var(--tinta);background:none;padding:0;min-width:0;min-height:30px;width:100%}
.buscador:focus-within{outline:3px solid var(--cian-ui);outline-offset:3px}.buscador .btn{min-height:54px;padding:0 26px}
@media (min-width:1024px){.campo{display:none}.buscador{display:grid}.hero{padding-block:40px 64px}}
.atajos{display:flex;flex-wrap:wrap;gap:8px}
.atajos button{display:inline-flex;align-items:center;gap:8px;color:var(--tinta);background:rgba(255,255,255,.85);border:1px solid var(--linea);border-radius:999px;padding:0 14px 0 10px;min-height:40px;font:500 15px var(--sans);cursor:pointer}
.atajos .ico{width:18px;height:18px;color:var(--cian-ui)}.atajos button:hover{background:var(--blanco);border-color:var(--linea-control)}
.sec{display:grid;gap:20px;padding-block:36px}
.h2{font:400 clamp(28px,6vw,40px)/1.08 var(--display);letter-spacing:-.03em}.h2 b{font-weight:600}
.sub{color:var(--muted);max-width:52ch}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:1024px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cat{display:grid;gap:22px;align-content:space-between;text-align:left;color:var(--tinta);border:0;border-radius:24px;padding:16px;min-height:150px;cursor:pointer;font:inherit;transition:transform .2s ease}
.cat:nth-child(3n+1){background:var(--cat-cian)}.cat:nth-child(3n+2){background:var(--cat-calida)}.cat:nth-child(3n){background:var(--cat-azul)}.cat:hover{transform:translateY(-3px)}
.cat .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--blanco);color:var(--cian-ui)}.cat .ic .ico{width:22px;height:22px}
.cat b{font:600 19px/1.15 var(--display);display:block}.cat small{color:var(--muted);font-size:14px;line-height:20px}
.trust{display:grid;gap:18px;background:var(--tinta);color:var(--blanco);border-radius:28px;padding:26px}
@media (min-width:768px){.trust{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trust div{display:grid;gap:8px;align-content:start}.trust .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);color:var(--confianza-icono)}
.trust b{font:600 20px/26px var(--display)}.trust p{color:var(--confianza-texto);font-size:15px;line-height:22px}
.pie{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding-block:32px 48px;color:var(--muted);font-size:15px}.pie img{height:22px;width:auto;display:block}

/* Inicio r03 (aprobado 2026-11-04) */
.hero{grid-template-columns:minmax(0,1fr)}.htxt{display:grid;gap:20px;align-content:center;min-width:0}
.donde{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:15px;line-height:22px;color:var(--muted)}.donde .ico{width:16px;height:16px;color:var(--cian-ui)}.donde>span{display:inline-flex;align-items:center;gap:6px}.donde b{color:var(--tinta);font-weight:600}
.foto{display:none;aspect-ratio:4/5;border-radius:32px;background:linear-gradient(160deg,var(--foto-inicio),var(--foto-fin));align-items:end;padding:16px;font-size:13px;color:var(--muted)}
@media (min-width:640px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px;align-items:center}.foto{display:flex}}
.lnk{justify-self:start;font-weight:600;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;font-size:16px;font-family:var(--sans);cursor:pointer}
.hoy{display:grid;gap:12px}@media (min-width:640px){.hoy{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (min-width:1024px){.hoy{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mf{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mf .face{grid-row:1/4;align-self:start;border-radius:14px}.mf b{font:600 18px/22px var(--display)}.mf b a{text-decoration:none;display:inline-block;padding-block:3px}.mf b a:hover{text-decoration:underline}.mf small{font-size:14px;line-height:20px;color:var(--muted)}.mf .ced{grid-column:2}.mf .btn{grid-row:1/4;grid-column:3;min-height:44px;padding:0 18px}
.dud{display:grid;gap:12px}@media (min-width:640px){.dud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dud h3{grid-column:1/-1;font:600 15px/20px var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:4px}
.dud .acc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.q{display:grid;gap:6px;text-align:left;background:var(--blanco);border:1px solid var(--linea);border-radius:22px;padding:16px;font:inherit;color:var(--tinta);cursor:pointer;width:100%}
.q:hover{box-shadow:var(--sombra-hover)}.q b{font:600 18px/24px var(--display)}.q small{font-size:14px;line-height:20px;color:var(--muted)}
.q.art{grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;column-gap:14px}.q.art .th{grid-row:1/3;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:grid;place-items:center;background:var(--cat-cian);color:var(--cian-ui)}
@media (min-width:1024px){.q.art{grid-template-columns:160px minmax(0,1fr);column-gap:18px;align-content:start}.q.art .th{aspect-ratio:4/3}}.q.art:nth-of-type(even) .th{background:var(--cat-calida)}
.pasos{display:grid;gap:16px;counter-reset:p;list-style:none;margin:0;padding:0}@media (min-width:768px){.pasos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pasos li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}.pasos li::before{counter-increment:p;content:counter(p);width:44px;height:44px;border-radius:50%;background:var(--luz-cian);color:var(--cian-ui);display:grid;place-items:center;font:600 18px var(--display)}
.pasos b{display:block;font:600 19px/24px var(--display)}.pasos span span{color:var(--muted);font-size:15px;line-height:22px}
.soymed{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:20px}
.soymed b{font:600 20px/26px var(--display);display:block}.soymed p{color:var(--muted);font-size:15px}

/* Resultados */
.rh{display:grid;gap:4px;padding-block:8px 12px}
.rh .h2 small{display:block;font:400 15px/22px var(--sans);color:var(--muted);letter-spacing:0;margin-top:4px}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bruma);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px 12px;border-bottom:1px solid var(--linea)}
.barra .sel{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.barra select{font:500 15px var(--sans);color:var(--tinta);border:1.5px solid var(--linea);border-radius:999px;min-height:42px;padding:0 14px;background:var(--blanco)}
.barra .solo-esc{display:none}@media (min-width:1024px){.barra .solo-esc{display:contents}.barra .solo-cel{display:none}}
.lista{display:grid;gap:12px;padding-block:16px 40px;align-items:start;container-type:inline-size}
@media (min-width:640px){.lista{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lista>.ad,.lista>.vacio{grid-column:1/-1}
.fm{container-type:inline-size;min-width:0}
.fmi{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:14px;display:grid;gap:12px;grid-template-columns:72px minmax(0,1fr);align-items:start;transition:box-shadow .2s ease}
.fmi:hover{box-shadow:var(--sombra-hover)}
.face{border-radius:16px;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(160deg,var(--foto-inicio),var(--foto-fin));max-width:100%}.face img{width:100%;height:100%;display:block;object-fit:cover}
.who{display:grid;gap:4px;min-width:0}.fmi h3{font:600 20px/24px var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}.fmi h3 a{text-decoration:none}.fmi h3 a:hover{text-decoration:underline}
.spec{color:var(--muted);font-size:15px;line-height:22px}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:20px;background:var(--bruma);border-radius:999px;padding:4px 10px}.meta .ico{width:15px;height:15px}
.meta .v{color:var(--on-exito-suave);font-weight:600;background:var(--exito-suave)}
.ced{margin:0;display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}.ced .ico{flex:none;width:16px;height:16px;margin-top:1px;color:var(--on-exito-suave)}.ced abbr{text-decoration:none}.meta .st b{color:var(--estrella);font-weight:400}
.cons{grid-column:1/-1;display:grid;border:1px solid var(--linea);border-radius:18px;min-width:0}
.co{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px}.co+.co{border-top:1px solid var(--linea)}
.co .l1{font-size:15px;line-height:22px;font-weight:600}.co .l1 b{font:600 17px/22px var(--display)}
.co .l2{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;font-size:14px;line-height:20px;color:var(--muted)}.co .l2 .ico{width:16px;height:16px;color:var(--cian-ui)}
.co .btn{grid-column:2;grid-row:1/3;min-height:44px;min-width:92px;padding:0 16px}
.co .alt{grid-column:1;display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:14px;font-weight:600;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;justify-self:start;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}.co .alt .ico{width:16px;height:16px}
.mas{grid-column:1/-1;justify-self:start;font:600 14px var(--sans);color:var(--tinta);background:none;border:0;padding:0;min-height:36px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@container (min-width:560px){.fmi{grid-template-columns:132px minmax(0,1fr);gap:12px 18px;padding:16px;border-radius:28px}.fmi .face{grid-row:1/4;border-radius:20px}.cons,.mas{grid-column:2}.fmi h3{font-size:22px;line-height:26px}}
.ad{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--luz-calida);border-radius:22px;padding:16px 20px;font-size:16px;line-height:24px}
.ad .lbl{font-weight:700;font-size:13px;line-height:18px;color:var(--texto-calido);background:var(--blanco);border-radius:999px;padding:3px 10px}.ad a{margin-left:auto;font-weight:600}
.vacio{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:28px 20px;display:grid;gap:12px;justify-items:center;text-align:center}
.vacio .ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--luz-cian);color:var(--cian-ui)}
.vacio h3{font:600 22px/26px var(--display)}.vacio p{color:var(--muted);max-width:42ch}.vacio .acc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Perfil */
.volver{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;text-decoration:none;color:var(--tinta)}
.perfil{display:grid;gap:20px;padding-block:8px 120px}
@media (min-width:1024px){.perfil{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start;padding-bottom:56px}}
.ph{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:640px){.ph{grid-template-columns:150px minmax(0,1fr)}}
.ph h1{font:600 clamp(26px,6vw,34px)/1.1 var(--display);letter-spacing:-.02em}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:18px;display:grid;gap:10px}
.bloque h2{font:600 20px/26px var(--display)}.bloque p{color:var(--muted);font-size:16px}
.copc{display:grid;gap:10px}
.copt{display:grid;gap:8px;background:var(--blanco);border:1.5px solid var(--linea);border-radius:20px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:var(--tinta);width:100%}
.copt[aria-pressed="true"]{border-color:var(--cian-ui);box-shadow:0 0 0 1px var(--cian-ui)}
.copt .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.copt .r b{font:600 18px/24px var(--display)}
.copt .dir{font-size:14px;line-height:20px;color:var(--muted)}.copt .forma{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--muted)}.copt .forma .ico{width:16px;height:16px;color:var(--cian-ui)}
.copt .sel-l{font-size:13px;font-weight:600;color:var(--cian-ui)}
.prox{display:grid;gap:10px}.prox h3{font:600 17px/22px var(--display)}
.horas{display:flex;flex-wrap:wrap;gap:8px}
.horas button{font:600 15px var(--sans);font-variant-numeric:tabular-nums;color:var(--cian-ui);background:var(--blanco);border:1.5px solid var(--cian-ui);border-radius:10px;min-height:42px;min-width:72px;padding:0 12px;cursor:pointer}
.horas button[aria-pressed="true"]{background:var(--cian-ui);color:var(--blanco)}
.tel{font:600 24px/30px var(--display);font-variant-numeric:tabular-nums;user-select:all}
.acc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  return MED.filter(m => (m.cats||['Piel']).includes(S.cat)).map(m => { const ok = m.cons.filter(cumple).sort((a,b)=>a.km-b.km); if (!ok.length) return null; const resto = m.cons.filter(c=>!ok.includes(c)).sort((a,b)=>a.km-b.km); return {m, cons:[...ok, ...resto]}; })
   .filter(Boolean).sort((a,b) => S.orden==='precio' ? a.cons[0].pr-b.cons[0].pr : S.orden==='op' ? b.m.op-a.m.op : a.cons[0].km-b.cons[0].km);
}
const nFiltros = () => (S.f.manik?1:0)+(S.f.hoy?1:0)+(S.f.precio?1:0);

// Piezas
const meta = m => m.r ? `<div class="meta"><span class="st"><b aria-hidden="true">★</b> ${m.r} · ${m.op} opiniones</span></div>` : '';
const ced = m => `<p class="ced">${ic('badge-check')}<span class="vh">Cédulas verificadas por Manik: </span><span><span class="nw"><abbr title="Cédula profesional">Céd. Prof.</abbr> ${m.ced[0]}</span>${m.ced[1] ? ` · <span class="nw"><abbr title="Cédula de especialidad">Céd. Esp.</abbr> ${m.ced[1]}</span>` : ''}</span></p>`;
const avatar = m => `<div class="face"><img src="${IMG[m.av]}" alt="Sin foto: ${m.n}"></div>`;
function fila(m, c, prim){
  const p = prox(c);
  const l2 = c.manik ? `${ic('calendar-check')}<span class="nw">Agenda en Manik</span> <span class="nw">· ${p ? nombreDia(p.off) + ', ' + p.h : 'sin lugar en 2 semanas'}</span>` : `${ic('phone')}<span class="nw">Por teléfono</span> <span class="nw">· ${c.tel}</span>`;
  const btn = c.manik ? `<button class="btn ${prim?'primario':'secundario'}" data-agendar="${m.id}|${c.id}">Agendar</button>` : `<a class="btn ${prim?'primario':'secundario'}" href="tel:+52${c.tel.replace(/ /g,'')}" data-llamar="${c.tel}">Llamar</a>`;
  const alt = c.manik && c.tel ? `<a class="alt" href="tel:+52${c.tel.replace(/ /g,'')}" data-llamar="${c.tel}">${ic('phone')}o llama al ${c.tel}</a>` : '';
  return `<div class="co" role="listitem"><span class="l1">${c.lu} · <span class="nw">${c.km} km · <b>${peso(c.pr)}</b></span></span>${btn}<span class="l2">${l2}</span>${alt}</div>`;
}
function ficha({m, cons}){
  const extra = cons.length > 2 ? `<a class="mas" href="#medico-${m.id}">Ver ${cons.length-2} consultorio${cons.length>3?'s':''} más</a>` : '';
  return `<article class="fm"><div class="fmi">${avatar(m)}<div class="who"><h3><a href="#medico-${m.id}">${m.n}</a></h3><p class="spec">${m.esp}${m.foco?' · '+m.foco:''}</p>${ced(m)}${meta(m)}</div>
  <div class="cons" role="list" aria-label="Consultorios de ${m.n}">${cons.slice(0,2).map((c,i)=>fila(m,c,i===0)).join('')}</div>${extra}</div></article>`;
}
const nav = (act) => `<header class="wrap nav"><a class="logo" href="#inicio" aria-label="Manik, inicio"><img src="${IMG.logo}" alt=""></a><ul><li><a href="#resultados" ${act==='buscar'?'aria-current="page"':''}>Especialidades</a></li><li><a href="#dudas">Preguntas</a></li><li><a href="#dudas">Artículos</a></li></ul><a class="me" href="#inicio">Soy médico</a><button class="ib menu" aria-label="Menú">${ic('menu')}</button></header>`;

// Vistas
const V = {};
const HOY = () => MED.map(m => { const c = m.cons.find(c => c.manik && c.ag && c.ag[0]); return c ? {m, c} : null; }).filter(Boolean).sort((a,b)=>a.c.km-b.c.km);
const PREG = [['¿El acné en adultos se quita solo?','soto',2],['Se me cae mucho el cabello, ¿a qué especialista voy?','luna',3]];
// Portadas de ejemplo (abstractas): en producción, la imagen que sube el médico
const PORTADA = (a, b, c) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="${a}"/><circle cx="250" cy="40" r="90" fill="${b}"/><circle cx="70" cy="170" r="70" fill="${c}"/><path d="M0 120 Q160 60 320 130 V180 H0Z" fill="${b}" opacity=".55"/></svg>`);
const ART = [['Qué es la dermatitis atópica','ramos','scan-face',5,PORTADA('#D3F0F4','#9FDCE5','#FFEFD2')],['Urticaria: qué es y cuándo preocuparse','hernandez','flower-2',4,PORTADA('#FFEFD2','#F6D49B','#D3F0F4')]];
const medDe = id => MED.find(m => m.id === id);
V.inicio = () => { const hoy = HOY(); return `<div class="halo">${nav('')}
<section class="wrap hero" aria-labelledby="h-ini"><div class="htxt"><span class="pill"><span>${ic('shield-check')}</span>Médicos con registro verificado</span>
<h1 class="h1" id="h-ini">Encuentra a tu médico, ve cuánto cuesta y <b>agenda</b>.</h1><p class="lead">La consulta es en su consultorio. Buscar y agendar es gratis.</p>
<button class="campo" data-abrir="buscar" aria-haspopup="dialog">${ic('search')}<span><b>¿Qué necesitas?</b><small>Especialidad, síntoma o nombre del médico</small></span></button>
<form class="buscador" role="search" data-form="buscar"><div class="f">${ic('search')}<div><label for="q">Qué necesitas</label><input id="q" value="${S.q}" placeholder="Especialidad, síntoma o médico" autocomplete="off"></div></div><div class="f">${ic('map-pin')}<div><label for="w">Dónde</label><input id="w" value="${S.donde}" placeholder="Colonia o ciudad" autocomplete="off"></div></div><button class="btn oscuro" type="submit">Buscar</button></form>
<p class="donde"><span>${ic('map-pin')}Cerca de <b>${S.donde}</b> (aproximado)</span><button class="ubi" data-ubi-ini>${ic('locate-fixed')}Usar mi ubicación</button></p></div>
<div class="foto" aria-hidden="true">Foto de marca 4:5 (pendiente)</div></section></div>
<section class="wrap sec" aria-labelledby="h-cat"><div><h2 class="h2" id="h-cat">Busca por <b>lo que sientes</b></h2><p class="sub">Si no sabes a qué especialista ir, empieza por aquí.</p></div>
<div class="cats">${CATS.map(c=>`<button class="cat" data-cat="${c[1]}"><span class="ic">${ic(c[0])}</span><span><b>${c[1]}</b><small>${c[2]}</small></span></button>`).join('')}</div><button class="lnk" data-toast="El listado de especialidades aún no está en el prototipo">Ver todas las especialidades</button></section>
${hoy.length ? `<section class="wrap sec" aria-labelledby="h-hoy"><h2 class="h2" id="h-hoy">Con lugar <b>hoy</b> cerca de ti</h2>
<div class="hoy">${hoy.map(({m,c})=>`<article class="mf">${avatar(m)}<b><a href="#medico-${m.id}">${m.n}</a></b><small><span class="nw">${m.esp}</span> · <span class="nw">${c.km} km</span> · <span class="nw">${peso(c.pr)}</span> · <span class="nw">Hoy ${c.ag[0][0]}</span></small>${ced(m)}<a class="btn secundario" href="#medico-${m.id}" aria-label="Ver a ${m.n}">Ver</a></article>`).join('')}</div>
<button class="lnk" data-hoy>Ver todos con lugar hoy</button></section>` : ''}
<section class="wrap sec" id="dudas" aria-labelledby="h-dud"><div><h2 class="h2" id="h-dud">Resuelve tus <b>dudas</b></h2><p class="sub">Solo responden y escriben médicos que atienden con el expediente Manik.</p></div>
<div class="dud"><h3>Preguntas de pacientes</h3>${PREG.map(([t,id,n])=>{const m=medDe(id);return `<button class="q" data-toast="La página de la pregunta aún no está en el prototipo"><b>${t}</b><small><span class="nw">Responde ${m.n}</span> · <span class="nw">${m.esp}</span> · <span class="nw">${n} respuestas de médicos</span></small></button>`}).join('')}
<div class="acc"><button class="btn secundario" data-toast="El formulario de pregunta es la siguiente ronda (pregunta/r01)">Haz tu pregunta</button><button class="lnk" data-toast="El listado de preguntas aún no está en el prototipo">Ver más preguntas</button></div>
<h3>Artículos de médicos</h3>${ART.map(([t,id,i,min,img])=>{const m=medDe(id);return `<button class="q art" data-toast="La página del artículo aún no está en el prototipo">${img ? `<img class="th" src="${img}" alt="">` : `<span class="th">${ic(i)}</span>`}<b>${t}</b><small><span class="nw">Por ${m.n}</span> · <span class="nw">${m.esp}</span> · <span class="nw">${min} min</span></small></button>`}).join('')}
<div class="acc"><button class="lnk" data-toast="El listado de artículos aún no está en el prototipo">Ver artículos</button></div></div></section>
<section class="wrap sec" aria-labelledby="h-como"><h2 class="h2" id="h-como">Cómo <b>funciona</b></h2><ol class="pasos"><li><span><b>Busca</b><span>Por especialidad, por lo que sientes o por nombre.</span></span></li><li><span><b>Compara</b><span>Precio, distancia y opiniones de cada consultorio.</span></span></li><li><span><b>Agenda</b><span>En Manik o por teléfono. La consulta es en el consultorio.</span></span></li></ol></section>
<section class="wrap sec"><div class="trust" aria-label="Por qué Manik"><div><span class="ic">${ic('badge-check')}</span><b>Médicos verificados</b><p>Revisamos el registro profesional de cada médico (cédula profesional).</p></div><div><span class="ic">${ic('message-circle-heart')}</span><b>Opiniones reales</b><p>Solo opina quien tuvo cita en Manik.</p></div><div><span class="ic">${ic('calendar-check')}</span><b>Gratis para ti</b><p>Pagas la consulta en el consultorio.</p></div></div></section>
<section class="wrap sec"><div class="soymed"><div><b>¿Eres médico?</b><p>Aparece en Manik y recibe pacientes.</p></div><button class="btn secundario" data-toast="La página para médicos aún no está en el prototipo">Soy médico</button></div></section>
<footer class="wrap pie"><img src="${IMG.logo}" alt="manik"><span>de MedicalManik</span><span>Aviso de privacidad</span><span>Términos</span></footer>`; };

V.resultados = () => {
  const r = resultados(); const n = r.length;
  const titulo = S.cat === 'Piel' ? `<b>Dermatólogas</b> cerca de ti` : `<b>${S.cat}</b> cerca de ti`;
  const chipsEsc = `<span class="solo-esc"><button class="chip" aria-pressed="${S.f.manik}" data-f="manik">Agenda en Manik</button><button class="chip" aria-pressed="${S.f.hoy}" data-f="hoy">Con lugar hoy</button><button class="chip" aria-pressed="${S.f.precio===800}" data-f="p800">Hasta $800</button></span>`;
  let lista = r.map(ficha);
  if (n >= 2) lista.splice(2, 0, `<aside class="ad" aria-label="Anuncio"><span class="lbl">Patrocinado</span><span>Clínica Dermalia: revisión de lunares, $650 hasta el 30 de noviembre.</span><a href="#resultados">Ver promoción</a></aside>`);
  if (!n) lista = [S.cat !== 'Piel'
    ? `<div class="vacio"><span class="ic">${ic('search')}</span><h3>Aún no hay especialistas de ${S.cat.toLowerCase()} en este prototipo</h3><p>El ejemplo solo tiene dermatología y pediatría. Prueba con «Piel» o «Niñas y niños».</p><div class="acc"><button class="btn primario" data-cat="Piel">Ver dermatología</button></div></div>`
    : `<div class="vacio"><span class="ic">${ic('sliders-horizontal')}</span><h3>Nadie cumple todos tus filtros</h3><p>Filtros activos: ${[S.f.manik&&'Agenda en Manik', S.f.hoy&&'Con lugar hoy', S.f.precio&&'Hasta '+peso(S.f.precio)].filter(Boolean).join(' · ')}.</p><div class="acc"><button class="btn primario" data-limpiar>Quitar filtros</button></div></div>`];
  return `${nav('buscar')}<main class="wrap"><div class="rh"><a class="volver" href="#inicio">${ic('arrow-left')}Inicio</a><h1 class="h2">${titulo}<small>${n} especialista${n===1?'':'s'} · ${S.donde}</small></h1></div>
  <div class="barra"><span class="solo-cel"><button class="chip" data-abrir="filtros" aria-haspopup="dialog">${ic('sliders-horizontal')}Filtros${nFiltros()?` <span class="n">${nFiltros()}</span>`:''}</button></span>${chipsEsc}
  <span class="sel"><label for="orden">Ordenar</label><select id="orden"><option value="km" ${S.orden==='km'?'selected':''}>Más cerca</option><option value="precio" ${S.orden==='precio'?'selected':''}>Menor precio</option><option value="op" ${S.orden==='op'?'selected':''}>Más opiniones</option></select></span></div>
  <div class="lista" aria-live="polite">${lista.join('')}</div></main>`;
};

V.medico = (id) => {
  const m = MED.find(x=>x.id===id); if (!m) return V.resultados();
  if (!S.med || S.med !== m.id || !m.cons.find(c=>c.id===S.cons)) { S.med = m.id; S.cons = [...m.cons].sort((a,b)=>a.km-b.km)[0].id; S.dia = null; S.verH = false; }
  const c = m.cons.find(x=>x.id===S.cons), tel = c.tel ? `tel:+52${c.tel.replace(/ /g,'')}` : '';
  const p = prox(c);
  if (c.manik && (S.dia === null || !c.ag[S.dia])) S.dia = p ? p.off : null;
  // Agenda tu cita
  const seg = m.cons.length > 1 ? `<div class="seg" role="group" aria-label="Consultorio">${[...m.cons].sort((a,b)=>a.km-b.km).map(x=>`<button data-cons="${x.id}" aria-pressed="${x.id===c.id}">${x.lu} · ${peso(x.pr)}</button>`).join('')}</div>` : '';
  const co = `<div class="ag-co"><div class="r"><b>${c.lu}</b><span class="pr">${peso(c.pr)}</span></div><span class="dir">${c.dir} · ${c.km} km</span><span class="forma">${c.manik ? ic('calendar-check') + 'Agenda en Manik · la consulta es en el consultorio' : ic('phone') + 'Por teléfono · ' + c.tel}</span></div>`;
  let ag;
  if (c.manik && p) {
    const dias = Array.from({length:10},(_,k)=>k).map(k => { const d = dia(k), hay = !!c.ag[k];
      return `<button data-dia="${k}" aria-pressed="${k===S.dia}" ${hay?'':'disabled'} aria-label="${fechaLarga(k)}${hay?', '+c.ag[k].length+' horarios':', sin lugar'}"><small>${k===0?'Hoy':k===1?'Mañana':DIAS[d.getDay()].slice(0,3).replace(/^./,x=>x.toUpperCase())}</small><b>${d.getDate()}</b><small>${hay?c.ag[k].length+' lugar'+(c.ag[k].length>1?'es':''):'sin lugar'}</small></button>`; }).join('');
    const hs = c.ag[S.dia] || [], vis = S.verH ? hs : hs.slice(0,6);
    ag = `<div class="prim-box"><span><small>Próximo lugar</small><b>${nombreDia(p.off)}, ${p.h}</b></span><button class="btn primario" data-hora="${p.off}|${p.h}">Agendar ${p.h}</button></div>
    <div class="dias" role="group" aria-label="Día">${dias}</div>${S.dia !== 0 && p.off !== 0 ? '' : ''}
    <div class="horas" role="group" aria-label="Horarios de ${fechaLarga(S.dia)}">${vis.map(h=>`<button data-hora="${S.dia}|${h}">${h}</button>`).join('')}</div>
    <div class="acc">${hs.length > 6 && !S.verH ? `<button class="btn texto" data-verh>Ver más horarios</button>` : ''}${c.tel ? `<a class="btn texto" href="${tel}" data-llamar="${c.tel}">o llama al ${c.tel}</a>` : ''}<button class="btn texto" data-toast="Aquí se abriría el mapa">Cómo llegar</button></div>`;
  } else if (c.manik) {
    ag = `<p class="spec" role="status">No hay lugar en las próximas 2 semanas.</p><div class="acc">${c.tel ? `<a class="btn primario solo-esc-btn" href="${tel}" data-llamar="${c.tel}">${ic('phone')}Llamar</a>` : ''}<button class="btn texto" data-toast="Más fechas: siguiente ronda">Ver más fechas</button></div>`;
  } else {
    ag = `<p class="tel">${c.tel}</p><div class="acc"><a class="btn primario solo-esc-btn" href="${tel}" data-llamar="${c.tel}">${ic('phone')}Llamar</a><button class="btn secundario" data-copiar="${c.tel}">${ic('copy')}Copiar número</button><button class="btn texto" data-toast="Aquí se abriría el mapa">Cómo llegar</button></div>`;
  }
  const agB = `<section class="bloque pf-ag" id="sec-agenda" aria-labelledby="h-ag"><h2 id="h-ag">${c.manik ? 'Agenda tu cita' : 'Consultorio'}</h2>${seg}${co}${ag}</section>`;
  // Secciones (sin datos = no aparecen)
  const sec = [];
  if (m.pad && m.pad.length) sec.push(['padecimientos','Padecimientos',`<h2 id="h-pad">Padecimientos que atiende</h2><ul class="tags">${m.pad.map(x=>`<li>${x}</li>`).join('')}</ul>`]);
  if (m.r && m.ops && m.ops.length) sec.push(['opiniones','Opiniones',`<h2 id="h-opiniones">Opiniones</h2><div class="op-res"><span class="n">${m.r}</span><span><span class="st" aria-hidden="true">★★★★★</span><small>${m.op.toLocaleString('es-MX')} opiniones verificadas</small></span></div><div class="ops">${m.ops.map(o=>`<article class="op"><div class="h"><span class="ini" aria-hidden="true">${o[0]}</span><b>${o[1]}</b><small>${o[2]}</small></div><p>${o[3]}</p><span class="ver">${ic('badge-check')}Opinión verificada</span></article>`).join('')}</div><button class="btn texto" style="justify-self:start" data-toast="Todas las opiniones: siguiente ronda">Ver las ${m.op.toLocaleString('es-MX')} opiniones</button>`]);
  if (m.bio) sec.push(['sobre','Sobre mí',`<h2 id="h-sobre">Sobre mí</h2><p>${m.bio}</p>`]);
  sec.push(['formacion','Formación',`<h2 id="h-formacion">Formación académica</h2><ol class="forml">${m.tit.map(t=>`<li><span class="y">${t[0]}</span><span><b>${t[1]}</b><span>${t[2]}</span><span class="ced">${ic('badge-check')}<span>${t[3]==='p'?'Céd. Prof. '+m.ced[0]:'Céd. Esp. '+m.ced[1]}</span></span></span></li>`).join('')}</ol><p class="fuente">Datos de sus cédulas verificadas.</p>`]);
  if (m.faq && m.faq.length) sec.push(['dudas','Dudas frecuentes',`<h2 id="h-dudas">Dudas frecuentes</h2><p>Respuestas de ${m.n.split(' ').slice(0,3).join(' ')} a lo que más le preguntan sus pacientes.</p><div class="faq">${m.faq.map((f,i)=>`<details${i===0?' open':''}><summary>${f[0]}</summary><div class="a">${f[1].map(x=>`<p>${x}</p>`).join('')}<p class="nota">Esta información orienta; no sustituye una consulta.</p></div></details>`).join('')}</div>`]);
  if (m.gal) sec.push(['galeria','Galería',`<h2 id="h-galeria">Galería</h2><ul class="gal" aria-label="Fotos del consultorio (de ejemplo)">${'<li></li>'.repeat(m.gal)}</ul>`]);
  const jumpL = [['sec-agenda', c.manik ? 'Agenda' : 'Consultorio'], ...sec.map(x=>['sec-'+x[0], x[1]])];
  const jump = jumpL.length >= 4 ? `<nav class="jump" aria-label="Secciones del perfil">${jumpL.map(x=>`<button data-sec="${x[0]}">${x[1]}</button>`).join('')}</nav>` : '';
  const rate = m.r ? `<button class="rate" data-sec="sec-opiniones"><b aria-hidden="true">★</b> ${m.r} · ${m.op.toLocaleString('es-MX')} opiniones</button>` : '';
  const barra = c.manik && p ? `<div class="barra-acc"><div><b>${peso(c.pr)} · ${nombreDia(p.off)}, ${p.h}</b><span>Próximo lugar · ${c.lu}</span></div><button class="btn primario" data-hora="${p.off}|${p.h}">Agendar</button></div>`
    : c.tel ? `<div class="barra-acc"><div><b>${peso(c.pr)}</b><span>Consulta · ${c.lu}</span></div><a class="btn primario" href="${tel}" data-llamar="${c.tel}">${ic('phone')}Llamar</a></div>` : '';
  return `${nav('buscar')}<main class="wrap"><a class="volver" href="#resultados">${ic('arrow-left')}Resultados</a>
  <div class="pf-head"><div class="ph">${avatar(m)}<div class="who"><h1>${m.n}</h1><p class="spec">${m.esp}${m.foco?' · '+m.foco:''}</p>${ced(m)}${rate}</div></div></div>
  ${jump}<div class="pf-cuerpo">${agB}${sec.map(x=>`<section class="bloque" id="sec-${x[0]}" aria-labelledby="h-${x[0]}">${x[2]}</section>`).join('')}</div></main>${barra}`;
};

V.agendar = () => {
  const m = MED.find(x=>x.id===S.med), c = m && m.cons.find(x=>x.id===S.cons);
  if (!c || !c.manik) { location.hash = 'resultados'; return ''; }
  const ks = Array.from({length:10}, (_,i)=>i);
  if (S.dia === null || !c.ag[S.dia]) S.dia = Object.keys(c.ag).map(Number).sort((a,b)=>a-b)[0];
  const dias = ks.map(k => { const d = dia(k); const hay = !!c.ag[k];
    return `<button data-dia="${k}" aria-pressed="${k===S.dia}" ${hay?'':'disabled'} aria-label="${fechaLarga(k)}${hay?'':', sin horarios'}"><small>${k===0?'Hoy':k===1?'Mañana':DIAS[d.getDay()].slice(0,3)}</small><b>${d.getDate()}</b><small>${hay?c.ag[k].length+' lugar'+(c.ag[k].length>1?'es':''):'—'}</small></button>`; }).join('');
  const horas = (c.ag[S.dia]||[]).map(h=>`<button data-elige="${h}" aria-pressed="${S.hora===h}">${h}</button>`).join('');
  const listo = !!S.hora;
  return `${nav('buscar')}<main class="wrap"><a class="volver" href="#medico-${m.id}">${ic('arrow-left')}${m.n}</a>
  <div class="paso"><span class="prop">Pantalla propuesta · por aprobar</span><h1>Elige día y hora</h1>
  <div class="res">${avatar(m)}<div><b>${m.n}</b><span>${c.lu} · ${c.dir} · Consulta ${peso(c.pr)}</span></div></div>
  <div><p class="franja" style="margin-bottom:8px">Días con lugar</p><div class="dias" role="group" aria-label="Días">${dias}</div></div>
  <div><p class="franja" style="margin-bottom:8px">${fechaLarga(S.dia).replace(/^./, x=>x.toUpperCase())}</p><div class="horas" role="group" aria-label="Horarios">${horas}</div></div>
  ${c.tel ? `<p class="spec">¿Prefieres llamar? <a class="inl" href="tel:+52${c.tel.replace(/ /g,'')}" data-llamar="${c.tel}">${c.tel}</a></p>` : ''}</div></main>
  <div class="pie-paso"><div class="in"><div>${listo ? `<b>${nombreDia(S.dia, true)}, ${S.hora}</b>${c.lu}` : '<b>Elige un horario</b>para continuar'}</div><button class="btn primario" data-ir="confirmar" aria-disabled="${!listo}">Continuar</button></div></div>`;
};

V.confirmar = () => {
  const m = MED.find(x=>x.id===S.med), c = m && m.cons.find(x=>x.id===S.cons);
  if (!c || !S.hora) { location.hash = 'resultados'; return ''; }
  const d = S.datos;
  return `${nav('buscar')}<main class="wrap"><a class="volver" href="#medico-${m.id}">${ic('arrow-left')}Cambiar horario</a>
  <form class="paso" data-form="confirmar" novalidate><h1>Confirma tu cita</h1>
  <dl class="det"><div><dt>Médico</dt><dd>${m.n}</dd></div><div><dt>Cuándo</dt><dd>${fechaLarga(S.dia)}, ${S.hora}</dd></div><div><dt>Dónde</dt><dd>${c.lu} · ${c.dir}</dd></div><div><dt>Consulta</dt><dd>${peso(c.pr)} · pagas en el consultorio</dd></div></dl>
  <div class="form"><div class="campo-f" id="cf-nombre"><label for="nombre">Nombre completo</label><input id="nombre" autocomplete="name" value="${d.nombre||''}" required><span class="errm">Escribe tu nombre para que el consultorio te reciba.</span></div>
  <div class="campo-f" id="cf-cel"><label for="cel">Celular</label><input id="cel" inputmode="tel" autocomplete="tel" placeholder="10 dígitos" value="${d.cel||''}" required><small>Te mandamos la confirmación y un recordatorio un día antes.</small><span class="errm">Escribe un celular de 10 dígitos.</span></div>
  <p class="spec" style="font-size:14px">Al confirmar aceptas el <a class="inl" style="padding-block:4px;font-weight:600" href="#confirmar" data-toast="Aviso de privacidad (ejemplo)">aviso de privacidad</a>. Tus datos solo se comparten con el consultorio.</p></div></form></main>
  <div class="pie-paso"><div class="in"><div><b>${nombreDia(S.dia, true)}, ${S.hora}</b>${c.lu} · ${peso(c.pr)}</div><button class="btn primario" data-confirmar>Confirmar cita</button></div></div>`;
};

V.confirmada = () => {
  const m = MED.find(x=>x.id===S.med), c = m && m.cons.find(x=>x.id===S.cons);
  if (!c || !S.hora) { location.hash = 'inicio'; return ''; }
  return `${nav('')}<main class="wrap"><div class="ok"><span class="prop">Pantalla propuesta · por aprobar</span><span class="ic">${ic('circle-check')}</span><h1>Tu cita está <b>confirmada</b>.</h1>
  <p class="lead">Te mandamos los detalles al ${S.datos.cel}. Un día antes te recordamos la cita.</p>
  <dl class="det"><div><dt>Médico</dt><dd>${m.n}</dd></div><div><dt>Cuándo</dt><dd>${fechaLarga(S.dia)}, ${S.hora}</dd></div><div><dt>Dónde</dt><dd>${c.lu} · ${c.dir}</dd></div><div><dt>Consulta</dt><dd>${peso(c.pr)} · pagas en el consultorio</dd></div></dl>
  <div class="acc"><a class="btn primario" href="#inicio">Volver al inicio</a>${c.tel?`<span class="spec">¿Necesitas cambiarla? Llama al <span class="nw">${c.tel}</span></span>`:''}</div></div></main>`;
};

// Capas
function capaBuscar(){
  const sug = [['search','<b>Dermatól</b>ogía · especialidad','Piel'],['scan-face','Manchas en la piel · lo que sientes','Piel'],['stethoscope','Dra. Mariana Soto · dermatóloga','soto']];
  $('#capa').innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="Buscar"><div class="tb"><button class="ib" data-cerrar aria-label="Volver">${ic('arrow-left')}</button><b>Buscar</b></div>
  <form data-form="buscar-cel" style="display:contents"><div class="fs"><label for="q1">Qué necesitas</label><input id="q1" value="${S.q}" autocomplete="off"></div><div class="fs"><label for="w1">Dónde</label><input id="w1" value="${S.donde}" autocomplete="off"><button type="button" class="ubi" data-ubi>${ic('locate-fixed')}Usar mi ubicación</button></div>
  <ul class="sug" aria-label="Sugerencias">${sug.map(s=>`<li><button type="button" data-sug="${s[2]}">${ic(s[0])}<span>${s[1]}</span></button></li>`).join('')}</ul><button class="btn oscuro" type="submit">Buscar</button></form></div>`;
  $('#q1').focus();
}
function capaFiltros(){
  const temp = {...S.f};
  const cuenta = () => { const g = S.f; S.f = temp; const n = resultados().length; S.f = g; return n; };
  const pintar = () => {
    $('#capa').innerHTML = `<div class="velo" data-velo><div class="hoja" role="dialog" aria-modal="true" aria-label="Filtros"><span class="asa" aria-hidden="true"></span><div class="t"><b>Filtros</b><button class="ib" data-cerrar aria-label="Cerrar">${ic('x')}</button></div>
    <fieldset><legend>Cómo agendar</legend><div class="row"><button type="button" class="chip" aria-pressed="${temp.manik}" data-t="manik">Agenda en Manik</button><button type="button" class="chip" aria-pressed="${temp.hoy}" data-t="hoy">Con lugar hoy</button></div></fieldset>
    <fieldset><legend>Precio de consulta</legend><div class="row">${[500,800,1200].map(p=>`<button type="button" class="chip" aria-pressed="${temp.precio===p}" data-t="p${p}">Hasta ${peso(p)}</button>`).join('')}</div></fieldset>
    <div class="pieh"><button type="button" class="btn texto" data-t="limpiar">Limpiar</button><button type="button" class="btn primario" data-aplicar>Ver ${cuenta()} especialista${cuenta()===1?'':'s'}</button></div></div></div>`;
  };
  pintar();
  $('#capa').onclick = e => {
    const t = e.target.closest('[data-t]'); if (t) { const k = t.dataset.t; if (k==='manik'||k==='hoy') temp[k] = !temp[k]; else if (k==='limpiar') { temp.manik=false; temp.hoy=false; temp.precio=0; } else { const p = +k.slice(1); temp.precio = temp.precio===p ? 0 : p; } pintar(); $(`[data-t="${k}"]`)?.focus(); return; }
    if (e.target.closest('[data-aplicar]')) { S.f = temp; cerrar(); render(); return; }
    if (e.target.closest('[data-cerrar]') || e.target.matches('[data-velo]')) cerrar();
  };
  $('[data-t="manik"]').focus();
}
let disparador = null;
function abrir(cual, desde){ disparador = desde; document.body.style.overflow = 'hidden'; cual === 'buscar' ? capaBuscar() : capaFiltros(); }
function cerrar(){ $('#capa').innerHTML = ''; $('#capa').onclick = null; document.body.style.overflow = ''; disparador?.focus?.(); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=>el.hidden = true, 2400); }

// Router
function render(){
  const h = (location.hash || '#inicio').slice(1);
  let html;
  if (h.startsWith('medico-')) html = V.medico(h.slice(7));
  else html = (V[h] || V.inicio)();
  if (html) $('#app').innerHTML = html;
}
addEventListener('hashchange', () => { render(); const d = location.hash === '#dudas' && $('#dudas'); d ? d.scrollIntoView() : scrollTo(0,0); $('#app').focus?.(); });
document.addEventListener('click', e => {
  const t = e.target;
  const ab = t.closest('[data-abrir]'); if (ab) { abrir(ab.dataset.abrir, ab); return; }
  const cat = t.closest('[data-cat]'); if (cat) { S.cat = cat.dataset.cat; S.f = {manik:false,hoy:false,precio:0}; cerrar(); location.hash === '#resultados' ? render() : (location.hash = 'resultados'); return; }
  const sug = t.closest('[data-sug]'); if (sug) { cerrar(); if (sug.dataset.sug === 'soto') location.hash = 'medico-soto'; else { S.cat = 'Piel'; location.hash = 'resultados'; } return; }
  if (t.closest('[data-cerrar]')) { cerrar(); return; }
  const tt = t.closest('[data-toast]'); if (tt) { toast(tt.dataset.toast); return; }
  if (t.closest('[data-hoy]')) { S.cat = 'Piel'; S.f = {manik:false,hoy:true,precio:0}; location.hash = 'resultados'; return; }
  if (t.closest('[data-ubi-ini]')) { S.donde = 'tu ubicación (ejemplo)'; render(); toast('Aquí el navegador pediría permiso de ubicación'); return; }
  if (t.closest('[data-ubi]')) { $('#w1').value = 'Cerca de ti (ejemplo)'; return; }
  const f = t.closest('[data-f]'); if (f) { const k = f.dataset.f; if (k==='p800') S.f.precio = S.f.precio===800?0:800; else S.f[k] = !S.f[k]; render(); return; }
  if (t.closest('[data-limpiar]')) { S.f = {manik:false,hoy:false,precio:0}; render(); return; }
  const ag = t.closest('[data-agendar]'); if (ag) { const [mid, cid] = ag.dataset.agendar.split('|'); if (S.med !== mid || S.cons !== cid) { S.dia = null; S.hora = null; } S.med = mid; S.cons = cid; location.hash = 'agendar'; return; }
  const co = t.closest('[data-cons]'); if (co) { S.cons = co.dataset.cons; S.dia = null; S.hora = null; S.verH = false; render(); $(`[data-cons="${S.cons}"]`)?.focus(); return; }
  const hr = t.closest('[data-hora]'); if (hr) { const [k, h] = hr.dataset.hora.split('|'); S.dia = +k; S.hora = h; location.hash = 'confirmar'; return; }
  const sc = t.closest('[data-sec]'); if (sc) { const el = document.getElementById(sc.dataset.sec); if (el) { el.scrollIntoView({block:'start'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } return; }
  if (t.closest('[data-verh]')) { S.verH = true; render(); return; }
  const di = t.closest('[data-dia]'); if (di && !di.disabled) { S.dia = +di.dataset.dia; S.hora = null; render(); $(`[data-dia="${S.dia}"]`)?.focus(); return; }
  const el = t.closest('[data-elige]'); if (el) { S.hora = el.dataset.elige; render(); $(`[data-elige="${S.hora}"]`)?.focus(); return; }
  const ir = t.closest('[data-ir]'); if (ir) { if (ir.getAttribute('aria-disabled') === 'true') { toast('Elige un horario primero'); return; } location.hash = ir.dataset.ir; return; }
  const cp = t.closest('[data-copiar]'); if (cp) { const n = cp.dataset.copiar; (navigator.clipboard?.writeText(n) || Promise.reject()).then(()=>toast('Número copiado'), ()=>toast('Copia el número: ' + n)); return; }
  if (t.closest('[data-confirmar]')) { confirmar(); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'orden') { S.orden = e.target.value; render(); $('#orden')?.focus(); } });
document.addEventListener('input', e => { if (['nombre','cel','motivo'].includes(e.target.id)) S.datos[e.target.id] = e.target.value; });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'buscar' || f === 'buscar-cel') { const q = (f==='buscar' ? $('#q') : $('#q1')).value.trim(); const w = (f==='buscar' ? $('#w') : $('#w1')).value.trim(); S.q = q || S.q; S.donde = w || S.donde; S.cat = /derma|piel|lunar|mancha|acn/i.test(q) || !q ? 'Piel' : q; cerrar(); location.hash === '#resultados' ? render() : (location.hash = 'resultados'); }
  if (f === 'confirmar') confirmar(); });
function confirmar(){
  const nombre = $('#nombre').value.trim(), cel = $('#cel').value.replace(/\D/g,'');
  S.datos = {nombre, cel: $('#cel').value};
  $('#cf-nombre').classList.toggle('err', !nombre); $('#cf-cel').classList.toggle('err', cel.length !== 10);
  if (!nombre) return $('#nombre').focus(); if (cel.length !== 10) return $('#cel').focus();
  S.datos.cel = cel.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3'); location.hash = 'confirmada';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#capa').innerHTML) cerrar(); });
render();
</script>
