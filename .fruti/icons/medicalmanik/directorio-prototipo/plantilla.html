<title>Directorio Manik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap">
<style>
/* Directorio Manik · prototipo. Celular primero (70 %); tema claro único, como el sistema. Tokens del sistema «Directorio Manik». */
:root{
  --bruma:#F5FAFB;--blanco:#FFFFFF;--lavado:#EEF3F5;--tinta:#14213D;--muted:#4A5674;--linea:#DCE4EA;--linea-control:#6B7590;
  --cian:#009BB0;--cian-ui:#00788A;--cian-ui-hover:#00606F;--luz-cian:#D3F0F4;--luz-calida:#FFEFD2;--estrella:#E3A21C;
  --exito:#15814B;--exito-suave:#E7F5EE;--on-exito-suave:#157B4A;--cat-cian:#E4F5F7;--cat-calida:#FFF4E0;--cat-azul:#EEF2F8;
  --texto-calido:#6B4A00;--icono-calido:#8A5A00;--foto-inicio:#CDEEF2;--foto-fin:#FBE7C9;--confianza-icono:#7FDCE6;--confianza-texto:#C7D2E4;--velo:rgba(20,33,61,.38);
  --display:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sombra-buscador:0 1px 2px rgba(20,33,61,.06),0 12px 32px rgba(20,33,61,.10);--sombra-hover:0 12px 30px rgba(20,33,61,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bruma);color:var(--tinta);font:17px/1.55 var(--sans)}
p{margin:0}h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--cian-ui);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}.inl{display:inline-block;padding-block:12px;font-weight:600;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso{background:var(--tinta);color:var(--confianza-texto);font-size:13px;line-height:18px;text-align:center;padding-block:6px}
.aviso b{color:var(--blanco);font-weight:600}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:999px;font:600 16px/20px var(--sans);border:0;cursor:pointer;padding:0 22px;min-height:48px;text-decoration:none}
.btn .ico{width:18px;height:18px}
.primario{background:var(--cian-ui);color:var(--blanco)}.primario:hover{background:var(--cian-ui-hover)}
.primario[aria-disabled="true"]{background:var(--lavado);color:var(--muted);cursor:not-allowed}
.secundario{background:var(--blanco);color:var(--cian-ui);border:1.5px solid var(--cian-ui)}.secundario:hover{background:var(--luz-cian)}
.oscuro{background:var(--tinta);color:var(--blanco)}.oscuro:hover{background:#000}
.texto{background:none;color:var(--tinta);padding:0 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--tinta)}.ib:hover{background:var(--lavado)}
.chip{font:500 15px var(--sans);color:var(--tinta);background:var(--blanco);border:1.5px solid var(--linea);border-radius:999px;min-height:42px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--linea-control)}.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--blanco)}
.chip .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--tinta);color:var(--blanco);font-size:13px;font-weight:700}

/* Encabezado */
.nav{display:flex;align-items:center;gap:20px;padding-block:14px}
.nav .logo img{height:28px;width:auto;display:block}
.nav ul{display:none;gap:6px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:500;padding:8px 14px;border-radius:999px}.nav ul a:hover{background:rgba(255,255,255,.7)}.nav ul a[aria-current]{background:var(--blanco)}
.nav .me{display:none;margin-left:auto;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:999px;background:var(--blanco)}
.nav .menu{margin-left:auto}
@media (min-width:1024px){.nav ul,.nav .me{display:flex}.nav .menu{display:none}}

/* Inicio */
.halo{background:radial-gradient(60% 70% at 8% 10%,var(--luz-cian) 0%,rgba(211,240,244,0) 70%),radial-gradient(50% 60% at 92% 30%,var(--luz-calida) 0%,rgba(255,239,210,0) 70%),linear-gradient(180deg,var(--bruma) 0%,var(--blanco) 100%)}
.hero{display:grid;gap:22px;padding-block:16px 44px}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--blanco);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:500}
.pill span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--luz-cian);color:var(--cian-ui)}.pill .ico{width:15px;height:15px}
.h1{font:300 clamp(40px,10vw,72px)/1.03 var(--display);letter-spacing:-.035em;max-width:14ch}.h1 b{font-weight:600}
.lead{font-size:18px;color:var(--muted);max-width:40ch}
.campo{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;text-align:left;background:var(--blanco);border:0;border-radius:999px;padding:10px 20px;min-height:64px;box-shadow:var(--sombra-buscador);cursor:pointer;color:var(--tinta);font:inherit}
.campo .ico{color:var(--cian-ui)}.campo b{display:block;font:600 17px/22px var(--sans)}.campo small{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.buscador{display:none;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;background:var(--blanco);border-radius:999px;padding:8px;box-shadow:var(--sombra-buscador);max-width:680px}
.buscador .f{display:flex;align-items:center;gap:10px;padding:6px 16px;min-width:0}.buscador .f+.f{border-left:1px solid var(--linea)}.buscador .f .ico{color:var(--cian-ui)}.buscador .f div{display:grid;min-width:0}
.buscador label{font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}.buscador input{border:0;outline:0;font:500 17px var(--sans);color:var(--tinta);background:none;padding:0;min-width:0;min-height:30px;width:100%}
.buscador:focus-within{outline:3px solid var(--cian-ui);outline-offset:3px}.buscador .btn{min-height:54px;padding:0 26px}
@media (min-width:1024px){.campo{display:none}.buscador{display:grid}.hero{padding-block:40px 64px}}
.atajos{display:flex;flex-wrap:wrap;gap:8px}
.atajos button{display:inline-flex;align-items:center;gap:8px;color:var(--tinta);background:rgba(255,255,255,.85);border:1px solid var(--linea);border-radius:999px;padding:0 14px 0 10px;min-height:40px;font:500 15px var(--sans);cursor:pointer}
.atajos .ico{width:18px;height:18px;color:var(--cian-ui)}.atajos button:hover{background:var(--blanco);border-color:var(--linea-control)}
.sec{display:grid;gap:20px;padding-block:36px}
.h2{font:400 clamp(28px,6vw,40px)/1.08 var(--display);letter-spacing:-.03em}.h2 b{font-weight:600}
.sub{color:var(--muted);max-width:52ch}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:1024px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cat{display:grid;gap:22px;align-content:space-between;text-align:left;color:var(--tinta);border:0;border-radius:24px;padding:16px;min-height:150px;cursor:pointer;font:inherit;transition:transform .2s ease}
.cat:nth-child(3n+1){background:var(--cat-cian)}.cat:nth-child(3n+2){background:var(--cat-calida)}.cat:nth-child(3n){background:var(--cat-azul)}.cat:hover{transform:translateY(-3px)}
.cat .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--blanco);color:var(--cian-ui)}.cat .ic .ico{width:22px;height:22px}
.cat b{font:600 19px/1.15 var(--display);display:block}.cat small{color:var(--muted);font-size:14px;line-height:20px}
.trust{display:grid;gap:18px;background:var(--tinta);color:var(--blanco);border-radius:28px;padding:26px}
@media (min-width:768px){.trust{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trust div{display:grid;gap:8px;align-content:start}.trust .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);color:var(--confianza-icono)}
.trust b{font:600 20px/26px var(--display)}.trust p{color:var(--confianza-texto);font-size:15px;line-height:22px}
.pie{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding-block:32px 48px;color:var(--muted);font-size:15px}.pie img{height:22px;width:auto;display:block}

/* Promociones de Impulsa (promocion/r02, aprobado 2026-11-04) */
.promo{grid-column:1/-1;display:grid;background:var(--blanco);border:1.5px dashed var(--linea-control);border-radius:24px;overflow:hidden;text-decoration:none;color:var(--tinta)}
.promo:hover{box-shadow:var(--sombra-hover)}.promo:focus-visible{outline:3px solid var(--cian-ui);outline-offset:2px}
.promo .pimg{width:100%;aspect-ratio:357/104;object-fit:cover;display:block;background:var(--lavado)}
.promo .ptx{display:grid;gap:4px;padding:12px 16px 14px}.promo .ptx b{font:600 18px/1.25 var(--display)}.promo .ptx small{color:var(--muted);font-size:14px}
@media (min-width:640px){.promo{grid-template-columns:minmax(0,357px) minmax(0,1fr);align-items:center}}
.etq{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--texto-calido);background:var(--luz-calida);border-radius:999px;padding:3px 10px}
.pp{display:grid;gap:20px;padding-block:8px 56px}@media (min-width:1024px){.pp{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}}
.pp .ban{width:100%;aspect-ratio:256/143;object-fit:cover;border-radius:24px;display:block;background:var(--lavado)}
.pp h1{font:600 clamp(26px,6vw,34px)/1.1 var(--display);letter-spacing:-.02em}.pp .info{display:grid;gap:14px;min-width:0}
.anun{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:20px;padding:12px;text-decoration:none;color:var(--tinta)}.anun .face{grid-row:1/4;border-radius:12px}.anun b{font:600 17px/1.2 var(--display)}.anun small{color:var(--muted);font-size:14px}
.legal{font-size:13px;color:var(--muted);border-top:1px solid var(--linea);padding-top:10px}
.impulsa{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted)}.impulsa img{width:32px;height:32px;display:block}.impulsa b{color:var(--tinta);font-weight:600}.impulsa .btn{grid-column:2;justify-self:start;min-height:36px;font-size:15px}
.aplicada{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--luz-calida);border-radius:16px;padding:10px 14px;font-size:15px}.aplicada b{font-weight:600}

/* Sellos de categoría (categorias/r02, aprobado 2026-11-04) */
.sellos{container:sellos/inline-size}.scats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;--s:88px}
@container sellos (min-width:560px){.scats{--s:112px;gap:12px}}@container sellos (min-width:900px){.scats{grid-template-columns:repeat(6,minmax(0,1fr));--s:132px}}
.scat{display:grid;justify-items:center;align-content:start;gap:4px;background:none;border:0;color:var(--tinta);padding:6px 2px 10px;border-radius:20px;text-align:center;cursor:pointer;font:inherit}
.scat:nth-child(3n+1){--sf:var(--cat-cian);--sc:var(--cian-ui)}.scat:nth-child(3n+2){--sf:var(--cat-calida);--sc:var(--icono-calido)}.scat:nth-child(3n){--sf:var(--cat-azul);--sc:var(--tinta)}
.sello{width:min(100%,var(--s));height:auto;margin-bottom:6px;color:var(--sc);transition:transform .35s ease}.scat:hover .sello{transform:rotate(-8deg)}
.sello .fo{fill:var(--sf)}.sello .tr{fill:none;stroke:var(--sc)}.sello .bl{fill:var(--blanco)}.sello .ley{fill:var(--sc);font-family:var(--sans)}
.g-comp{display:none}@container sellos (max-width:559px){.g-ley{display:none}.g-comp{display:inline}}
.scat b{font:600 15px/1.15 var(--display);display:block}.scat small{display:block;color:var(--muted);font-size:12px;line-height:16px}
@container sellos (min-width:560px){.scat b{font-size:17px}.scat small{font-size:13px;line-height:18px}}
@media (prefers-reduced-motion:reduce){.scat:hover .sello{transform:none}}

/* Inicio r03 (aprobado 2026-11-04) */
.hero{grid-template-columns:minmax(0,1fr)}.htxt{display:grid;gap:20px;align-content:center;min-width:0}
.donde{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:15px;line-height:22px;color:var(--muted)}.donde .ico{width:16px;height:16px;color:var(--cian-ui)}.donde>span{display:inline-flex;align-items:center;gap:6px}.donde b{color:var(--tinta);font-weight:600}
.foto{display:none;aspect-ratio:4/5;border-radius:32px;background:linear-gradient(160deg,var(--foto-inicio),var(--foto-fin));align-items:end;padding:16px;font-size:13px;color:var(--muted)}
@media (min-width:640px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px;align-items:center}.foto{display:flex}}
.lnk{justify-self:start;font-weight:600;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;font-size:16px;font-family:var(--sans);cursor:pointer}
.hoy{display:grid;gap:12px}@media (min-width:640px){.hoy{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (min-width:1024px){.hoy{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mf{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mf .face{grid-row:1/4;align-self:start;border-radius:14px}.mf b{font:600 18px/22px var(--display)}.mf b a{text-decoration:none;display:inline-block;padding-block:3px}.mf b a:hover{text-decoration:underline}.mf small{font-size:14px;line-height:20px;color:var(--muted)}.mf .ced{grid-column:2}.mf .btn{grid-row:1/4;grid-column:3;min-height:44px;padding:0 18px}
.dud{display:grid;gap:12px}@media (min-width:640px){.dud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dud h3{grid-column:1/-1;font:600 15px/20px var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:4px}
.dud .acc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.q{display:grid;gap:6px;text-align:left;background:var(--blanco);border:1px solid var(--linea);border-radius:22px;padding:16px;font:inherit;color:var(--tinta);cursor:pointer;width:100%}
.q:hover{box-shadow:var(--sombra-hover)}.q b{font:600 18px/24px var(--display)}.q small{font-size:14px;line-height:20px;color:var(--muted)}
.q.art{grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;column-gap:14px}.q.art .th{grid-row:1/3;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:grid;place-items:center;background:var(--cat-cian);color:var(--cian-ui)}
@media (min-width:1024px){.q.art{grid-template-columns:160px minmax(0,1fr);column-gap:18px;align-content:start}.q.art .th{aspect-ratio:4/3}}.q.art:nth-of-type(even) .th{background:var(--cat-calida)}
.pasos{display:grid;gap:16px;counter-reset:p;list-style:none;margin:0;padding:0}@media (min-width:768px){.pasos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pasos li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}.pasos li::before{counter-increment:p;content:counter(p);width:44px;height:44px;border-radius:50%;background:var(--luz-cian);color:var(--cian-ui);display:grid;place-items:center;font:600 18px var(--display)}
.pasos b{display:block;font:600 19px/24px var(--display)}.pasos span span{color:var(--muted);font-size:15px;line-height:22px}
.soymed{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:20px}
.soymed b{font:600 20px/26px var(--display);display:block}.soymed p{color:var(--muted);font-size:15px}

/* Resultados */
.rh{display:grid;gap:4px;padding-block:8px 12px}
.rh .h2 small{display:block;font:400 15px/22px var(--sans);color:var(--muted);letter-spacing:0;margin-top:4px}
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bruma);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px 12px;border-bottom:1px solid var(--linea)}
.barra .sel{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.barra select{font:500 15px var(--sans);color:var(--tinta);border:1.5px solid var(--linea);border-radius:999px;min-height:42px;padding:0 14px;background:var(--blanco)}
.barra .solo-esc{display:none}@media (min-width:1024px){.barra .solo-esc{display:contents}.barra .solo-cel{display:none}}
.lista{display:grid;gap:12px;padding-block:16px 40px;align-items:start;container-type:inline-size}
@media (min-width:640px){.lista{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lista>.ad,.lista>.vacio{grid-column:1/-1}
.fm{container-type:inline-size;min-width:0}
.fmi{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:14px;display:grid;gap:12px;grid-template-columns:72px minmax(0,1fr);align-items:start;transition:box-shadow .2s ease}
.fmi:hover{box-shadow:var(--sombra-hover)}
.face{border-radius:16px;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(160deg,var(--foto-inicio),var(--foto-fin));max-width:100%}.face img{width:100%;height:100%;display:block;object-fit:cover}
.who{display:grid;gap:4px;min-width:0}.fmi h3{font:600 20px/24px var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}.fmi h3 a{text-decoration:none}.fmi h3 a:hover{text-decoration:underline}
.spec{color:var(--muted);font-size:15px;line-height:22px}
.meta{display:flex;flex-wrap:wrap;gap:6px}.meta span{display:inline-flex;align-items:center;gap:5px;font-size:14px;line-height:20px;background:var(--bruma);border-radius:999px;padding:4px 10px}.meta .ico{width:15px;height:15px}
.meta .v{color:var(--on-exito-suave);font-weight:600;background:var(--exito-suave)}
.ced{margin:0;display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}.ced .ico{flex:none;width:16px;height:16px;margin-top:1px;color:var(--on-exito-suave)}.ced abbr{text-decoration:none}.meta .st b{color:var(--estrella);font-weight:400}
.cons{grid-column:1/-1;display:grid;border:1px solid var(--linea);border-radius:18px;min-width:0}
.co{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px}.co+.co{border-top:1px solid var(--linea)}
.co .l1{font-size:15px;line-height:22px;font-weight:600}.co .l1 b{font:600 17px/22px var(--display)}
.co .l2{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;font-size:14px;line-height:20px;color:var(--muted)}.co .l2 .ico{width:16px;height:16px;color:var(--cian-ui)}
.co .btn{grid-column:2;grid-row:1/3;min-height:44px;min-width:92px;padding:0 16px}
.co .alt{grid-column:1;display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:14px;font-weight:600;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;justify-self:start;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}.co .alt .ico{width:16px;height:16px}

  if (t.closest('[data-hoy]')) { S.cat = 'Piel'; S.f = {manik:false,hoy:true,precio:0}; location.hash = 'resultados'; return; }

  if (t.closest('[data-ubi]')) { $('#w1').value = 'Cerca de ti (ejemplo)'; return; }
  const f = t.closest('[data-f]'); if (f) { const k = f.dataset.f; if (k==='p800') S.f.precio = S.f.precio===800?0:800; else S.f[k] = !S.f[k]; render(); return; }
  if (t.closest('[data-limpiar]')) { S.f = {manik:false,hoy:false,precio:0}; render(); return; }
  const pa = t.closest('[data-promo-agendar]'); if (pa) { const p = PROMOS.find(x=>x.id===pa.dataset.promoAgendar); S.promo = p.id; S.med = p.med; S.cons = p.cons; S.dia = null; S.hora = null; S.verH = false; S.irAgenda = true; location.hash = 'medico-' + p.med; return; }
  const ag = t.closest('[data-agendar]'); if (ag) { const [mid, cid] = ag.dataset.agendar.split('|'); S.med = mid; S.cons = cid; S.dia = null; S.hora = null; S.verH = false; S.irAgenda = true; location.hash = 'medico-' + mid; return; }
  const co = t.closest('[data-cons]'); if (co) { S.cons = co.dataset.cons; S.dia = null; S.hora = null; S.verH = false; render(); $(`[data-cons="${S.cons}"]`)?.focus(); return; }
  const hr = t.closest('[data-hora]'); if (hr) { const [k, h] = hr.dataset.hora.split('|'); S.dia = +k; S.hora = h; S.ocupado = false; location.hash = 'confirmar'; return; }
  const sc = t.closest('[data-sec]'); if (sc) { const el = document.getElementById(sc.dataset.sec); if (el) { el.scrollIntoView({block:'start'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } return; }
  if (t.closest('[data-verh]')) { S.verH = true; render(); return; }
  const di = t.closest('[data-dia]'); if (di && !di.disabled) { S.dia = +di.dataset.dia; S.hora = null; render(); $(`[data-dia="${S.dia}"]`)?.focus(); return; }
  const ir = t.closest('[data-ir]'); if (ir) { if (ir.getAttribute('aria-disabled') === 'true') { toast('Elige un horario primero'); return; } location.hash = ir.dataset.ir; return; }
  const cp = t.closest('[data-copiar]'); if (cp) { const n = cp.dataset.copiar; (navigator.clipboard?.writeText(n) || Promise.reject()).then(()=>toast('Número copiado'), ()=>toast('Copia el número: ' + n)); return; }
  const cf = t.closest('[data-confirmar]'); if (cf) { if (cf.getAttribute('aria-disabled') === 'true') { toast('Elige otro horario primero'); $('#ocupado')?.focus(); return; } confirmar(); return; }
  const alt = t.closest('[data-alt]'); if (alt) { S.datos.nombre = $('#nombre')?.value || S.datos.nombre; S.datos.cel = $('#cel')?.value || S.datos.cel; const [k, h] = alt.dataset.alt.split('|'); S.dia = +k; S.hora = h; S.ocupado = false; render(); toast('Horario cambiado a ' + nombreDia(S.dia) + ', ' + h); $('[data-confirmar]')?.focus(); return; }
  if (t.closest('[data-ics]')) { toast('En el producto se descarga el archivo .ics para Apple u Outlook; este visor de prototipos no permite descargarlo'); return; }
});
document.addEventListener('change', e => { if (e.target.id === 'orden') { S.orden = e.target.value; render(); $('#orden')?.focus(); } });
document.addEventListener('input', e => { if (['nombre','cel','motivo'].includes(e.target.id)) S.datos[e.target.id] = e.target.value; });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'buscar' || f === 'buscar-cel') { const q = (f==='buscar' ? $('#q') : $('#q1')).value.trim(); const w = (f==='buscar' ? $('#w') : $('#w1')).value.trim(); S.q = q || S.q; S.donde = w || S.donde; S.cat = /derma|piel|lunar|mancha|acn/i.test(q) || !q ? 'Piel' : q; cerrar(); location.hash === '#resultados' ? render() : (location.hash = 'resultados'); }
  if (f === 'confirmar') confirmar();
  if (f === 'enlace') toast('Si hay una cita con ese celular, te llegará un enlace nuevo'); });
// Simulación: horarios que «otra persona» toma justo antes (para ver el aviso)
const OCUPA = new Set(['soto|angelopolis|0|17:00','diaz|neodemo|0|17:30']);
function cercanas(c){ const out = []; Object.keys(c.ag||{}).map(Number).sort((a,b)=>a-b).forEach(k => c.ag[k].forEach(h => { if (out.length < 3 && (k > S.dia || (k === S.dia && h !== S.hora))) out.push([k,h]); })); return out; }
function gcal(m, c, ci){ const D = ci ? ci.dia : S.dia, Hh = ci ? ci.hora : S.hora; const d = dia(D), [hh, mm] = Hh.split(':').map(Number), f = x=>String(x).padStart(2,'0');
  const fecha = `${d.getFullYear()}${f(d.getMonth()+1)}${f(d.getDate())}`, q = new URLSearchParams({action:'TEMPLATE', text:`Cita con ${m.n}`, dates:`${fecha}T${f(hh)}${f(mm)}00/${fecha}T${f(hh+1)}${f(mm)}00`, ctz:'America/Mexico_City', location:`${c.lu}, ${c.dir}`, details:`Consulta ${peso(c.pr)}, pagas en el consultorio.`});
  return 'https://calendar.google.com/calendar/render?' + q.toString(); }
function reservar(mid, cid, k, h){ const c = MED.find(x=>x.id===mid).cons.find(x=>x.id===cid); if (!c.ag || !c.ag[k]) return; c.ag[k] = c.ag[k].filter(x=>x!==h); if (!c.ag[k].length) delete c.ag[k]; }
function liberar(mid, cid, k, h){ const c = MED.find(x=>x.id===mid).cons.find(x=>x.id===cid); c.ag = c.ag || {}; const l = c.ag[k] || []; if (!l.includes(h)) l.push(h); l.sort((a,b)=>{const t=x=>{const [H,M]=x.split(':').map(Number);return H*60+M}; return t(a)-t(b)}); c.ag[k] = l; }
const corto = m => { const t = m.n.split(' '); return /^Dra?\.$/.test(t[0]) ? t[0] + ' ' + (t[2] || t[1]) : t.slice(0,2).join(' '); };
const inicioCita = ci => { const d = dia(ci.dia), [H,M] = ci.hora.split(':').map(Number); d.setHours(H, M, 0, 0); return d; };
function confirmar(){
  if (S.ocupado) { toast('Elige otro horario primero'); $('#ocupado')?.focus(); return; }
  const nombre = $('#nombre').value.trim(), cel = $('#cel').value.replace(/\D/g,'');
  S.datos = {nombre, cel: $('#cel').value};
  $('#cf-nombre').classList.toggle('err', !nombre); $('#cf-cel').classList.toggle('err', cel.length !== 10);
  if (!nombre) return $('#nombre').focus(); if (cel.length !== 10) return $('#cel').focus();
  S.datos.cel = cel.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3');
  const key = `${S.med}|${S.cons}|${S.dia}|${S.hora}`;
  if (OCUPA.has(key)) { OCUPA.delete(key); const c = MED.find(x=>x.id===S.med).cons.find(x=>x.id===S.cons); c.ag[S.dia] = c.ag[S.dia].filter(h=>h!==S.hora); if (!c.ag[S.dia].length) delete c.ag[S.dia]; S.ocupado = true; render(); $('#ocupado')?.focus(); return; }
  S.ocupado = false; reservar(S.med, S.cons, S.dia, S.hora);
  S.cita = {med:S.med, cons:S.cons, dia:S.dia, hora:S.hora, nombre:S.datos.nombre, cel:S.datos.cel, estado:'activa', promo:S.promo}; S.demo = null; location.hash = 'confirmada';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#capa').innerHTML) cerrar(); });
render();
