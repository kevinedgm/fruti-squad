<title>Mi Médico Manik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Onest:wght@400..700&display=swap">
<style>
/* Directorio Manik · prototipo. Celular primero (70 %); tema claro único, como el sistema. Tokens del sistema «Directorio Manik». */
:root{
  /* Paleta «Mi Médico Manik» (2026-11-10). Nombres y valores del design system de origen. */
  --bruma:#F5FAFB;--blanco:#FFFFFF;--tinta:#14213D;--muted:#4A5674;--linea:#DCE4EA;--linea-control:#6B7590;
  --teal:#0A7F8F;--teal-hover:#08707F;--teal-presionado:#054E59;--pleca:#009499;--turquesa:#3ECEDD;--resaltador:#95E4EC;
  --menta-hielo:#D8F0F4;--turquesa-suave:#BFEBF1;--hero-inicio:#E3F5F8;--avatar-inicio:#9FE3EC;--luz-calida:#F5C9A6;
  --exito-suave:#E7F5EE;--exito:#157B4A;--exito-oscuro:#0E6338;--error-suave:#FDECEA;--error:var(--error);
  --no-disponible:#D9E3E7;--no-disponible-texto:#3F565E;--estrella:#F5B301;
  --lila-impulsa:#B9A8FF;--lila-suave:#EFEAFF;--violeta-impulsa:#504CA1;
  /* Locales sin equivalente en el sistema de origen (pendientes): texto claro sobre tinta y rojo presionado. */
  --confianza-texto:#C7D2E4;--error-presionado:#8A1C12;--velo:rgba(20,33,61,.38);
  --display:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sombra-buscador:0 1px 2px rgba(20,33,61,.06),0 12px 32px rgba(20,33,61,.10);--sombra-hover:0 12px 30px rgba(20,33,61,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bruma);color:var(--tinta);font:17px/1.55 var(--sans)}
p{margin:0}h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nw{white-space:nowrap}.inl{display:inline-block;padding-block:12px;font-weight:600;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso{background:var(--tinta);color:var(--confianza-texto);font-size:13px;line-height:18px;text-align:center;padding-block:6px}
.aviso b{color:var(--blanco);font-weight:600}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:12px;font:600 16px/20px var(--sans);border:0;cursor:pointer;padding:0 22px;min-height:48px;text-decoration:none}
.btn .ico{width:18px;height:18px}
.primario{background:var(--teal);color:var(--blanco)}.primario:hover{background:var(--teal-hover)}.primario:active{background:var(--teal-presionado)}
.primario[aria-disabled="true"]{background:var(--no-disponible);color:var(--no-disponible-texto);cursor:not-allowed}
.secundario{background:var(--blanco);color:var(--teal);border:1.5px solid var(--teal)}.secundario:hover{background:var(--menta-hielo)}
.oscuro{background:var(--tinta);color:var(--blanco)}.oscuro:hover{background:#000}
.texto{background:none;color:var(--tinta);padding:0 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--tinta)}.ib:hover{background:var(--menta-hielo)}
.chip{font:500 15px var(--sans);color:var(--tinta);background:var(--blanco);border:1.5px solid var(--linea);border-radius:999px;min-height:42px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--linea-control)}.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--blanco)}
.chip .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--tinta);color:var(--blanco);font-size:13px;font-weight:700}

/* Encabezado */
.nav{display:flex;align-items:center;gap:20px;padding-block:14px}
.nav .logo img{height:40px;width:auto;display:block}
.nav ul{display:none;gap:6px;list-style:none;margin:0;padding:0}
.nav ul a{display:block;text-decoration:none;font-weight:500;padding:8px 14px;border-radius:10px}.nav ul a:hover{background:rgba(255,255,255,.7)}.nav ul a[aria-current]{background:var(--blanco)}
.nav .me{display:none;margin-left:auto;text-decoration:none;font:600 17px var(--sans);color:var(--tinta);border:0;cursor:pointer;min-height:44px;align-items:center;padding:10px 18px;border-radius:12px;background:var(--blanco)}
.nav .menu{margin-left:auto}
@media (min-width:1024px){.nav ul,.nav .me{display:flex}.nav .menu{display:none}}

/* Inicio */
.halo{background:radial-gradient(60% 70% at 8% 10%,rgba(62,206,221,.36) 0%,rgba(62,206,221,0) 70%),radial-gradient(50% 60% at 92% 30%,var(--luz-calida) 0%,rgba(245,201,166,0) 70%),linear-gradient(180deg,var(--hero-inicio) 0%,var(--bruma) 100%)}
.hero{display:grid;gap:22px;padding-block:16px 44px}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--blanco);border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:500}
.pill span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--menta-hielo);color:var(--teal-hover)}.pill .ico{width:15px;height:15px}
.h1{font:300 clamp(40px,10vw,72px)/1.03 var(--display);letter-spacing:-.035em;max-width:14ch}.h1 b{font-weight:600}
.lead{font-size:18px;color:var(--muted);max-width:40ch}
.campo{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;text-align:left;background:var(--blanco);border:0;border-radius:12px;padding:10px 20px;min-height:64px;box-shadow:var(--sombra-buscador);cursor:pointer;color:var(--tinta);font:inherit}
.campo .ico{color:var(--teal-hover)}.campo b{display:block;font:600 17px/22px var(--sans)}.campo small{display:block;font-size:14px;line-height:20px;color:var(--muted)}
.buscador{display:none;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:center;background:var(--blanco);border-radius:16px;padding:8px;box-shadow:var(--sombra-buscador);max-width:680px}
.buscador .f{display:flex;align-items:center;gap:10px;padding:6px 16px;min-width:0}.buscador .f+.f{border-left:1px solid var(--linea)}.buscador .f .ico{color:var(--teal-hover)}.buscador .f div{display:grid;min-width:0}
.buscador label{font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}.buscador input{border:0;outline:0;font:500 17px var(--sans);color:var(--tinta);background:none;padding:0;min-width:0;min-height:30px;width:100%}
.buscador:focus-within{outline:3px solid var(--teal);outline-offset:3px}.buscador .btn{min-height:54px;padding:0 26px}
@media (min-width:1024px){.campo{display:none}.buscador{display:grid}.hero{padding-block:40px 64px}}
.atajos{display:flex;flex-wrap:wrap;gap:8px}
.atajos button{display:inline-flex;align-items:center;gap:8px;color:var(--tinta);background:rgba(255,255,255,.85);border:1px solid var(--linea);border-radius:999px;padding:0 14px 0 10px;min-height:40px;font:500 15px var(--sans);cursor:pointer}
.atajos .ico{width:18px;height:18px;color:var(--teal-hover)}.atajos button:hover{background:var(--blanco);border-color:var(--linea-control)}
.sec{display:grid;gap:20px;padding-block:36px}
.h2{font:400 clamp(28px,6vw,40px)/1.08 var(--display);letter-spacing:-.03em}.h2 b{font-weight:600}
.sub{color:var(--muted);max-width:52ch}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (min-width:1024px){.cats{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cat{display:grid;gap:22px;align-content:space-between;text-align:left;color:var(--tinta);border:0;border-radius:24px;padding:16px;min-height:150px;cursor:pointer;font:inherit;transition:transform .2s ease}
.cat:nth-child(3n+1){background:var(--menta-hielo)}.cat:nth-child(3n+2){background:var(--luz-calida)}.cat:nth-child(3n){background:var(--turquesa-suave)}.cat:hover{transform:translateY(-3px)}
.cat .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--blanco);color:var(--teal-hover)}.cat .ic .ico{width:22px;height:22px}
.cat b{font:600 19px/1.15 var(--display);display:block}.cat small{color:var(--muted);font-size:14px;line-height:20px}
.trust{display:grid;gap:18px;background:var(--tinta);color:var(--blanco);border-radius:28px;padding:26px}
@media (min-width:768px){.trust{grid-template-columns:repeat(3,minmax(0,1fr))}}
.trust div{display:grid;gap:8px;align-content:start}.trust .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);color:var(--turquesa)}
.trust b{font:600 20px/26px var(--display)}.trust p{color:var(--confianza-texto);font-size:15px;line-height:22px}
.pie2{margin-top:24px;background:var(--blanco);border-top:1px solid var(--linea)}
.pie2-a{display:grid;gap:24px;padding-block:32px}@media (min-width:640px){.pie2-a{grid-template-columns:repeat(3,minmax(0,1fr))}.pie2-m{grid-column:1/-1}}@media (min-width:1024px){.pie2-a{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr))}.pie2-m{grid-column:auto}}
.pie2-m{display:grid;gap:10px;align-content:start}.pie2-m img{height:40px;width:auto}.pie2-m p{color:var(--muted);font-size:15px;max-width:36ch}.pie2-m small{color:var(--muted);font-size:13px}
.pie2-c h2{font:600 16px/22px var(--display);margin-bottom:6px}.pie2-c ul{list-style:none;margin:0;padding:0}
.pl{display:inline-flex;align-items:center;min-height:40px;background:none;border:0;padding:0;font:15px var(--sans);color:var(--tinta);text-align:left;cursor:pointer;text-decoration:none}.pl:hover{text-decoration:underline;text-underline-offset:3px}
.pie2-b{background:var(--teal);color:var(--blanco);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}.pie2-b .pl{color:var(--blanco);font-size:14px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.pie2-aviso{font-size:14px;line-height:20px;padding-bottom:6px}.pie2-l{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center;font-size:14px}.pie2-r{display:flex;gap:0 14px;flex-wrap:wrap}@media (min-width:1024px){.pie2-r{margin-left:auto}}
@media (max-width:1023px){.pie2:has(+ .barra-acc) .pie2-b{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.pie{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding-block:32px 48px;color:var(--muted);font-size:15px}.pie img{height:32px;width:auto;display:block}

/* Promociones de Impulsa (promocion/r02, aprobado 2026-11-04) */
.promo{grid-column:1/-1;display:grid;background:var(--blanco);border:1.5px dashed var(--linea-control);border-radius:24px;overflow:hidden;text-decoration:none;color:var(--tinta)}
.promo:hover{box-shadow:var(--sombra-hover)}.promo:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.promo .pimg{width:100%;aspect-ratio:357/104;object-fit:cover;display:block;background:var(--lila-suave)}
.promo .ptx{display:grid;gap:4px;padding:12px 16px 14px}.promo .ptx b{font:600 18px/1.25 var(--display)}.promo .ptx small{color:var(--muted);font-size:14px}
@media (min-width:640px){.promo{grid-template-columns:minmax(0,357px) minmax(0,1fr);align-items:center}}
.etq{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta);background:var(--lila-impulsa);border-radius:999px;padding:3px 10px}
.pp{display:grid;gap:20px;padding-block:8px 56px}@media (min-width:1024px){.pp{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}}
.pp .ban{width:100%;aspect-ratio:256/143;object-fit:cover;border-radius:24px;display:block;background:var(--lila-suave)}
.pp h1{font:600 clamp(26px,6vw,34px)/1.1 var(--display);letter-spacing:-.02em}.pp .info{display:grid;gap:14px;min-width:0}
.anun{display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:20px;padding:12px;text-decoration:none;color:var(--tinta)}.anun .face{grid-row:1/4;border-radius:12px}.anun b{font:600 17px/1.2 var(--display)}.anun small{color:var(--muted);font-size:14px}
.legal{font-size:13px;color:var(--muted);border-top:1px solid var(--linea);padding-top:10px}
.impulsa{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--muted)}.impulsa img{width:32px;height:32px;display:block}.impulsa b{color:var(--violeta-impulsa);font-weight:600}.imp{color:var(--violeta-impulsa);font-weight:600}.impulsa .btn{grid-column:2;justify-self:start;min-height:36px;font-size:15px}
.aplicada{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--lila-suave);border-radius:16px;padding:10px 14px;font-size:15px}.aplicada b{font-weight:600}

/* Sellos de categoría (categorias/r02, aprobado 2026-11-04) */
.sellos{container:sellos/inline-size}.scats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;--s:88px}
@container sellos (min-width:560px){.scats{--s:112px;gap:12px}}@container sellos (min-width:900px){.scats{grid-template-columns:repeat(6,minmax(0,1fr));--s:132px}}
.scat{display:grid;justify-items:center;align-content:start;gap:4px;background:none;border:0;color:var(--tinta);padding:6px 2px 10px;border-radius:20px;text-align:center;cursor:pointer;font:inherit}
.scat:nth-child(3n+1){--sf:var(--menta-hielo);--sc:var(--teal-hover)}.scat:nth-child(3n+2){--sf:var(--luz-calida);--sc:var(--tinta)}.scat:nth-child(3n){--sf:var(--turquesa-suave);--sc:var(--teal-hover)}
.sello{width:min(100%,var(--s));height:auto;margin-bottom:6px;color:var(--sc);transition:transform .35s ease}.scat:hover .sello{transform:rotate(-8deg)}
.sello .fo{fill:var(--sf)}.sello .tr{fill:none;stroke:var(--sc)}.sello .bl{fill:var(--blanco)}.sello .ley{fill:var(--tinta);font-family:var(--sans)}
.g-comp{display:none}@container sellos (max-width:559px){.g-ley{display:none}.g-comp{display:inline}}
.scat b{font:600 15px/1.15 var(--display);display:block}.scat small{display:block;color:var(--muted);font-size:12px;line-height:16px}
@container sellos (min-width:560px){.scat b{font-size:17px}.scat small{font-size:13px;line-height:18px}}
@media (prefers-reduced-motion:reduce){.scat:hover .sello{transform:none}}

/* Inicio r03 (aprobado 2026-11-04) */
.hero{grid-template-columns:minmax(0,1fr)}.htxt{display:grid;gap:20px;align-content:center;min-width:0}
.donde{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font-size:15px;line-height:22px;color:var(--muted)}.donde .ico{width:16px;height:16px;color:var(--teal-hover)}.donde>span{display:inline-flex;align-items:center;gap:6px}.donde b{color:var(--tinta);font-weight:600}
.foto{display:none;position:relative;aspect-ratio:4/5;border-radius:32px;overflow:hidden;background:linear-gradient(160deg,var(--avatar-inicio),var(--luz-calida))}
.foto svg.esc{position:absolute;inset:0;width:100%;height:100%}
.foto .sim{position:absolute;top:14px;right:14px;font-size:12px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 10px}
.foto .flota{position:absolute;display:flex;align-items:center;gap:10px;background:var(--blanco);border-radius:18px;padding:10px 14px;box-shadow:0 12px 30px rgba(20,33,61,.14);font-size:14px;line-height:1.25}
.foto .flota b{display:block;font:600 15px/1.2 var(--display)}.foto .flota small{color:var(--muted);font-size:13px}
.foto .f1{left:6%;top:12%}.foto .f1 .face{width:36px;border-radius:10px}.foto .f2{left:6%;bottom:6%;display:none}@media (min-width:1024px){.foto .f2{display:flex}}.foto .f2 .ico{color:var(--teal-hover)}
.foto .f2 b{font-size:20px}
@media (min-width:640px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:32px;align-items:center}.foto{display:flex}}
.otra{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;color:var(--muted);font-size:16px}
.lnk{justify-self:start;font-weight:600;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;font-size:16px;font-family:var(--sans);cursor:pointer}
.hoy{display:grid;gap:12px}@media (min-width:640px){.hoy{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (min-width:1024px){.hoy{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mf{background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.mf .face{grid-row:1/4;align-self:start;border-radius:14px}.mf b{font:600 18px/22px var(--display)}.mf b a{text-decoration:none;display:inline-block;padding-block:3px}.mf b a:hover{text-decoration:underline}.mf small{font-size:14px;line-height:20px;color:var(--muted)}.mf small .est{font:400 14px/20px var(--sans);color:var(--estrella)}@media (min-width:1024px){.hoy.dest{grid-template-columns:repeat(2,minmax(0,1fr))}}.mf .ced{grid-column:2}.mf .btn{grid-row:1/4;grid-column:3;min-height:44px;padding:0 18px}
.dud{display:grid;gap:12px}@media (min-width:640px){.dud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dud h3{grid-column:1/-1;font:600 15px/20px var(--sans);color:var(--muted);letter-spacing:.02em;margin-top:4px}
.dud .acc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.q{display:grid;gap:6px;text-align:left;background:var(--blanco);border:1px solid var(--linea);border-radius:22px;padding:16px;font:inherit;color:var(--tinta);cursor:pointer;width:100%}
.q:hover{box-shadow:var(--sombra-hover)}.q b{font:600 18px/24px var(--display)}.q small{font-size:14px;line-height:20px;color:var(--muted)}
.q.art{grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;column-gap:14px}.q.art .th{grid-row:1/3;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:grid;place-items:center;background:var(--menta-hielo);color:var(--teal-hover)}
@media (min-width:1024px){.q.art{grid-template-columns:160px minmax(0,1fr);column-gap:18px;align-content:start}.q.art .th{aspect-ratio:4/3}}.q.art:nth-of-type(even) .th{background:var(--turquesa-suave)}
.pasos{display:grid;gap:16px;counter-reset:p;list-style:none;margin:0;padding:0}@media (min-width:768px){.pasos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pasos li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}.pasos li::before{counter-increment:p;content:counter(p);width:44px;height:44px;border-radius:50%;background:var(--menta-hielo);color:var(--teal-hover);display:grid;place-items:center;font:600 18px var(--display)}
.pasos b{display:block;font:600 19px/24px var(--display)}.pasos span span{color:var(--muted);font-size:15px;line-height:22px}
.soymed{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--blanco);border:1px solid var(--linea);border-radius:24px;padding:20px}
.soymed b{font:600 20px/26px var(--display);display:block}.soymed p{color:var(--muted);font-size:15px}

/* Resultados */

  if (m.gal || m.galN) sec.push(['galeria','Galería',`<h2 id="h-galeria">Galería</h2><ul class="gal" aria-label="Fotos del consultorio (de ejemplo)">${m.galN ? m.galN.map(x=>`<li><span>${x}</span></li>`).join('') : '<li></li>'.repeat(m.gal)}</ul>`]);
  if (m.faq && m.faq.length) sec.push(['dudas','Dudas frecuentes',`<h2 id="h-dudas">Dudas frecuentes</h2><p>Respuestas ${deArt(m)}${m.n.split(' ').slice(0,3).join(' ')} a lo que más le preguntan sus pacientes.</p><div class="faq">${m.faq.map((f,i)=>`<details${i===0?' open':''}><summary>${f[0]}</summary><div class="a">${f[1].map(x=>`<p>${x}</p>`).join('')}${m.faqNota === false ? '' : '<p class="nota">Estas respuestas orientan; no sustituyen una consulta.</p>'}</div></details>`).join('')}</div>`]);

  if (m.r && m.ops && m.ops.length) sec.push(['opiniones','Opiniones',`<h2 id="h-opiniones">Opiniones</h2><div class="op-res"><span class="n">${m.r}</span><span><span class="st" aria-hidden="true">★★★★★</span><small>${m.op.toLocaleString('es-MX')} opiniones verificadas</small></span></div>${m.crit ? `<dl class="crit">${m.crit.map(k=>`<div><dt>${k[0]}</dt><dd><span class="barra-c" aria-hidden="true"><i style="width:${k[1]*20}%"></i></span>${k[1]} de 5 · ${k[2]}</dd></div>`).join('')}</dl>` : ''}<p class="fuente">Solo opinan pacientes que tuvieron cita. El médico no puede borrarlas.</p><div class="ops">${m.ops.map(o=>`<article class="op"><div class="h"><span class="ini" aria-hidden="true">${o[0]}</span><b>${o[1]}</b><small>${o[2]}</small></div><p>${o[3]}</p><span class="ver">${ic('badge-check')}Opinión verificada</span></article>`).join('')}</div><button class="btn texto" style="justify-self:start" data-toast="La lista completa de opiniones aún no está en el prototipo">Ver las ${m.op.toLocaleString('es-MX')} opiniones</button>${m.colegas ? `<h3 class="sub-h">Lo que dicen sus colegas</h3><p class="fuente">Recomendaciones de médicos con cédula verificada. Van aparte de las opiniones de pacientes y no cuentan en su calificación.</p><div class="ops">${m.colegas.map(k=>`<article class="op"><div class="h"><b>${k[0]}</b><small>${k[1]}</small></div><p>${k[2]}</p><small class="rel">${k[3]}</small></article>`).join('')}</div>` : ''}`]);

  const artsH = arts.length ? `<div class="pf-arts"><small>${arts.length === 1 ? 'Su artículo' : 'Sus artículos'}</small>${arts.map(a=>`<button class="lnk" data-toast="La página del artículo aún no está en el prototipo">${a[0]}${a[3] ? ' · ' + a[3] + ' min' : ''}</button>`).join('')}</div>` : '';

    : c.tel ? `<div class="barra-acc"><div><b>${peso(c.pr)}</b><span>Consulta · ${c.lu}</span></div><a class="btn primario" href="${tel}" data-llamar="${c.tel}">${ic('phone')}Llamar</a></div>` : '';
  return `${nav('buscar')}<main class="wrap"><a class="volver" href="#resultados">${ic('arrow-left')}Resultados</a>
  <div class="pf-head"><div class="ph">${avatar(m)}<div class="who"><h1>${m.n}</h1><p class="spec">${m.esp}${m.foco?' · '+m.foco:''}</p>${ced(m)}${rate}${m.vol ? `<details class="vol"><summary>${ic('message-circle-heart')}Sus pacientes regresan</summary><p>Muchos de sus pacientes vuelven a consulta. Lo medimos con las citas que se agendan en Mi Médico Manik.</p></details>` : ''}${artsH}</div></div>${m.dest ? `<figure class="dest"><blockquote>«${m.dest[0]}»</blockquote><figcaption>Opinión destacada · ${m.dest[1]}, ${m.dest[2]}</figcaption></figure>` : ''}</div>

V.cita = () => {
  const ci = S.cita, demo = S.demo;
  if (!ci || demo === 'vencido') return `${nav('')}<main class="wrap"><div class="ok"><span class="ic" style="background:var(--no-disponible);color:var(--no-disponible-texto)">${ic('clock')}</span><h1 id="h-ok" tabindex="-1">Este enlace ya <b>no funciona</b>.</h1><p class="lead">Puede haber vencido o estar incompleto. Te mandamos uno nuevo al celular con el que agendaste.</p>
    <form class="form" data-form="enlace" style="width:100%;max-width:420px"><div class="campo-f"><label for="cel-e">Celular</label><input id="cel-e" inputmode="tel" autocomplete="tel" placeholder="10 dígitos"></div><button class="btn primario" type="submit">Mandarme un enlace nuevo</button></form>
    <a class="btn texto" href="#inicio">Ir al inicio</a></div>${demoB()}</main>`;
  const m = MED.find(x=>x.id===ci.med), c = m.cons.find(x=>x.id===ci.cons);
  const cuando = fechaLarga(ci.dia).replace(/^./, x=>x.toUpperCase()) + ', ' + ci.hora;
  const resumen = (tach) => `<section class="cres a-res" aria-label="Tu cita"><span class="cuando${tach?' tachada':''}">${cuando}</span>
   <span class="fila">${ic('stethoscope')}<span><b>${m.n}</b><small>${m.esp}</small></span></span>
   ${filaLugar(c, ci.modo)}
   <span class="fila"><span></span><span><b>${precioTxt(m, c, ci.promo)}</b><small>${ci.modo==='virtual' ? 'El consultorio te indica cómo pagar' : 'Pagas en el consultorio'}</small></span></span>
   <span class="fila"><span></span><span><b>Paciente: ${ci.nombre}</b><small>Celular ··· ${ci.cel.slice(-4)}</small></span></span>`;
  const telA = c.tel ? `<a class="btn secundario" href="tel:+52${c.tel.replace(/ /g,'')}" data-llamar="${c.tel}">${ic('phone')}Llamar al consultorio · ${c.tel}</a>` : '';
  if ((ci.estado === 'cancelada' && !demo) || demo === 'consultorio') {
    const porC = demo === 'consultorio';
    return `${nav('')}<main class="wrap"><div class="ok"><span class="estado gris">${porC ? 'Cancelada por el consultorio' : 'Cancelada'}</span><h1 id="h-ok" tabindex="-1">${porC ? 'El consultorio <b>canceló</b> tu cita.' : 'Cancelaste <b>tu cita</b>.'}</h1><p class="lead">${porC ? 'Lo sentimos. Puedes elegir otro horario con el mismo médico.' : 'El horario quedó libre para alguien más. Te mandamos la confirmación por mensaje.'}</p></div>
    <div class="cc">${resumen(true)}<div class="acc"><button class="btn primario" data-agendar="${m.id}|${c.id}">Agendar otra vez con ${art(m)}${corto(m)}</button><a class="btn texto" href="#resultados">Buscar otro médico</a></div></section></div>${demoB()}</main>`;
  }
  const faltan = inicioCita(ci) - Date.now(), pasada = demo === 'pasada' || faltan < 0, menos = demo === 'menos24' || (!pasada && faltan < 864e5);
  if (pasada) return `${nav('')}<main class="wrap"><div class="ok"><span class="estado gris">Ya pasó</span><h1 id="h-ok" tabindex="-1">¿Cómo te fue con ${art(m)}<b>${corto(m)}</b>?</h1><p class="lead">Tu opinión ayuda a otras familias. Solo opina quien tuvo cita en Mi Médico Manik.</p></div>
    <div class="cc">${resumen(false)}<div class="acc"><button class="btn primario" data-toast="El formulario para opinar aún no está en el prototipo">Opinar sobre la consulta</button><button class="btn secundario" data-agendar="${m.id}|${c.id}">Agendar otra cita</button></div></section></div>${demoB()}</main>`;
  const lim = new Date(inicioCita(ci) - 864e5), limT = `${DIAS[lim.getDay()]} ${lim.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][lim.getMonth()]} a las ${ci.hora}`;
  const plan = menos
    ? `<section class="cmsg a-msg" aria-labelledby="h-plan"><h2 id="h-plan">¿Necesitas cambiarla o cancelarla?</h2><p>Faltan menos de 24 horas, así que ya no se puede desde aquí. Llama al consultorio para avisar.</p>${telA}</section>`
    : `<section class="cmsg a-msg" aria-labelledby="h-plan"><h2 id="h-plan">¿Cambió tu plan?</h2><a class="btn secundario" href="#cita-cambiar" style="justify-self:start">Cambiar fecha u hora</a><button class="peligro" data-cancelar-cita>Cancelar cita</button></section>`;
  return `${nav('')}<main class="wrap"><div class="ok"><span class="estado">${ic('circle-check')}Confirmada</span><h1 id="h-ok" tabindex="-1">Tu <b>cita</b></h1><p class="limite">${menos ? 'Faltan menos de 24 horas.' : `Puedes cambiarla o cancelarla hasta el <b>${limT}</b> (24 horas antes).`}</p></div>
  <div class="cc">${resumen(false)}<div class="acc"><button class="btn primario" data-toast="Aquí se abriría el mapa">${ic('map-pin')}Cómo llegar</button><a class="btn secundario" href="${gcal(m, c, ci)}" target="_blank" rel="noopener">${ic('calendar-check')}Agregar a mi calendario</a></div></section>${plan}</div>${demoB()}</main>`;
};
function demoB(){ return `<details class="demo"><summary>Ver otros estados (solo prototipo)</summary><div class="acc">${[['', 'Actual'],['menos24','Faltan menos de 24 h'],['pasada','Ya pasó'],['vencido','Enlace vencido'],['consultorio','El consultorio canceló']].map(([k,t])=>`<button class="btn texto" data-demo="${k}">${t}</button>`).join('')}</div></details>`; }
V['cita-cambiar'] = () => {
  const ci = S.cita; if (!ci || ci.estado !== 'activa') { location.hash = 'cita'; return ''; }
  const m = MED.find(x=>x.id===ci.med), c = m.cons.find(x=>x.id===ci.cons);
  const ks = Object.keys(c.ag||{}).map(Number).sort((a,b)=>a-b);
  if (S.cdia == null || !c.ag[S.cdia]) S.cdia = ks[0];
  const dias = Array.from({length:10},(_,k)=>k).map(k => { const d = dia(k), hay = !!(c.ag && c.ag[k]);
    return `<button data-cdia="${k}" aria-pressed="${k===S.cdia}" ${hay?'':'disabled'} aria-label="${fechaLarga(k)}${hay?'':', sin lugar'}"><small>${k===0?'Hoy':k===1?'Mañana':DIAS[d.getDay()].slice(0,3).replace(/^./,x=>x.toUpperCase())}</small><b>${d.getDate()}</b><small>${hay?c.ag[k].length+' lugar'+(c.ag[k].length>1?'es':''):'sin lugar'}</small></button>`; }).join('');

  const listo = S.chora && S.cdia != null;
  return `${nav('')}<main class="wrap"><a class="volver" href="#cita">${ic('arrow-left')}Volver a tu cita</a><div class="paso"><h1 id="h-ok" tabindex="-1">Elige el nuevo horario</h1><p class="spec">Mismo médico y consultorio. Tu horario actual se libera solo cuando confirmes el cambio.</p>
  ${S.ocupado ? `<div class="ocupado" role="alert" tabindex="-1" id="ocupado"><b>Ese horario se acaba de ocupar.</b><span>Elige otro; tu cita actual sigue igual.</span></div>` : ''}
  <div class="dias" role="group" aria-label="Día">${dias}</div><div class="horas pf-ag" role="group" aria-label="Horarios" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${horas}</div>
  <dl class="det ab"><dt>Antes</dt><dd class="tachada">${fechaLarga(ci.dia)}, ${ci.hora}</dd><dt>Ahora</dt><dd>${listo ? fechaLarga(S.cdia) + ', ' + S.chora : 'Elige un horario'}</dd></dl></div></main>
  <div class="pie-paso"><div class="in"><div><b>${listo ? nombreDia(S.cdia, true) + ', ' + S.chora : 'Elige un horario'}</b>${c.lu}</div><button class="btn primario" data-cambio aria-disabled="${!listo}">Confirmar cambio</button></div></div>`;
};
V.confirmada = () => {
  const m = MED.find(x=>x.id===S.med), c = m && m.cons.find(x=>x.id===S.cons);

  if (OCUPA.has(key)) { OCUPA.delete(key); const c = MED.find(x=>x.id===S.med).cons.find(x=>x.id===S.cons); c.ag[S.dia] = c.ag[S.dia].filter(h=>h!==S.hora); if (!c.ag[S.dia].length) delete c.ag[S.dia]; S.ocupado = true; render(); $('#ocupado')?.focus(); return; }
  S.ocupado = false; reservar(S.med, S.cons, S.dia, S.hora);
  S.cita = {med:S.med, cons:S.cons, dia:S.dia, hora:S.hora, nombre:S.datos.nombre, cel:S.datos.cel, estado:'activa', promo:S.promo, modo:S.modo}; S.demo = null; location.hash = 'confirmada';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#capa').innerHTML) cerrar(); });
render();
</script>
