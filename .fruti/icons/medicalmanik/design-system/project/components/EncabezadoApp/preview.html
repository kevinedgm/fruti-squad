<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300..700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"><style>html,body{margin:0}body{background:var(--canvas,#F5F7FB);color:var(--ink,#14213D);font:16px/24px var(--font-sans,"Atkinson Hyperlegible Next",system-ui,sans-serif);padding:16px}

.card{background:var(--surface,#fff);border:1px solid var(--line,#E1E6F0);border-radius:var(--radius-2xl,24px)}.top{display:flex;align-items:center;gap:12px;height:var(--header-height,64px);padding:0 16px;background:var(--surface,#fff);border:1px solid var(--line,#E1E6F0);border-radius:var(--radius-lg,18px)}
