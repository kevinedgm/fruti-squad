<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"><style>html,body{margin:0}body{background:var(--canvas,#F5F7FB);color:var(--ink,#14213D);font:16px/24px var(--font-sans,"Atkinson Hyperlegible Next",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Sora",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:var(--control-height,44px);padding:0 18px;border-radius:var(--radius-md,14px);font:600 15px/20px var(--font-sans,"Atkinson Hyperlegible Next",sans-serif);border:1px solid transparent;cursor:pointer}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus,#234899);outline-offset:2px}
.b1{background:var(--manik,#234899);color:var(--on-manik,#fff)}.b1:hover{background:var(--manik-hover,#1C3A79)}.b2{background:var(--surface,#fff);color:var(--manik,#234899);border-color:var(--line-control,#858EA5)}.b3{background:transparent;color:var(--manik,#234899)}.b4{background:var(--surface,#fff);color:var(--error,#C33F4E);border-color:var(--error,#C33F4E)}
.ico{width:18px;height:18px;flex:none;display:block}
.est{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 9px;border-radius:var(--radius-pill,999px);font:600 13px/18px var(--font-sans,sans-serif)}
.card{background:var(--surface,#fff);border:1px solid var(--line,#E1E6F0);border-radius:var(--radius-2xl,24px)}.pc{padding:20px;display:grid;gap:16px}.pt{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.av2{width:48px;height:48px;border-radius:50%;background:var(--app-expediente-soft,#EAEEF6);color:var(--app-expediente-ink,#234899);display:grid;place-items:center;font:600 16px var(--font-display,"Sora",sans-serif)}.nmp{margin:0;font-size:20px;line-height:28px;font-weight:600}.sm{margin:0;font-size:14px;line-height:20px}.id{font-weight:600;color:var(--ink,#14213D);letter-spacing:.02em}.sp{flex:1}.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.v{display:grid;gap:2px;padding:12px 14px;border-radius:var(--radius-md,14px);background:var(--surface-soft,#EEF1F7)}.ov{font:700 12px/16px var(--font-sans,sans-serif);letter-spacing:.08em;color:var(--muted,#4A5674)}.vx{font:600 28px/32px var(--font-sans,sans-serif)}</style></head><body><div class="card pc"><div class="pt"><span class="av2">MR</span><div><p class="d nmp">Mariana Ruiz Ortega</p><p class="mut sm num">42 años · F · Exp. <b class="id">MR-0107-II1</b> · Tipo O+</p></div><span class="sp"></span><span class="est" style="background:var(--error-soft,#F9ECED);color:var(--on-error-soft,#BA3D4D)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Alergia: penicilina</span></div><div class="vs"><div class="v"><span class="ov">PRESIÓN</span><span class="num vx">120/80</span><span class="mut sm">mmHg</span></div><div class="v"><span class="ov">FREC. CARDIACA</span><span class="num vx">72</span><span class="mut sm">lpm</span></div><div class="v"><span class="ov">GLUCOSA</span><span class="num vx">104</span><span class="mut sm">mg/dL</span></div><div class="v"><span class="ov">PESO</span><span class="num vx">68.4</span><span class="mut sm">kg</span></div></div></div></body></html>
