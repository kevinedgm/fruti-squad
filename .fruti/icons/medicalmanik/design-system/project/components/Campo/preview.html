<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"><style>html,body{margin:0}body{background:var(--canvas,#F5F7FB);color:var(--ink,#14213D);font:16px/24px var(--font-sans,"Atkinson Hyperlegible Next",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Sora",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:var(--control-height,44px);padding:0 18px;border-radius:var(--radius-md,14px);font:600 15px/20px var(--font-sans,"Atkinson Hyperlegible Next",sans-serif);border:1px solid transparent;cursor:pointer}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus,#234899);outline-offset:2px}
.b1{background:var(--manik,#234899);color:var(--on-manik,#fff)}.b1:hover{background:var(--manik-hover,#1C3A79)}.b2{background:var(--surface,#fff);color:var(--manik,#234899);border-color:var(--line-control,#858EA5)}.b3{background:transparent;color:var(--manik,#234899)}.b4{background:var(--surface,#fff);color:var(--error,#C33F4E);border-color:var(--error,#C33F4E)}
.ico{width:18px;height:18px;flex:none;display:block}
.est{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 9px;border-radius:var(--radius-pill,999px);font:600 13px/18px var(--font-sans,sans-serif)}
.card{background:var(--surface,#fff);border:1px solid var(--line,#E1E6F0);border-radius:var(--radius-2xl,24px)}.f{display:grid;gap:6px;min-width:220px;flex:1}label{font:600 14px/20px var(--font-sans,sans-serif)}input{height:44px;border:1px solid var(--line-control,#858EA5);border-radius:var(--radius-md,14px);padding:0 14px;font:16px var(--font-sans,sans-serif);color:var(--ink,#14213D);background:var(--surface,#fff)}input:focus{outline:2px solid var(--focus,#234899);outline-offset:1px}.in{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--line-control,#858EA5);border-radius:var(--radius-md,14px);padding:0 14px;background:var(--surface,#fff)}.in input{border:0;height:auto;padding:0;width:100%;text-align:right;outline:0}.in.err{border:2px solid var(--error,#C33F4E)}small{font-size:13px;line-height:18px}.er{display:flex;gap:6px;align-items:center;color:var(--error,#C33F4E)}body{display:flex;gap:16px;flex-wrap:wrap}</style></head><body><div class="f"><label for="m">Medicamento</label><input id="m" value="Losartán"><small class="mut">Nombre genérico o comercial.</small></div><div class="f"><label for="ds">Dosis</label><div class="in err"><input id="ds" class="num" value="500" aria-invalid="true" aria-describedby="e1"><span class="mut num">mg</span></div><small id="e1" class="er"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Fuera de rango: máximo 100 mg al día.</small></div></body></html>
