<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap"><style>html,body{margin:0}body{background:var(--canvas,#F5F7FB);color:var(--ink,#14213D);font:16px/24px var(--font-sans,"Atkinson Hyperlegible Next",system-ui,sans-serif);padding:16px}
.d{font-family:var(--font-display,"Sora",sans-serif)}.num{font-variant-numeric:tabular-nums}.mut{color:var(--muted,#4A5674)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:var(--control-height,44px);padding:0 18px;border-radius:var(--radius-md,14px);font:600 15px/20px var(--font-sans,"Atkinson Hyperlegible Next",sans-serif);border:1px solid transparent;cursor:pointer}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--focus,#234899);outline-offset:2px}
.b1{background:var(--manik,#234899);color:var(--on-manik,#fff)}.b1:hover{background:var(--manik-hover,#1C3A79)}.b2{background:var(--surface,#fff);color:var(--manik,#234899);border-color:var(--line-control,#858EA5)}.b3{background:transparent;color:var(--manik,#234899)}.b4{background:var(--surface,#fff);color:var(--error,#C33F4E);border-color:var(--error,#C33F4E)}
.ico{width:18px;height:18px;flex:none;display:block}
.est{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 9px;border-radius:var(--radius-pill,999px);font:600 13px/18px var(--font-sans,sans-serif)}
.card{background:var(--surface,#fff);border:1px solid var(--line,#E1E6F0);border-radius:var(--radius-2xl,24px)}body{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style></head><body><span class="est" style="background:var(--exito-soft,#E8F2ED);color:var(--on-exito-soft,#157C4A)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Receta surtida</span><span class="est" style="background:var(--aviso-soft,#F6EFE6);color:var(--on-aviso-soft,#A05C03)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4M12 17h.01"/></svg>Existencias bajas</span><span class="est" style="background:var(--error-soft,#F9ECED);color:var(--on-error-soft,#BA3D4D)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>Alergia: penicilina</span><span class="est" style="background:var(--info-soft,#ECF1F4);color:var(--on-info-soft,#3D7291)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>En sala de espera</span></body></html>
