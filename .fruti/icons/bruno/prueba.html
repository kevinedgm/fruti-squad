<script>
const t=document.getElementById('ic').innerHTML.trim(),reducir=matchMedia('(prefers-reduced-motion: reduce)');
const poner=(id,ts)=>ts.forEach(s=>{const d=document.createElement('div');d.innerHTML=t;const v=d.firstElementChild;v.setAttribute('width',s);v.setAttribute('height',s);document.getElementById(id).append(v)});
poner('tam',[16,20,24,32,48,96]);poner('osc',[24,48]);

document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{if(reducir.matches)return;const c='uva-bruno--'+b.dataset.m;
  document.querySelectorAll('.uva-bruno').forEach(s=>{s.classList.remove('uva-bruno--contento','uva-bruno--avisar');void s.getBBox();s.classList.add(c)})});
document.addEventListener('animationend',e=>{const s=e.target.closest?e.target.closest('svg'):null;if(s)s.classList.remove('uva-bruno--contento','uva-bruno--avisar')});
