<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>
html,body{margin:0}body{background:var(--surface,#fff);color:var(--text,#141B33);font:15px/22px var(--font-sans,"Poppins",sans-serif);padding:var(--space-5,20px)}
.g{display:grid;grid-template-columns:120px 1fr;gap:14px 16px;align-items:center}.lb{font:600 11px/14px var(--font-sans,"Poppins",sans-serif);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle,#646B80)}
.f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ico{width:14px;height:14px;display:block;flex:none}
.ps,.et,.ur{display:inline-flex;align-items:center;gap:6px;font:500 13px/18px var(--font-sans,"Poppins",sans-serif);white-space:nowrap}
.ps{border-radius:var(--radius-pill,999px);padding:3px 10px 3px 7px}
.et{border:1.5px solid currentColor;border-radius:var(--radius-sm,6px);padding:2px 8px 2px 6px;background:var(--surface,#fff)}
.ur{font-weight:600;border-radius:var(--radius-sm,6px);padding:3px 8px 3px 6px;background:var(--pera,#C2D225);color:var(--on-pera,#052A76)}
.nota{grid-column:1/-1;font-size:13px;line-height:18px;color:var(--text-muted,#535B70);margin:4px 0 0}
@media (max-width:640px){.g{grid-template-columns:1fr;gap:6px}}
</style></head><body><div class="g"><span class="lb">Proceso</span><div class="f"><span class="ps" style="background:var(--muestra-no-ingresada,#FEF3C7);color:var(--on-muestra-no-ingresada,#713F12)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-dasharray="2.6 2.1"/></svg>No ingresada</span><span class="ps" style="background:var(--muestra-en-proceso,#E0F2FE);color:var(--on-muestra-en-proceso,#075985)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M8 8 V2.5 A5.5 5.5 0 0 1 8 13.5 Z" fill="currentColor"/></svg>En proceso</span><span class="ps" style="background:var(--muestra-generando-informe,#EDE9FE);color:var(--on-muestra-generando-informe,#5B21B6)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M8 8 V2.5 A5.5 5.5 0 1 1 2.5 8 Z" fill="currentColor"/></svg>Generando informe</span><span class="ps" style="background:var(--muestra-terminada,#DCFCE7);color:var(--on-muestra-terminada,#166534)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M4.8 8.2 7 10.4 11.2 5.9" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>Terminada</span><span class="ps" style="background:var(--muestra-cancelada,#FEE2E2);color:var(--on-muestra-cancelada,#991B1B)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>Cancelada</span></div><span class="lb">Pago</span><div class="f"><span class="et" style="color:var(--pago-no-pagada,#B42318)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M10 5.6 H7.1 a1.3 1.3 0 0 0 0 2.6 h1.8 a1.3 1.3 0 0 1 0 2.6 H6 M8 4.2 v7.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>No pagada</span><span class="et" style="color:var(--pago-parcial,#B54708)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M8 1.5 A6.5 6.5 0 0 0 8 14.5 Z" fill="currentColor"/></svg>Pago parcial</span><span class="et" style="color:var(--pago-pagada,#166534)"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M10 5.6 H7.1 a1.3 1.3 0 0 0 0 2.6 h1.8 a1.3 1.3 0 0 1 0 2.6 H6 M8 4.2 v7.6" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg>Pagada</span><span class="et" style="color:var(--pago-cortesia,#052A76)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>Cortesía</span></div><span class="lb">Prioridad</span><div class="f"><span class="ur"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>Urgente</span></div><p class="nota">Pastilla rellena = proceso · etiqueta con contorno = pago · ficha pera = urgente. Siempre ícono + palabra.</p></div></body></html>
