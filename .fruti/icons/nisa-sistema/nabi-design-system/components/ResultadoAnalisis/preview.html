<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>
html,body{margin:0} body{background:var(--bg,#FFFFFF);color:var(--text,#141B33);font-family:var(--font-sans,"Poppins",system-ui,sans-serif);font-size:15px;line-height:22px;padding:var(--space-4,16px);display:flex;gap:var(--space-3,12px);flex-wrap:wrap;align-items:center}
.d{font-family:var(--font-datos,"IBM Plex Mono",monospace);font-feature-settings:"zero"} .mut{color:var(--text-muted,#535B70)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:var(--control-h,40px);padding:0 16px;border-radius:var(--radius-sm,6px);font:600 14px/20px var(--font-sans,"Poppins",sans-serif);border:1px solid transparent;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--focus,#052A76);outline-offset:2px}
.b-primary{background:var(--primary,#052A76);color:var(--on-primary,#fff)} .b-secondary{background:var(--surface,#fff);color:var(--primary,#052A76);border-color:var(--border-control,#858DA3)} .b-ghost{background:transparent;color:var(--primary,#052A76)} .b-danger{background:var(--surface,#fff);color:var(--fuera,#B42318);border-color:var(--fuera,#B42318)}
.ico{width:16px;height:16px;display:block;flex:none}
.est{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:var(--radius-sm,6px);font:500 13px/18px var(--font-sans,"Poppins",sans-serif)}
.e-ok{background:var(--conforme-soft,#E3F1E4);color:var(--on-conforme-soft,#1E5A22)} .e-bad{background:var(--fuera-soft,#FDE7E5);color:var(--on-fuera-soft,#8A1A12)} .e-warn{background:var(--alerta-soft,#FBF0CC);color:var(--on-alerta-soft,#664700)} .e-pend{background:var(--pendiente-soft,#E4E8F0);color:var(--on-pendiente-soft,#344054)} .e-cur{background:var(--pera-soft,#F2F6CF);color:var(--text,#141B33)} .e-neu{background:var(--surface,#FFFFFF);box-shadow:inset 0 0 0 1px var(--border-strong,#CDD3DF);color:var(--text-muted,#535B70)}
.pz{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:12px;width:100%">
<div style="border:1px solid var(--border,#E2E5EC);border-radius:var(--radius-md,8px);padding:14px;display:grid;gap:6px"><span style="font:600 16px/22px var(--font-sans)">pH</span><span><span class="d" style="font-size:32px;line-height:36px;font-weight:500">7.42</span> <span class="d mut" style="font-size:12px">± 0.05</span></span><span class="d mut" style="font-size:12px">ESP 6.5 – 8.5</span><span class="est e-ok"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Conforme</span></div>
<div style="border:1px solid var(--border,#E2E5EC);border-radius:var(--radius-md,8px);padding:14px;display:grid;gap:6px"><span style="font:600 16px/22px var(--font-sans)">Plomo (Pb)</span><span><span class="d" style="font-size:32px;line-height:36px;font-weight:500;color:var(--fuera,#B42318)">0.0124</span> <span class="d mut" style="font-size:14px">mg/L</span></span><span class="d mut" style="font-size:12px">ESP ≤ 0.010</span><span class="est e-bad"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>Fuera de especificación</span></div>
<div style="border:1px solid var(--border,#E2E5EC);border-radius:var(--radius-md,8px);padding:14px;display:grid;gap:6px"><span style="font:600 16px/22px var(--font-sans)">Arsénico (As)</span><span><span class="d" style="font-size:32px;line-height:36px;font-weight:500">&lt; 0.002</span> <span class="d mut" style="font-size:14px">mg/L</span></span><span class="d mut" style="font-size:12px">LD 0.002 · ESP ≤ 0.025</span><span class="est e-ok"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Conforme</span></div></div></body></html>
