<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap"><style>html,body{margin:0;background:var(--canvas,#f2f2f6);color:var(--ink,#121217);font:16px/24px var(--font-ui,"Atkinson Hyperlegible Next",system-ui,sans-serif)}.wrap{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{height:var(--size-control,48px);border-radius:var(--radius-control,12px);padding:0 20px;border:0;font:700 16px/1 var(--font-ui,"Atkinson Hyperlegible Next",system-ui,sans-serif);display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;overflow:hidden}
.p{background:var(--anil,#3346e0);color:var(--on-anil,#fff)} .p:hover{background:var(--anil-strong,#2a3bc4)}
.s{background:transparent;color:var(--anil,#3346e0);box-shadow:inset 0 0 0 2px var(--anil,#3346e0)}
.campo{height:var(--size-field-action,56px);border-radius:var(--radius-field,14px);padding:0 24px;min-width:240px;justify-content:center}
.ok{background:var(--verde,#0a7354);color:var(--on-estado,#fff)}
.btn:focus-visible{outline:3px solid var(--focus,#3346e0);outline-offset:3px}
@media (pointer:fine){.btn{height:var(--size-control-fine,40px);border-radius:var(--radius-control-fine,10px)}.campo{height:var(--size-control-fine,40px)}}
</style></head><body><div class="wrap">
<button class="btn p" type="button">Registrar medición</button>
<button class="btn s" type="button">Ver lote</button>
<button class="btn p campo" type="button">Registrar medición</button>
<button class="btn ok" type="button">Guardado</button>
</div></body></html>
