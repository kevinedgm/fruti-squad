<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64.0 64.0" role="img" aria-label="PULZ" style="color:#2a211c"><style>.pz-arriba,.pz-abajo{transform-box:fill-box}.pz-arriba{transform-origin:right center;animation:pz-vacia 700ms cubic-bezier(.5,0,.75,0) 500ms both}.pz-trasiego{stroke-dasharray:1 1.1;animation:pz-corre 700ms cubic-bezier(.4,0,.2,1) 900ms both}.pz-abajo{transform-origin:left center;animation:pz-llena 800ms cubic-bezier(.2,.8,.3,1) 1400ms both}@keyframes pz-vacia{from{transform:scaleX(1)}to{transform:scaleX(0)}}@keyframes pz-corre{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes pz-llena{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.pz-arriba{animation:none;transform:scaleX(0)}.pz-trasiego,.pz-abajo{animation:none}}</style><rect x="8" y="9" width="48" height="12" rx="3" fill="currentColor"/><rect x="8" y="43" width="48" height="12" rx="3" fill="currentColor"/><rect class="pz-arriba" x="11.5" y="12.5" width="41" height="5" rx="2.5" fill="var(--pulz-color,#b4582f)"/><clipPath id="da"><polygon points="38,21 56,21 26,43 8,43"/></clipPath><path class="pz-trasiego" clip-path="url(#da)" d="M50 19.5 14 44.5" pathLength="1" stroke="var(--pulz-color,#b4582f)" stroke-width="30" fill="none"/><rect class="pz-abajo" x="11.5" y="46.5" width="41" height="5" rx="2.5" fill="var(--pulz-color,#b4582f)"/></svg>
