<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-glucose-high" aria-hidden="true">
  <style>
    .uva-glucose-high{stroke-width:var(--uva-stroke,1.5);overflow:visible}
    /* Atención: al llegar una glucosa alta nueva, la gota se eleva, cae, se aplasta al tocar y rebota;
       en el impacto suelta una onda (2 × 900 ms = 1.8 s). Después queda quieta mientras dure.
       El componente añade uva-glucose-high--caer al entrar en el estado y la quita en animationend. */
    .uva-glucose-high--caer{--uva-glucose-high-gota:uva-glucose-high-caer;--uva-glucose-high-onda:uva-glucose-high-onda}
    .uva-glucose-high__cuerpo{transform-box:fill-box;transform-origin:50% 100%;animation:var(--uva-glucose-high-gota,none) 900ms linear 0s 2}
    .uva-glucose-high__onda{opacity:0;stroke:var(--uva-accent,currentColor);transform-box:fill-box;transform-origin:50% 65%;animation:var(--uva-glucose-high-onda,none) 900ms linear 0s 2}
    @keyframes uva-glucose-high-caer{0%{animation-timing-function:cubic-bezier(.2,.6,.4,1);transform:none}18%{animation-timing-function:cubic-bezier(.55,0,.9,.4);transform:translateY(-1.6px)}38%{animation-timing-function:cubic-bezier(.2,.6,.4,1);transform:translateY(0) scale(1.12,.86)}52%{animation-timing-function:cubic-bezier(.4,0,.6,1);transform:translateY(-.4px) scale(.95,1.05)}66%{animation-timing-function:cubic-bezier(.4,0,.6,1);transform:scale(1.03,.97)}80%{transform:none}100%{transform:none}}
    @keyframes uva-glucose-high-onda{0%{opacity:0;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*0.62)}38%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:0;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*0.62)}40%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:.85;transform:scale(1.06);stroke-width:calc(var(--uva-stroke,1.5)*0.62)}95%{opacity:0;transform:scale(1.35);stroke-width:calc(var(--uva-stroke,1.5)*0.45)}100%{opacity:0;transform:scale(1.35)}}
    @media (prefers-reduced-motion:reduce){
      .uva-glucose-high--caer{--uva-glucose-high-gota:none;--uva-glucose-high-onda:none}
    }
  </style>
  <!-- glucose-high · cae, se aplasta y suelta una onda al entrar en el estado (clase uva-glucose-high--caer) -->
  <path class="uva-glucose-high__onda" d="M12 21.70A7.7 7.7 0 0 0 19.70 14.0C19.70 11.90 18.60 10.00 16.00 8.40S12.50 4.80 12 2.2C11.50 4.80 10.00 7.20 8.00 8.40S4.30 11.90 4.30 14.0A7.7 7.7 0 0 0 12 21.70Z"/>
  <g class="uva-glucose-high__cuerpo">
    <path class="uva-glucose-high__gota" d="M12 21.70A7.7 7.7 0 0 0 19.70 14.0C19.70 11.90 18.60 10.00 16.00 8.40S12.50 4.80 12 2.2C11.50 4.80 10.00 7.20 8.00 8.40S4.30 11.90 4.30 14.0A7.7 7.7 0 0 0 12 21.70Z"/>
    <path class="uva-glucose-high__flecha" d="M12 18.2V11.2M9.2 14L12 11.2L14.8 14"/>
  </g>
</svg>
