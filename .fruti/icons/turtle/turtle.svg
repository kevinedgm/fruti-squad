7.68 3.62 17.72 3.44 17.64Z")}78%{animation-timing-function:cubic-bezier(.3,0,.4,1);d:path("M2.72 16.82C3.38 16.7 3.74 16.4 3.8 15.9C3.9 10.3 6.9 6.3 10.7 6.3C14.5 6.3 17.2 9.9 17.4 13.9C17.95 13.1 18.57 12.32 19.51 12.32C20.44 12.32 20.91 13.1 20.75 13.88C20.6 14.66 19.82 15.12 18.88 15.12C18.41 15.2 18.02 15.44 17.9 16.1C17.82 17.01 17.73 18.05 17.37 18.83L15.23 18.83C15.23 17.92 15.05 16.75 14.6 16.1C12.1 16.2 10.1 16.2 8.1 16.0C7.76 17.01 7.67 18.05 7.76 18.83L5.44 18.83C5.08 18.18 4.9 17.4 4.72 16.75C3.86 16.94 3.26 17.06 2.72 16.82Z")}90%{animation-timing-function:cubic-bezier(.3,0,.5,1);d:path("M2.0 16.1C3.1 15.9 3.7 15.4 3.8 14.7C3.9 9.1 6.9 5.1 10.7 5.1C14.5 5.1 17.2 8.7 17.4 12.7C18.13 11.43 18.96 10.39 20.21 10.39C21.46 10.39 22.08 11.43 21.87 12.47C21.66 13.51 20.62 14.13 19.38 14.13C18.75 14.24 18.23 14.55 17.9 14.9C17.98 16.26 17.89 17.81 17.49 18.97L15.11 18.97C15.11 17.62 14.91 15.87 14.6 14.9C12.1 15.0 10.1 15.0 8.1 14.8C7.89 16.26 7.79 17.81 7.89 18.97L5.31 18.97C4.92 18.0 4.72 16.84 4.52 15.87C3.9 16.3 2.9 16.5 2.0 16.1Z")}100%{d:path("M2.0 16.0C3.1 15.8 3.7 15.3 3.8 14.6C3.9 9.0 6.9 5.0 10.7 5.0C14.5 5.0 17.2 8.6 17.4 12.6C18.1 11.4 18.9 10.4 20.1 10.4C21.3 10.4 21.9 11.4 21.7 12.4C21.5 13.4 20.5 14.0 19.3 14.0C18.7 14.1 18.2 14.4 17.9 14.8C18.0 16.2 17.9 17.8 17.5 19.0L15.1 19.0C15.1 17.6 14.9 15.8 14.6 14.8C12.1 14.9 10.1 14.9 8.1 14.7C7.9 16.2 7.8 17.8 7.9 19.0L5.3 19.0C4.9 18.0 4.7 16.8 4.5 15.8C3.9 16.2 2.9 16.4 2.0 16.0Z")}}
    @keyframes uva-turtle-banda{0%{animation-timing-function:cubic-bezier(.4,0,.6,1);d:path("M4.3 11.4C7.9 10.4 13.5 10.4 17.2 11.3")}14%{animation-timing-function:cubic-bezier(.5,0,.9,.5);d:path("M4.3 11.7C7.9 10.7 13.5 10.7 17.2 11.6")}36%{animation-timing-function:linear;d:path("M4.3 14.0C7.9 13.0 13.5 13.0 17.2 13.9")}58%{animation-timing-function:cubic-bezier(.2,.6,.4,1);d:path("M4.3 14.0C7.9 13.0 13.5 13.0 17.2 13.9")}78%{animation-timing-function:cubic-bezier(.3,0,.4,1);d:path("M4.3 12.7C7.9 11.7 13.5 11.7 17.2 12.6")}90%{animation-timing-function:cubic-bezier(.3,0,.5,1);d:path("M4.3 11.5C7.9 10.5 13.5 10.5 17.2 11.4")}100%{d:path("M4.3 11.4C7.9 10.4 13.5 10.4 17.2 11.3")}}
    @keyframes uva-turtle-ojo{0%{animation-timing-function:cubic-bezier(.4,0,.6,1);transform:translate(0.0px,0.0px);opacity:1}14%{animation-timing-function:cubic-bezier(.5,0,.9,.5);transform:translate(-0.46px,0.51px);opacity:1}36%{animation-timing-function:linear;transform:translate(-2.73px,3.83px);opacity:0}58%{animation-timing-function:cubic-bezier(.2,.6,.4,1);transform:translate(-2.73px,3.83px);opacity:0}78%{animation-timing-function:cubic-bezier(.3,0,.4,1);transform:translate(-0.68px,1.61px);opacity:1}90%{animation-timing-function:cubic-bezier(.3,0,.5,1);transform:translate(0.12px,0.04px);opacity:1}100%{transform:translate(0.0px,0.0px);opacity:1}}
    /* Navegadores que no animan la forma (propiedad d): se encoge un instante */
    @supports not (d: path("M0 0")) {
      .uva-turtle--esconder{animation:uva-turtle-encoger 360ms cubic-bezier(.3,0,.4,1) 0s 1}
    }
    @keyframes uva-turtle-encoger{0%{transform:none}40%{transform:scale(.94,.88)}100%{transform:none}}
    @media (prefers-reduced-motion:reduce){
      .uva-turtle--esconder{--uva-turtle-cuerpo:none;--uva-turtle-banda:none;--uva-turtle-ojo:none;animation:none}
    }
  </style>
  <!-- turtle · se esconde y se asoma (feedback) con la clase uva-turtle--esconder -->
