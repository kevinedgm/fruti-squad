<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-turtle" aria-hidden="true">
  <style>
    .uva-turtle{stroke-width:var(--uva-stroke,1.5);overflow:visible;transform-origin:50% 80%}
    .uva-turtle__ojo{fill:currentColor;stroke:none}
    /* Feedback: se esconde en el caparazón y vuelve a asomarse (800 ms, una vez).
       El componente añade uva-turtle--esconder al interactuar y la quita al terminar. */
    .uva-turtle--esconder{--uva-turtle-cuerpo:uva-turtle-cuerpo;--uva-turtle-banda:uva-turtle-banda;--uva-turtle-ojo:uva-turtle-ojo}
    .uva-turtle__cuerpo{animation:var(--uva-turtle-cuerpo,none) 800ms linear 0s 1}
    .uva-turtle__banda{animation:var(--uva-turtle-banda,none) 800ms linear 0s 1}
    .uva-turtle__ojo{animation:var(--uva-turtle-ojo,none) 800ms linear 0s 1}
