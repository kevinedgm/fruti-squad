<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="uva-icon uva-blood-pressure-high" aria-hidden="true">
  <style>
    .uva-blood-pressure-high{stroke-width:var(--uva-stroke,1.5);overflow:visible}
    /* Atención: al detectarse la presión alta late 3 veces (lub-dub, 2.4 s) y cada golpe suelta una onda
       que se expande y se desvanece; después queda quieto mientras dure. El componente añade uva-blood-pressure-high--latir
       al entrar en el estado. La flecha («alta») no se mueve. */
    .uva-blood-pressure-high--latir{--uva-blood-pressure-high-latido:uva-blood-pressure-high-latir;--uva-blood-pressure-high-onda:uva-blood-pressure-high-onda;--uva-blood-pressure-high-onda2:uva-blood-pressure-high-onda2}
    .uva-blood-pressure-high__corazon{transform-box:fill-box;transform-origin:50% 55%;animation:var(--uva-blood-pressure-high-latido,none) 800ms linear 0s 3}
    .uva-blood-pressure-high__onda{opacity:0;stroke:var(--uva-accent,currentColor);transform-box:fill-box;transform-origin:50% 50%;animation:var(--uva-blood-pressure-high-onda,none) 800ms linear 0s 3}
    .uva-blood-pressure-high__onda2{opacity:0;stroke:var(--uva-accent,currentColor);transform-box:fill-box;transform-origin:50% 50%;animation:var(--uva-blood-pressure-high-onda2,none) 800ms linear 0s 3}
    @keyframes uva-blood-pressure-high-latir{0%{animation-timing-function:cubic-bezier(.3,0,.5,1);transform:scale(1)}9%{animation-timing-function:cubic-bezier(.5,0,.7,1);transform:scale(1.1)}18%{animation-timing-function:cubic-bezier(.3,0,.5,1);transform:scale(.98)}26%{animation-timing-function:cubic-bezier(.4,0,.6,1);transform:scale(1.05)}40%{transform:scale(1)}100%{transform:scale(1)}}
    @keyframes uva-blood-pressure-high-onda{0%{opacity:0;transform:scale(1.1);stroke-width:calc(var(--uva-stroke,1.5)*.62)}9%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:.9;transform:scale(1.1);stroke-width:calc(var(--uva-stroke,1.5)*.62)}75%{opacity:0;transform:scale(1.62);stroke-width:calc(var(--uva-stroke,1.5)*.45)}100%{opacity:0;transform:scale(1.62)}}
    @keyframes uva-blood-pressure-high-onda2{0%{opacity:0;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*.55)}26%{animation-timing-function:cubic-bezier(.1,.75,.3,1);opacity:.55;transform:scale(1.05);stroke-width:calc(var(--uva-stroke,1.5)*.55)}88%{opacity:0;transform:scale(1.45);stroke-width:calc(var(--uva-stroke,1.5)*.42)}100%{opacity:0;transform:scale(1.45)}}
    @media (prefers-reduced-motion:reduce){
      .uva-blood-pressure-high--latir{--uva-blood-pressure-high-latido:none;--uva-blood-pressure-high-onda:none;--uva-blood-pressure-high-onda2:none}
    }
  </style>
  <!-- blood-pressure-high · late y emite ondas al entrar en el estado con la clase uva-blood-pressure-high--latir -->
  <path class="uva-blood-pressure-high__onda" d="M12 20.01C9.56 17.85 3.07 13.71 3.07 9.29C3.07 6.57 5.14 4.59 7.68 4.59C9.56 4.59 11.06 5.63 12 7.13C12.94 5.63 14.44 4.59 16.32 4.59C18.86 4.59 20.93 6.57 20.93 9.29C20.93 13.71 14.44 17.85 12 20.01Z"/>
  <path class="uva-blood-pressure-high__onda2" d="M12 20.01C9.56 17.85 3.07 13.71 3.07 9.29C3.07 6.57 5.14 4.59 7.68 4.59C9.56 4.59 11.06 5.63 12 7.13C12.94 5.63 14.44 4.59 16.32 4.59C18.86 4.59 20.93 6.57 20.93 9.29C20.93 13.71 14.44 17.85 12 20.01Z"/>
  <path class="uva-blood-pressure-high__corazon" d="M12 20.01C9.56 17.85 3.07 13.71 3.07 9.29C3.07 6.57 5.14 4.59 7.68 4.59C9.56 4.59 11.06 5.63 12 7.13C12.94 5.63 14.44 4.59 16.32 4.59C18.86 4.59 20.93 6.57 20.93 9.29C20.93 13.71 14.44 17.85 12 20.01Z"/>
  <path class="uva-blood-pressure-high__flecha" d="M12 16.4V9.6M9.3 12.3L12 9.6L14.7 12.3"/>
</svg>
