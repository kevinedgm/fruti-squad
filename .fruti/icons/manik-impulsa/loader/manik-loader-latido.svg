<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 72 314 317" aria-hidden="true" focusable="false" class="manik-loader manik-loader--latido">
  <!-- Manik Impulsa · loader «Latido»: el símbolo exacto late dos veces y descansa (1.2 s por ciclo). -->
  <style>
    .manik-loader__simbolo{fill:var(--manik-color,#6e6eb5);transform-box:fill-box;transform-origin:50% 50%;animation:manik-latido 1200ms ease-in-out infinite}
    @keyframes manik-latido{0%{transform:scale(1)}12%{transform:scale(1.08)}22%{transform:scale(.98)}32%{transform:scale(1.04)}44%,100%{transform:scale(1)}}
    @keyframes manik-respira{from{opacity:1}to{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.manik-loader__simbolo{animation:manik-respira 1600ms ease-in-out infinite alternate}}
  </style>
