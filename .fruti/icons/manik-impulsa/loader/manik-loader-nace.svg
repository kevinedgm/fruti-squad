<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 72 314 317" aria-hidden="true" focusable="false" class="manik-loader manik-loader--nace">
  <!-- Manik Impulsa · loader «nace»: el impulso se dibuja primero como una línea; la burbuja nace desde su cola alrededor de ella, se sostiene y se recoge (2.4 s). Requiere la variable CSS manik-bg con el color del fondo. -->
  <style>.manik-loader--nace .b{fill:var(--manik-color,#6e6eb5);transform-box:view-box;transform-origin:140px 368px;animation:manik-burbuja 2400ms cubic-bezier(.3,1.4,.5,1) infinite}.manik-loader--nace .k{fill:none;stroke-width:19.3;stroke-linecap:round;stroke-linejoin:round;stroke:var(--manik-color,#6e6eb5);stroke-dasharray:1 1;animation:manik-linea 2400ms infinite}.manik-loader--nace .g{fill:var(--manik-bg,#fff);animation:manik-hueco 2400ms infinite}@keyframes manik-burbuja{0%,30%{transform:scale(0)}50%,82%{transform:scale(1)}94%,100%{transform:scale(0)}}@keyframes manik-linea{0%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}28%,36%{stroke-dashoffset:0;opacity:1}48%,100%{stroke-dashoffset:0;opacity:0}}@keyframes manik-hueco{0%,36%{opacity:0}48%,82%{opacity:1}94%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.manik-loader--nace .b,.manik-loader--nace .k,.manik-loader--nace .g{animation:none}.manik-loader--nace .k{opacity:0}.manik-loader--nace{animation:manik-respira 1600ms ease-in-out infinite alternate}}@keyframes manik-respira{from{opacity:1}to{opacity:.55}}</style>
