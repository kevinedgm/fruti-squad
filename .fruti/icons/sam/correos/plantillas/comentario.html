<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light">
<title>Comentario nuevo en {{folio}}</title></head>
<body style="margin:0;padding:0;background:#f2f2ee">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">{{autor}}: {{comentario_corto}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f2f2ee" style="background:#f2f2ee"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px">
<tr><td style="padding:0 4px 16px"><img src="{{logo_url}}" width="140" height="40" alt="SAM, Simple Activity Manager" style="display:block;border:0"></td></tr>
<tr><td bgcolor="#ffffff" style="background:#ffffff;border:1px solid #d6d6d0;border-radius:10px;padding:28px 28px 32px">
<h1 style="margin:0 0 16px;font:700 23px/28px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0b">Comentario nuevo</h1><p style="margin:0 0 12px;font:400 16px/24px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0b"><b>{{autor}}</b> comentó en <span style="font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:14px">{{folio}}</span>:</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 0"><tr><td style="border-left:3px solid #d6d6d0;padding:4px 0 4px 14px;font:400 16px/24px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0b">{{comentario}}</td></tr></table><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0 0;border:1px solid #d6d6d0;border-radius:6px"><tr><td style="padding:14px 16px"><div style="font:500 12px/16px 'JetBrains Mono',Consolas,'Courier New',monospace;color:#55555c">{{folio}}</div><div style="font:600 16px/22px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0b;margin:4px 0 8px">{{titulo}}</div><div style="font:400 13px/18px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#55555c">{{chip}}&nbsp;&nbsp;{{meta}}</div></td></tr></table><table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0"><tr><td bgcolor="#c6f432" style="background:#c6f432;border:2px solid #0a0a0b;border-radius:6px"><a href="{{actividad_url}}" style="display:inline-block;padding:12px 22px;font:600 15px/20px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0a0a0b;text-decoration:none">Responder</a></td></tr></table>
</td></tr>
<tr><td style="padding:16px 4px 0;font:400 13px/19px Onest,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#55555c">Recibes este correo porque participas en esta actividad en SAM.<br>
<a href="{{preferencias_url}}" style="color:#0a0a0b;text-decoration:underline">Elegir qué avisos recibo</a></td></tr>
</table></td></tr></table></body></html>
