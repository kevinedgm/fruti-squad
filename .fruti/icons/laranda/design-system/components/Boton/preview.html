<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap"><style>
html,body{margin:0} body{background:var(--bg,#F6F4EF);color:var(--text,#15121C);font-family:var(--font-sans,"Onest",system-ui,sans-serif);font-size:16px;line-height:24px;padding:var(--space-4,16px);display:flex;gap:var(--space-3,12px);flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h,44px);padding:0 20px;border-radius:var(--radius-lg,14px);font-weight:700;font-size:16px;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn:focus-visible{outline:2px solid var(--focus,#5B3BB5);outline-offset:2px}
.b-reserve{background:var(--reserve,#D9A400);color:var(--on-reserve,#15121C)} .b-primary{background:var(--brand,#5B3BB5);color:var(--on-brand,#fff)} .b-secondary{background:transparent;color:var(--brand,#5B3BB5);border-color:var(--brand,#5B3BB5)} .b-ghost{background:transparent;color:var(--text,#15121C)} .b-danger{background:transparent;color:var(--danger,#A8202F);border-color:var(--danger,#A8202F)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:var(--radius-pill,999px);font-weight:600;font-size:14px;background:var(--brand-soft,#ECE7FA);color:var(--brand,#5B3BB5)} .chip svg{width:16px;height:16px;display:block} .chip.acc{background:var(--accent-soft,#F2C9B2);color:var(--text,#15121C)} .chip.sel{background:var(--brand,#5B3BB5);color:var(--on-brand,#fff)}
.field{display:grid;gap:6px;min-width:240px} .field label{font-size:14px;line-height:20px;font-weight:500} .field input{height:var(--control-h,44px);border:1px solid var(--border-control,#8A8595);border-radius:var(--radius-md,12px);background:var(--surface,#fff);color:var(--text,#15121C);padding:0 12px;font:inherit} .field input:focus-visible{outline:2px solid var(--focus,#5B3BB5);outline-offset:2px;border-color:var(--brand,#5B3BB5)} .field small{font-size:13px;color:var(--text-muted,#4F4B57)} .field.err input{border-color:var(--danger,#A8202F)} .field.err small{color:var(--danger,#A8202F)}
.card{background:var(--surface,#fff);border:1px solid var(--border,rgb(21 18 28/.10));border-radius:var(--radius-md,12px);padding:var(--space-4,16px);display:grid;gap:12px;width:min(100%,360px)} .card h3{margin:0;font-family:var(--font-display,"Bricolage Grotesque",sans-serif);font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.01em} .card p{margin:0;color:var(--text-muted,#4F4B57)} .av{width:56px;height:56px;border-radius:50%;background:var(--surface-sunken,#EAE6DE)} .row{display:flex;gap:12px;align-items:center} .meta{font-size:13px;color:var(--text-muted,#4F4B57)}
.estado{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-md,12px);font-weight:500;font-size:14px} .estado svg{width:16px;height:16px;display:block;flex:none} .e-ok{background:var(--success-soft,#DCF3E8);color:var(--on-success-soft,#0B5E3E)} .e-bad{background:var(--danger-soft,#F7DEE1);color:var(--on-danger-soft,#7A1522)} .e-flor{background:var(--brand-soft,#ECE7FA);color:var(--brand,#5B3BB5)}
.nav{display:flex;width:min(100%,390px);background:var(--surface,#fff);border-top:1px solid var(--border,rgb(21 18 28/.10));padding:6px 0 10px} .nav a{flex:1;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--text-muted,#4F4B57);text-decoration:none;min-height:44px;align-content:center} .nav a svg{width:22px;height:22px;display:block} .nav a.on{color:var(--brand,#5B3BB5)}
</style></head><body>
<button class="btn b-reserve">Reservar</button><button class="btn b-primary">Publicar perfil</button><button class="btn b-secondary">Ver agenda</button><button class="btn b-ghost">Cancelar</button><button class="btn b-danger">Cancelar cita</button></body></html>
