version: 1
owner: mora
purpose: canonical_documentation_contract

principles:
  - documentation_is_compiled_from_evidence
  - never_invent_missing_content
  - same_anatomy_for_all_documentable_artifacts
  - omit_non_applicable_sections_instead_of_filling_noise
  - preview_uses_real_component_or_verified_evidence
  - document_delta_not_history

sections:
  - id: overview
    order: 1
    required: true
    fields: [what_it_is, purpose, when_to_use, when_not_to_use]
    sources: [kiwi_handoff, lima_contract, registry]

  - id: preview
    order: 2
    required: conditional
    fields: [verified_preview, evidence_path]
    sources: [real_component, verified_harness, approved_static_evidence]
    forbid: [recreated_parallel_html, copied_component_css]

  - id: anatomy
    order: 3
    required: true
    fields: [parts, responsibilities]
    sources: [lima_contract, real_component]

  - id: variants
    order: 4
    required: conditional
    fields: [name, purpose, constraints]
    sources: [registry, lima_contract, public_api]

  - id: states
    order: 5
    required: true
    fields: [supported_states, trigger, visible_result]
    sources: [lima_contract, coco_compliance, real_component]

  - id: behavior
    order: 6
    required: true
    fields: [interactions, rules, edge_cases]
    sources: [real_component, public_api, kiwi_handoff]

  - id: adaptive
    order: 7
    required: conditional
    fields: [compact, medium, expanded, focus_and_state_continuity]
    sources: [kiwi_handoff, lima_contract, real_component]

  - id: accessibility
    order: 8
    required: true
    fields: [semantics, keyboard, focus, target, contrast, reduced_motion, known_limits]
    sources: [coco_compliance, audit_manifest, real_component]

  - id: api
    order: 9
    required: conditional
    fields: [props, events, slots, types]
    sources: [real_code, public_types]
    rule: code_owns_api

  - id: implementation
    order: 10
    required: true
    fields: [source_path, dependencies, usage_example]
    sources: [real_code, project_profile]

  - id: lifecycle_qa
    order: 11
    required: true
    fields: [status, version, owner, qa, last_audit, evidence]
    sources: [registry, coco_compliance]
    rule: registry_owns_lifecycle

missing_evidence:
  behavior: mark_missing_or_unverified
  never: infer_or_fabricate

output_rules:
  stable_order: true
  empty_sections: omit
  n_a: only_when_it_prevents_misinterpretation
  prose: concise
  evidence_links: preserve
